name: CI

on:
  push:
    branches: [master, main]
    # Only version tags. Anything else -- `snapshot/...`, `checkpoint/...` --
    # is a marker that points at a commit and publishes nothing, so it starts
    # no run at all. See "Tags that are not releases" in docs/VERSIONING.md.
    tags: ['v[0-9]*']
  pull_request:
  # Lets `release.yml` start these checks by hand on the release PR it opens.
  # It has to: GitHub raises no `pull_request` event for a PR the default
  # GITHUB_TOKEN created, so the four required contexts would never report and
  # that PR could never be merged. `workflow_dispatch` is the one trigger the
  # token is documented to still fire, which is the whole reason it is here.
  workflow_dispatch:

jobs:
  # A tag names a commit that already went through master, where these two jobs
  # ran on this exact tree. Re-running them proves nothing and makes tagging
  # feel expensive enough to avoid, so tags skip to version-consistency.
  build-and-test:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # gui as well as dev: the API tests import the FastAPI app, so
          # without the gui extras the suite fails at import time.
          pip install -e ".[dev,gui]"

      # The build fails loudly if any statistic cites a source that does not
      # exist in sources.yaml. This is the project's core guarantee, so it
      # runs on every PR.
      - name: Build database
        run: python -m counting_chicken_wings.build

      - name: Tests
        run: pytest -q

  citations:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Separate job so the "is every number cited?" answer is visible as
      # its own check rather than buried in the test log.
      #
      # This is also what Render runs in buildCommand, so a failure here
      # means the deploy would fail too. Keeping it as its own check makes
      # that visible before the push rather than after.
      - name: Every statistic must cite a source
        run: python -m counting_chicken_wings.audit

      # The README quotes how much of the corpus is unsourced, and that claim
      # drifted three times while hand-maintained -- last overstating the data's
      # quality, which is the direction that matters. It is generated now, and
      # this is the check that it was regenerated after a data change.
      - name: README corpus figures must be current
        run: python tools/update_readme.py --check

  # Guards the one thing a single-source-of-truth version cannot guard by
  # itself: that the tag someone typed matches what pyproject.toml declares.
  # Without this, `git tag v1.1.0` on a 1.0.0 tree publishes a release whose
  # own metadata contradicts its name, and nothing complains.
  # Does the bump match what actually changed? docs/VERSIONING.md versions by
  # CAPABILITY rather than volume, and that rule was unenforced -- the job
  # below checks only that a tag matches pyproject.toml, which says nothing
  # about whether MINOR was the right number to move.
  #
  # Advisory on pushes and pull requests, so day-to-day work is never blocked
  # by it; the failure is what you read before tagging. `fetch-depth: 0` and
  # `fetch-tags` are required because it builds the corpus at the previous tag
  # and diffs against this tree.
  release-check:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
      # On a PULL REQUEST, compare against the PR's own base rather than the
      # latest tag. Against the tag the diff carries everything anyone has
      # merged since the release, so an author reads "the published answer
      # moved" without being able to tell whether THEY moved it. Against the
      # base it is this branch's contribution alone, and the annotation
      # actually means something.
      #
      # On a push to master the latest tag is the right base: the question
      # there is "what does the next release owe", not "what did this commit
      # do".
      - name: Bump must match what changed
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "pull request: comparing against its base"
            python tools/release_check.py --explain \
              --base "${{ github.event.pull_request.base.sha }}"
          else
            python tools/release_check.py --explain
          fi

  # The only job a tag runs, and it exists for HAND-pushed tags alone.
  #
  # release.yml cuts the normal tag from `pyproject.toml`, so a bot tag cannot
  # disagree with it -- and could not be checked here anyway, because GitHub
  # raises no workflow event for a push made with the default GITHUB_TOKEN.
  # A tag someone types is the unguarded case, and it is the one this catches.
  version-consistency:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Tag must match pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import counting_chicken_wings as c; print(c.__version__)')"
          echo "tag:         $tag"
          echo "pyproject:   $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME declares $tag but the package reports $pkg. Bump pyproject.toml or retag."
            exit 1
          fi
          echo "versions agree"

      # The bump check used to run here and no longer does. It was enforcing
      # nothing: `actions/checkout@v4` without `fetch-depth: 0`/`fetch-tags`
      # leaves no tags in the clone, so `git describe` found none, the step
      # took its "no previous tag" branch and exited 0 on every tag it ever
      # ran on. release.yml now runs the real check BEFORE cutting the tag,
      # against the latest existing one -- which is the right moment for it,
      # since a release is easier to prevent than to retract.

      - name: Changelog must mention this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "$tag" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $tag."
            exit 1
          fi
          echo "changelog entry present"
