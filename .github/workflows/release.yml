name: Release

# Cut the tag and the release when master carries a version that has neither.
#
# WHY THIS EXISTS. Releasing was the one step of this pipeline nobody
# automated, and it quietly became the step that does not happen: v1.2.0
# through v1.7.0 sat untagged until six releases were backfilled in one batch,
# v1.9.0 was tagged by hand three hours after merging, and v1.9.1 and v1.10.0
# were merged, version-bumped, and never tagged at all. Eight misses is not
# forgetfulness, it is a missing job.
#
# It also fixes something worse than a late release. `ci.yml` gates BOTH of
# its version checks on `refs/tags/v*`, so an untagged release means the tag
# never runs them -- and `docs/VERSIONING.md`'s rules go back to being
# enforced by memory on a repo where several sessions cut releases the same
# day. See the gate steps below: they are those checks, moved earlier.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Releases are not a race. Two pushes landing together must not both decide
# they are the one that owns this version number.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write        # push the release branch, push the tag, cut the release
  pull-requests: write   # open the version PR and enable auto-merge on it
  actions: write         # dispatch ci.yml against the version PR -- see below

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, and enough history for release_check to diff the corpus
          # against the previous tag. A shallow clone has neither.
          fetch-depth: 0

      # Work from the CURRENT TIP of master, not from the SHA that triggered
      # this run. This is the replacement for the `git pull --rebase` the old
      # push-to-master step did, and it has to happen before anything reads
      # the changelog rather than after.
      #
      # Two merges landing seconds apart queue on the `release` concurrency
      # group above. The second one's trigger SHA does not contain the first
      # one's version commit, so computing a number from that tree would
      # rename an `## Unreleased` section that still holds the FIRST merge's
      # prose -- publishing it a second time under a second number. Starting
      # from master's tip collapses the pair correctly instead: whichever run
      # goes first releases everything unreleased, and the second finds
      # nothing left to release, computes nothing, and exits having done
      # nothing because there is genuinely nothing left to do.
      #
      # `.changes/` inherits that property rather than complicating it, and
      # arrives at it more directly: the first run merges every changeset it
      # finds and DELETES them in the same commit, so the second run's tree
      # has an empty directory. "What is unreleased" is a fact about the tree
      # at the moment of the run, which is exactly what starting from
      # master's tip exists to establish.
      - name: Work from the current tip of master
        run: |
          git fetch --tags --force origin master
          git checkout -B release-base FETCH_HEAD
          echo "operating on $(git rev-parse HEAD)"
          git log --oneline -1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # CI pins 3.12; a different one is a different result

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # THE NUMBER IS DECIDED HERE, not on the branch.
      #
      # Reading pyproject.toml only ever released the version master CURRENTLY
      # declared, which silently drops any release that another merge lands on
      # top of. That is not a corner case: v1.9.1 and v1.10.0 were both lost to
      # it within one hour on 2026-07-31.
      #
      # It also ends the race docs/VERSIONING.md warns about. A branch that
      # names a number has to hope no one else takes it during review -- v1.5.0
      # and v1.6.0 were both taken out from under a branch on 2026-07-30. A
      # branch now writes a `.changes/` entry and no number at all, so
      # whichever merge lands first takes the next one and the second computes
      # its own against a base that has already moved.
      #
      # A branch MAY name a bump LEVEL (`bump: second`) in that file, and that
      # is race-free for the same reason a number is not: a level is relative
      # and gets resolved HERE, against the tag that exists now. It can only
      # raise what release_check computed, never lower it -- see
      # docs/VERSIONING.md.
      - name: Decide this merge's version
        id: version
        run: |
          if next="$(python tools/next_version.py)"; then
            echo "this merge releases v$next"
            python tools/next_version.py --explain
            echo "computed=yes" >> "$GITHUB_OUTPUT"
            echo "next=$next"    >> "$GITHUB_OUTPUT"
          else
            echo "nothing unreleased (no .changes/ entries, no '## Unreleased' section); falling back to pyproject.toml"
            echo "computed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the number into the changelog and pyproject
        if: steps.version.outputs.computed == 'yes'
        run: python tools/next_version.py --apply

      - name: Does this version still need a tag or a release?
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c "
          import re,pathlib
          print(re.search(r'^version\s*=\s*\"([^\"]+)\"',
                pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The tag and the release are tracked SEPARATELY, because half-done
          # is a state this repo has actually been in: v1.2.0 through v1.7.0
          # carried tags for hours with no release published against them.
          # Keying only on the tag would make that state permanent -- the job
          # would see a tag, decide there was nothing to do, and never publish
          # the release. A crash between the two steps must be repairable by
          # rerunning.
          tag=no; rel=no
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1 || tag=yes
          gh release view "v$version" >/dev/null 2>&1 || rel=yes
          echo "need_tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "need_release=$rel" >> "$GITHUB_OUTPUT"

          if [ "$tag" = no ] && [ "$rel" = no ]; then
            echo "v$version is tagged and released; nothing to do."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "v$version needs: tag=$tag release=$rel"
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # The gates, run BEFORE the tag exists.
      #
      # ci.yml runs these on tag push, which cannot work here: GitHub
      # deliberately does not raise workflow-triggering events for pushes made
      # with the default GITHUB_TOKEN, so a tag this job creates would never
      # start CI and the checks would silently never run -- the exact failure
      # this workflow was written to end, reintroduced one layer down.
      #
      # Checking first is better regardless. A release that should not have
      # been cut is easier to prevent than to retract, and a tag is public the
      # moment it is pushed.
      # ---------------------------------------------------------------------

      - name: The release must be describable
        if: steps.need.outputs.go == 'yes'
        run: |
          python tools/release_notes.py --version "${{ steps.need.outputs.version }}" \
            > /tmp/notes.md
          python tools/release_notes.py --version "${{ steps.need.outputs.version }}" \
            --title > /tmp/title.txt
          echo "title: $(cat /tmp/title.txt)"

      - name: The bump must match what changed
        if: steps.need.outputs.go == 'yes'
        run: |
          # Against the latest EXISTING tag. The tag being cut does not exist
          # yet, which is the whole reason this runs here rather than after.
          # Version tags only: `--tags` alone would take a marker tag
          # (`snapshot/...`) newer than the last release and measure the bump
          # from a commit that was never released.
          prev="$(git describe --tags --abbrev=0                     --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "no previous tag; nothing to compare against"
            exit 0
          fi
          echo "comparing against $prev"
          python tools/release_check.py --base "$prev"

      # ---------------------------------------------------------------------
      # RECORDING THE NUMBER ON MASTER, THROUGH A PULL REQUEST.
      #
      # This step used to run `git push origin HEAD:master`. The
      # `protect-master` ruleset added on 2026-07-30 rejects that outright:
      #
      #   remote: - Changes must be made through a pull request.
      #   remote: - 4 of 4 required status checks are expected.
      #    ! [remote rejected] HEAD -> master
      #
      # and it took four consecutive merges with it (#44, #47, #48, #49),
      # losing the v1.12.0 that #44's own run computed. A bypass actor would
      # have made the push work again, but the ruleset is the thing that is
      # right here -- so the job goes through the front door like everyone
      # else. No PAT, no App, no new secret: the default GITHUB_TOKEN opens
      # the PR, and the branch is deleted on merge.
      #
      # The computed number still has to reach master BEFORE the tag is cut,
      # because the tag must name a commit whose pyproject.toml agrees with
      # it -- that agreement is exactly what `version-consistency` checks for
      # anyone who tags by hand later. So this step WAITS for the merge; it
      # does not fire and forget.
      # ---------------------------------------------------------------------
      - name: Open the pull request that records the version
        id: pr
        if: steps.version.outputs.computed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # Explicit pathspecs. `--apply` writes these files and nothing else,
          # and a stray file swept into a release commit is not a thing anyone
          # reviews.
          #
          # `.changes/` is a DELETION: --apply merges each changeset's prose
          # into the section above and unlinks the file. Belt and braces --
          # `--apply` stages those deletions itself, precisely so this line
          # cannot silently drop them in a later edit. Left unstaged the notes
          # would ship, the files would stay on master, and the next release
          # would publish every one of them a second time.
          git add CHANGELOG.md pyproject.toml .changes
          git commit -m "Release v$VERSION" -m \
            "Number assigned at merge by .github/workflows/release.yml. Branches
          write a .changes/ entry and never claim a number, so two merges
          landing together cannot take the same one. A branch may declare a
          bump LEVEL, which can raise the computed floor and never lower it --
          see docs/VERSIONING.md."

          # An earlier run for this same number may have left the branch
          # behind. Which of the two cases it is decides what to do, and
          # getting it wrong either wedges every future release or stamps on
          # work in flight:
          #
          #   branch + OPEN PR -- a run is still in progress, or one needs a
          #     human (a conflict, a red check). Fail; do not touch it.
          #   branch, NO PR    -- debris from a run that died between the push
          #     and the merge. Nothing references it and its content is
          #     recomputed from scratch each run, so clear it and carry on.
          #     This is not hypothetical: the first live run of this mechanism
          #     died exactly here, because "Allow GitHub Actions to create and
          #     approve pull requests" was off.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            open="$(gh pr list --head "$branch" --state open --json number --jq 'length')"
            if [ "$open" != "0" ]; then
              echo "::error::$branch already has an open PR. A release for v$VERSION is in flight or stuck; resolve it by hand."
              exit 1
            fi
            echo "::warning::$branch left over from a failed run with no PR; replacing it"
            git push origin --delete "$branch"
          fi
          git push origin "$branch"

          {
            echo "\`pyproject.toml\` and \`CHANGELOG.md\`, carrying the number this"
            echo "merge was assigned. Opened by \`.github/workflows/release.yml\`;"
            echo "the tag and the GitHub release are cut once this lands."
            echo
            echo "Nothing here is hand-written — see \`docs/VERSIONING.md\`."
          } > /tmp/pr-body.md

          url="$(gh pr create --base master --head "$branch" \
                   --title "Release v$VERSION" --body-file /tmp/pr-body.md)"
          echo "opened $url"
          num="${url##*/}"
          echo "number=$num" >> "$GITHUB_OUTPUT"
          echo "url=$url"    >> "$GITHUB_OUTPUT"

          # GitHub raises no workflow-triggering event for anything done with
          # the default GITHUB_TOKEN -- the same rule this file already cites
          # for bot-pushed tags. That means the `pull_request` trigger in
          # ci.yml does NOT fire for a PR this job opens, so its four required
          # checks would sit "Expected" forever and auto-merge would never
          # fire. `workflow_dispatch` is the documented exception, so ask for
          # the run explicitly, against the PR's own head. The checks really
          # run, on the exact tree being merged; nothing is stubbed or
          # reported green on its behalf.
          #
          # "Does not fire" is not the whole truth, and the half that is
          # missing wedged the v1.12.1 release. GitHub still CREATES the
          # `pull_request` run and parks it at `action_required`, where it
          # holds the required contexts and pins the PR at BLOCKED. The wait
          # step below approves it. Read approve_stalled_runs there before
          # trusting the paragraph above.
          gh workflow run ci.yml --ref "$branch"
          echo "dispatched ci.yml on $branch"

          # Merge the moment the checks go green, with no window in which
          # someone else's merge can slip in front. If auto-merge is switched
          # off at the repo level this errors, which is not fatal -- the wait
          # below merges it directly instead.
          gh pr merge --auto --squash --delete-branch "$num" \
            || echo "::warning::auto-merge unavailable; will merge directly once green"

      - name: Wait for it to land
        id: landed
        if: steps.version.outputs.computed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 2400 ))   # 40 min; a full CI run is ~5

          # ---------------------------------------------------------------------
          # Clear GitHub's "this run needs a human to approve it" gate.
          #
          # The comment on the dispatch step above is not quite right, and
          # v1.12.1 is what corrected it. GITHUB_TOKEN raises no
          # workflow-triggering event, so the run never STARTS -- but GitHub
          # still CREATES a `pull_request` run for the bot's PR and parks it at
          # conclusion `action_required`. That parked run carries the same four
          # context names the ruleset requires, so it pins the PR at BLOCKED
          # forever, and the workflow_dispatch run passing alongside it does not
          # release it. Observed on the v1.12.1 release: three green checks from
          # the dispatched run, `gh pr checks` reporting "no checks reported on
          # the branch", and the job waiting out its full 40 minutes for a merge
          # that could never happen. Approving the parked run by hand let the
          # checks report and the PR merged within a minute.
          #
          # So approve it here rather than requiring a human at 11pm. This is
          # not a bypass: approving makes the required checks actually RUN, on
          # the real tree, and they still have to pass. The alternative
          # considered and rejected was loosening
          # `fork-pr-contributor-approval` repo-wide, which would also stop
          # gating first-time human contributors -- a real cost on a public
          # repo, to fix a bot problem.
          #
          # Lives in the poll loop, not in a one-shot step after the dispatch,
          # because the parked run can appear after the dispatch returns, and
          # `gh pr update-branch` in the BEHIND case creates a fresh one that
          # needs the same treatment.
          # ---------------------------------------------------------------------
          approve_stalled_runs() {
            local ids id
            ids="$(gh api \
                    "repos/$GITHUB_REPOSITORY/actions/runs?branch=$BRANCH&event=pull_request&per_page=20" \
                    --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id' \
                    2>/dev/null || true)"
            [ -n "$ids" ] || return 0
            for id in $ids; do
              echo "run $id was held for approval; approving so the checks can report"
              gh api -X POST \
                "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null 2>&1 \
                || echo "::warning::could not approve run $id -- approve it by hand"
            done
          }

          while :; do
            read -r state status <<<"$(gh pr view "$PR" \
              --json state,mergeStateStatus --jq '[.state, .mergeStateStatus] | @tsv')"
            echo "pr #$PR: state=$state merge=$status"

            case "$state" in
              MERGED) break ;;
              CLOSED)
                echo "::error::PR #$PR was closed without merging. v$VERSION was not recorded."
                exit 1 ;;
            esac

            case "$status" in
              DIRTY)
                # A conflict in CHANGELOG.md. Not resolvable here, and
                # guessing at it would file someone's prose under the wrong
                # heading -- the exact failure docs/VERSIONING.md warns about.
                echo "::error::PR #$PR conflicts with master. Resolve it by hand; the tag was not cut."
                exit 1 ;;
              BEHIND)
                # strict_required_status_checks_policy is on, so a merge that
                # landed while this waited makes the PR stale. Restack and
                # re-run the checks against the new head.
                echo "master moved; updating the branch"
                gh pr update-branch "$PR" || true
                sleep 10
                gh workflow run ci.yml --ref "$BRANCH" || true ;;
              BLOCKED)
                # Either the checks are still running -- in which case this is
                # a no-op and costs one API call -- or one of them is a run
                # parked awaiting approval, which is the case that used to sit
                # here until the deadline. See approve_stalled_runs above.
                approve_stalled_runs

                # required_approving_review_count keeps mergeStateStatus
                # BLOCKED forever for this bot's own PR -- it has no reviewer
                # and never will, so protect-master's bypass list now
                # includes the GitHub Actions app for exactly this PR. Only
                # reach for that bypass once every required check has
                # independently reported pass: --admin bypasses ALL branch
                # protection, not just the review requirement, so calling it
                # on an unverified BLOCKED (checks still running) would merge
                # an unfinished build.
                if [ "$(gh pr view "$PR" --json reviewDecision --jq .reviewDecision)" \
                    = "REVIEW_REQUIRED" ] \
                  && [ "$(gh pr checks "$PR" --required --json bucket \
                      --jq '[.[].bucket] | unique == ["pass"]' 2>/dev/null)" \
                    = "true" ]; then
                  echo "review is the only blocker and required checks are green; merging as an admin"
                  gh pr merge --squash --admin --delete-branch "$PR" || true
                fi ;;
              CLEAN)
                # Checks green and mergeable. If --auto took, this merges
                # itself in a moment; if it did not, do it here.
                gh pr merge --squash --delete-branch "$PR" || true ;;
            esac

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::PR #$PR did not merge within 40 minutes (state=$state, merge=$status)."
              echo "::error::v$VERSION is NOT tagged or released. See ${{ steps.pr.outputs.url }}"
              exit 1
            fi
            sleep 20
          done

          # The squash commit is the first commit ON MASTER whose
          # pyproject.toml declares this version, which is where the tag
          # belongs. Read it rather than taking master's tip: another merge
          # may already have landed on top, and a tag one commit too far
          # forward would silently fold somebody else's change into this
          # release and make `version-consistency` a lie for the next person
          # who checks it.
          sha="$(gh pr view "$PR" --json mergeCommit --jq .mergeCommit.oid)"
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "::error::PR #$PR merged but reported no merge commit; refusing to guess where the tag goes."
            exit 1
          fi
          echo "recorded as $sha on master"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.need.outputs.go == 'yes' && steps.need.outputs.need_tag == 'yes'
        env:
          VERSION: ${{ steps.need.outputs.version }}
          # Empty on the fallback path (nothing unreleased, so nothing was
          # recorded), where master already declares the version and its tip
          # is the right place for the tag.
          SHA: ${{ steps.landed.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force origin master

          target="${SHA:-$(git rev-parse FETCH_HEAD)}"
          # Belt and braces: whatever we are about to name v$VERSION must
          # actually say so. This is the invariant the whole PR dance exists
          # to preserve, so assert it rather than assume it.
          declared="$(git show "$target:pyproject.toml" \
            | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -1)"
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::$target declares version '$declared', not '$VERSION'. Not tagging."
            exit 1
          fi

          # Annotated, because every tag this repo already carries is.
          git tag -a "v$VERSION" -m "$(cat /tmp/title.txt)" "$target"
          git push origin "refs/tags/v$VERSION"
          echo "tagged v$VERSION at $target"

      - name: Release
        if: steps.need.outputs.go == 'yes' && steps.need.outputs.need_release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.need.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "$(cat /tmp/title.txt)" \
            --notes-file /tmp/notes.md
          echo "released v$VERSION"

      # THE RELEASE MERGE DOES NOT DEPLOY ITSELF.
      #
      # `deploy.yml` triggers on `push` to master, and this job merges its
      # version PR with the default `GITHUB_TOKEN`. GitHub raises no
      # workflow-triggering event for anything done with that token, so the
      # push that lands the release is the one push to master that never
      # deploys. Observed on v1.12.1: merged at 23:41, and the newest Deploy
      # run was still the human push at 23:38. The site served the previous
      # release with nothing anywhere reporting a failure, because no run
      # existed to be red. Human pushes deploy fine, which is exactly what
      # makes the gap easy to miss.
      #
      # The restriction is on the event CASCADE, not on the dispatch API: a
      # `workflow_dispatch` made with `GITHUB_TOKEN` does start the target
      # workflow. So ask for the run explicitly rather than waiting for one
      # that cannot arrive. `actions: write` above already covers it -- the
      # same permission that dispatches ci.yml for the version PR.
      #
      # Dispatched on `master`, not on the tag, because deploys track the
      # branch (see deploy.yml's header) and the tag may already be behind if
      # another merge landed on top. Deploy's own "verify what is actually
      # serving" step is what catches a wrong commit; its precondition is that
      # a run exists at all.
      #
      # Failing to dispatch does not fail the release. The tag is cut and the
      # release is published by this point, and retracting those to report an
      # undeployed site would be strictly worse than saying so and leaving a
      # one-click `workflow_dispatch` to a human. A warning is an annotation
      # on a green run, which is the honest shape of "released, not deployed".
      #
      # CONDITION IS `go`, NOT `landed.sha != ''` -- the second version of
      # this bug, hit on v1.19.0 the same day this comment block already
      # described the first one. `landed` only sets `sha` when THIS run
      # itself opened and waited on a version PR (`computed == 'yes'`). A run
      # that finds the version already on master -- because an earlier run's
      # PR merged, but that earlier run never reached this step, or GitHub
      # never fired a `push` event for its own merge, which is the exact
      # failure this whole file exists to route around -- has `computed=no`
      # and `landed.sha` empty, but can still have `go=yes` from `Does this
      # version still need a tag or a release?`. That run tagged and released
      # v1.19.0 correctly and then skipped this step, silently, because
      # `landed.sha` was never set. Observed: v1.18.0 stayed live for ~50
      # minutes after v1.19.0 was tagged and released, and nothing was red.
      #
      # `go` is exactly the signal Tag and Release already use, and it is
      # correct here for the same reason: this step should run whenever this
      # job did release work, full stop, regardless of which earlier step
      # (or which earlier RUN) is the reason `need_tag`/`need_release` came
      # back yes. By the time this step's condition is evaluated, Tag and
      # Release have either succeeded or the job has already failed and
      # skipped everything after -- so `go == 'yes'` here cannot mean
      # "nothing was actually released."
      - name: Deploy the release
        if: steps.need.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.need.outputs.version }}
        run: |
          set -euo pipefail
          if gh workflow run deploy.yml --ref master; then
            echo "dispatched deploy.yml on master for v$VERSION"
          else
            echo "::warning::could not dispatch deploy.yml -- v$VERSION is released but NOT deployed. Run the Deploy workflow on master by hand."
          fi
