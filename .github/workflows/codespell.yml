name: Codespell

on:
  push:
  pull_request:

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codespell-project/actions-codespell@v2
        with:
          # ONS = UK Office for National Statistics, CNA = Comisión Nacional
          # del Agua (Mexico), avance = Spanish in cited source titles.
          ignore_words_list: ons,cna,avance
