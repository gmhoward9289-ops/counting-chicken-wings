# United Kingdom broiler figures, from DEFRA's monthly poultry statistics
# and the annual "Agriculture in the United Kingdom" publication.
# Hand-curated, unlike data/output_israel.yaml which is machine-generated by
# a parser -- there is no repeat monthly extraction pipeline for the UK yet,
# so this file is a snapshot of the 2026-08-16 downloads. Re-verify against
# docs/research/library/poultry-uk.yaml before extending it.
#
# THE HEADLINE DIFFERENCE FROM ISRAEL: DEFRA publishes head_slaughtered
# directly, at government grade, UK-wide. Israel's whole plan exists because
# CBS does not; the UK is the case where the US-shaped question ("how many
# birds") gets a straight government answer instead of an industry proxy.
#
# WHY THIS IS NOT IN slaughter_stat_year, even though it easily could be.
# That table bakes US units into its column names (live_weight_lb,
# certified_rtc_lb) and DEFRA reports in kilograms and metric tonnes, not
# pounds. Converting at load would be deciding a number on the reader's
# behalf; output_stat_year keeps the unit as data instead, exactly as it
# does for Israel. See the table's own header comment in schema.sql.
#
# NO SUBNATIONAL BLOCK. DEFRA stopped publishing any nation-level breakdown
# in July 2025 "to protect commercial confidentiality across the nations",
# and even before that cutoff the only split was England & Wales versus UK
# total -- never a genuine four-nation (England/Scotland/Wales/Northern
# Ireland) breakdown. So unlike Israel, which has a real 47-region table,
# the UK ships national figures only. This is a deliberate omission, not an
# oversight -- see docs/UK-PLAN.md.
#
# UNITS: nothing here is converted, and nothing is re-scaled either --
# output_israel_quarterly.yaml sets that rule for a reason worth repeating
# ("Expanding would have been a conversion, which is the thing that rule
# forbids, however harmless a factor of 1,000 looks") and it applies here
# just as much. DEFRA states "Units: Million Birds" for both slaughter and
# placings, and "Units: Thousand Tonnes Carcase Weight" for production --
# every value below is left at that native scale, not multiplied out to
# head or tonnes, so a reader who wants raw head or tonnes must multiply
# deliberately and cannot get there by reading the value column alone.
# Carcase weight (not live weight) is DEFRA's own stated basis for the
# tonnage, per its footnote 1 -- unlike Israel's CBS tonnage, which never
# states its basis at all.

species: broiler
country: GBR

national:
  # Slaughterings_Annual, column "Broilers UK". This is the figure Israel's
  # CBS could not provide at all -- a government-enumerated head count, not
  # an industry estimate from a press interview.
  - measure: head_slaughtered
    unit: million_head
    confidence: measured
    source: defra-poultry-slaughter-2026-07
    notes: >-
      DEFRA's own methodology note: figures from July 2020 onward for
      England & Wales come from the Food Standards Agency's slaughterhouse
      survey (covering all E&W slaughterhouses); Scotland and Northern
      Ireland continue a separate, pre-2020-style methodology. All years are
      provisional and subject to revision per DEFRA's stated revisions
      policy -- this is a live government survey, not a settled census.
    years:
      - {year: 2024, value: 1131.6}
      - {year: 2023, value: 1118.3}
      - {year: 2022, value: 1100.3}
      - {year: 2021, value: 1123.2}
      - {year: 2020, value: 1096.7}

  # Production_Annual, column "Broilers". Whole-bird-equivalent carcase
  # weight net of offal, per the sheet's own footnote 1 -- a stated basis.
  - measure: meat_output
    unit: thousand_tonnes_carcase_weight
    confidence: measured
    source: defra-poultry-slaughter-2026-07
    notes: >-
      Left in DEFRA's own thousand-tonnes scale rather than expanded to
      tonnes -- see the file header. Divide by head_slaughtered above (after
      converting both to a common scale) for an implied carcase weight per
      bird: about 1.62 kg for 2024, lower than the 2.3 kg England & Wales
      LIVEweight figure by roughly the dressing-out percentage a broiler
      loses in processing -- consistent, not a discrepancy.
    years:
      - {year: 2024, value: 1832.7}
      - {year: 2023, value: 1798.6}
      - {year: 2022, value: 1783.1}
      - {year: 2021, value: 1770.4}
      - {year: 2020, value: 1695.8}

  # UK_Placings_Annual, column "Commercial Broilers UK". A throughput PROXY,
  # not throughput itself -- grow-out mortality sits between a chick placed
  # and a bird slaughtered, exactly the same caveat Israel's chicks_placed
  # rows carry. Kept for the same reason Israel's is kept: an independent
  # check on the head-slaughtered figure from a second DEFRA survey.
  - measure: chicks_placed
    unit: million_head
    confidence: measured
    source: defra-poultry-hatcheries-2026-07
    notes: >-
      1,163.1 million placed in 2024 against 1,131.6 million slaughtered the
      same year is a ~2.7% gap, consistent with ordinary grow-out mortality
      rather than a measurement conflict. Do not substitute for
      head_slaughtered -- see the header of this file.
    years:
      - {year: 2024, value: 1163.1}
      - {year: 2023, value: 1129.5}
      - {year: 2022, value: 1145.9}

  # Table 14.2 of Agriculture in the United Kingdom 2024. Volume-based, per
  # the table's own footnote -- comparable to the head/tonnage figures
  # above, not a value ratio wearing the same name. The UK's answer to the
  # "self-sufficiency / import share" question ISRAEL-PLAN.md flagged as
  # unusual for Israel (a net surplus producer): the UK is the more typical
  # case, an 83% self-sufficient net importer of the rest.
  - measure: self_sufficiency_ratio
    unit: percent
    confidence: measured
    source: defra-agriculture-uk-2024
    notes: >-
      Poultry meat production-to-supply ratio, by volume: 84% (2022), 82%
      (2023), 83% (2024, provisional per the source's own footnote 1).
    years:
      - {year: 2024, value: 83, provisional: 1}
      - {year: 2023, value: 82}
      - {year: 2022, value: 84}
