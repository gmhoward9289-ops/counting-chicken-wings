# Points of fact surfaced in the learning centre and alongside results as
# the user works through a question.
#
# Every fact carries a source. Facts with placement 'result' appear next to
# the answer; 'learning' facts live in the learning centre; 'both' appear in
# either. surprise ranks how counterintuitive a fact is - the UI leads with
# high-surprise facts because those are what make people keep reading.

facts:
  - slug: two-wings-hard-floor
    headline: A chicken has exactly two wings
    body: >-
      This is the only hard constant in the whole model. Every other number
      here is an estimate layered on top of it. Twelve wings cannot come
      from fewer than six chickens - not on the best day, not at any plant,
      not anywhere. That is why the answer is "6 or more" rather than
      "about 6".
    source: wing-yield-eight-strains
    placement: both
    surprise: 2

  - slug: ohio-vs-north-carolina
    headline: An Ohio chicken weighs half what a North Carolina chicken does
    body: >-
      Ohio averaged 4.6 lb live weight in 2025; North Carolina averaged
      8.4 lb. Same country, same year, same species - but they are different
      businesses. Ohio runs small birds for fast food and tray pack; North
      Carolina runs big birds for deboning. A pound of wings from each state
      represents a very different number of chickens.
    source: nass-poultry-slaughter-2025
    placement: both
    surprise: 5

  - slug: wings-most-damaged-part
    headline: Wings are the most damaged part of the chicken, by far
    body: >-
      Median wing injuries run 5.7% per load. Legs, breast, and shoulders
      are each under 1%. Wings stick out, they get caught, and they break
      during catching, loading, and shackling. This is the single largest
      loss in the model and the main reason it takes more than six chickens.
    source: wing-injuries-loading
    placement: both
    surprise: 4

  - slug: bruising-happens-at-the-end
    headline: 90% of bruising happens in the last 12 to 24 hours
    body: >-
      Not during the seven weeks of grow-out - during catching, loading,
      transport, and shackling. By body region, bruises land on the breast
      42% of the time, wings 33%, legs 25%. Almost all the damage in a
      47-day life happens on the final day.
    source: welfare-training-carcass-quality
    placement: learning
    surprise: 5

  - slug: nineteen-billion-wings
    headline: The US produced 19.16 billion whole wings in 2025
    body: >-
      9,579,797,000 broilers were slaughtered, and each had two wings. That
      is about 56 whole wings for every person in the country, every year.
    source: nass-poultry-slaughter-2025
    placement: learning
    surprise: 3

  - slug: dressing-yield
    headline: About three quarters of a live chicken becomes sellable meat
    body: >-
      63.44 billion lb went in live; 48.01 billion lb came out ready-to-cook.
      That is a dressing yield of 75.67% - and it is not an estimate. It
      falls straight out of two totals USDA measures directly.
    source: derived-dressing-yield
    placement: learning
    surprise: 3

  - slug: menu-wing-ambiguity
    headline: A restaurant "dozen wings" usually is not twelve wings
    body: >-
      It is normally twelve PIECES - drumettes and flats. Each whole wing
      splits into a drumette, a flat, and a tip, and the tip is diverted to
      stock or rendering. So twelve pieces is six whole wings, which is
      three chickens' worth of anatomy. This single ambiguity changes the
      answer more than every processing loss combined.
    source: boneless-wing-method
    placement: both
    surprise: 5

  - slug: flat-beats-drumette
    headline: The flat has a better meat yield than the drumette
    body: >-
      The drumette is heavier - 39.9 g against 30.7 g bone-in - but the flat
      yields 80.1% boneless meat against the drumette's 74.9%. Bigger does
      not mean meatier.
    source: boneless-wing-method
    placement: learning
    surprise: 4

  - slug: mortality-rising
    headline: Broiler mortality has been getting worse since 2013
    body: >-
      It hit a historic low of 3.7% in 2013 and has climbed to 5.93% by 2024,
      even as feed conversion kept improving from 1.75 to 1.69. Birds are
      more efficient than they have ever been and also dying more often.
    source: ncc-broiler-performance
    placement: learning
    surprise: 4

  - slug: condemnation-is-tiny
    headline: FSIS condemns less than half a percent
    body: >-
      Post-mortem condemnation ran 0.45% in 2025 and 0.46% in 2024 -
      remarkably stable. People expect this to be the big loss in the
      system. It is one of the smallest.
    source: nass-poultry-slaughter-2025
    placement: learning
    surprise: 4

  - slug: top-four-concentration
    headline: Four companies produce well over half the chicken in America
    body: >-
      Tyson at 21.3%, Pilgrim's Pride at 15.8%, and Wayne-Sanderson at 14.4%
      lead a top four holding roughly 58% of national output across about
      180 plants. A wing picked at random has better than even odds of
      coming from one of four companies.
    source: wattpoultry-top-producers
    placement: learning
    surprise: 3

  - slug: grading-splits-wings
    headline: Size grading deliberately separates a bird's two wings
    body: >-
      Wings are weighed individually and sorted into jumbo, large, and
      medium. Two wings off the same bird rarely weigh exactly the same, so
      whenever they straddle a grade boundary they are routed into different
      boxes. The supply chain is not merely shuffling wings - at this step
      it is actively pulling pairs apart.
    source: project-estimate-mixing
    placement: both
    surprise: 5

  - slug: cook-loss-irrelevant
    headline: Cooking changes the weight, never the count
    body: >-
      Frying costs a wing roughly 20% of its mass, which matters a great
      deal for food cost and not at all here. Twelve wings go into the
      fryer, twelve wings come out. Cook loss has zero effect on how many
      chickens it took.
    source: project-estimate-unsourced
    placement: learning
    surprise: 3

  - slug: line-speed-and-broken-wings
    headline: Some plants run 175 birds a minute, others 140
    body: >-
      Plants under the New Poultry Inspection System may run 175 birds per
      minute; everyone else is capped at 140. That matters for wings
      specifically, because the damage that breaks them happens at
      shackling, and comment records tie faster lines to birds being hung
      improperly. Regulators counter that fast plants meet food safety
      standards - which is true, and a different question. Salmonella
      performance tells you nothing about how many wings got broken.
    source: fsis-line-speed-rule
    placement: learning
    surprise: 4

  - slug: chilling-changes-weight-not-count
    headline: How a plant chills its birds swings wing weight by 10%
    body: >-
      Air chilling makes a carcass LOSE about 2.5-2.8% of its weight.
      Immersion chilling makes it GAIN 4% and sometimes over 9%. That gap is
      larger than any loss in this entire model - and it cannot change the
      answer by a fraction, because chilling changes what a wing weighs, not
      how many wings a chicken has. Buy wings by the pound and it matters
      enormously. Order a dozen and it does not matter at all.
    source: chilling-method-yield
    placement: both
    surprise: 5

  - slug: chunks-are-breast-too
    headline: The "chunks" are not wing either
    body: >-
      Tyson files boneless wings under "boneless wings & chunks", which
      invites the question of whether chunks are a different cut. They are
      not. The ingredient statement reads "boneless, skinless chicken breast
      chunks with rib meat" - and rib meat is the portion left attached to
      the breast when it is deboned, part of the front quarter. It is not
      wing. Neither product contains any wing meat at all.
    source: tyson-foodservice-chunks
    placement: both
    surprise: 4

  - slug: wings-is-a-regulated-word
    headline: '"Wings" is a regulated word, and boneless wings comply with it'
    body: >-
      USDA standards say a product labelled wings must be the entire wing,
      all muscle and skin intact, with only the tip removable - and that
      where bone has been removed the name must say so. "Boneless wing"
      satisfies that rule by disclosing the missing bone. The label is not a
      loophole; it is doing exactly what the regulation asks, which is why
      the name survives despite containing no wing.
    source: fsis-poultry-labeling-standards
    placement: learning
    surprise: 4

  - slug: bird-flu-is-an-egg-story
    headline: Bird flu barely touches chicken wings
    body: >-
      168.62 million birds have been lost to avian influenza since 2022, and
      the headlines are relentless - but roughly 75% of those were egg-laying
      hens and 11% turkeys. Broilers were about 8%, which works out near
      0.05% of the 9.58 billion broilers slaughtered each year. Broilers live
      only 47 days, sit on smaller farms, and get restocked fast, so their
      cumulative exposure is low. Bird flu moves the price of eggs. It does
      not meaningfully move the price or supply of wings.
    source: crs-hpai-outbreak
    placement: both
    surprise: 5

  - slug: nearly-every-breast-is-striped
    headline: 96% of chicken breasts now show white striping
    body: >-
      White striping appears in essentially every commercial fillet. Severe
      woody breast runs about 12%, up from roughly 5% in 2012, and spaghetti
      meat 36%. More than 85% of fillets show more than one of these at once.
      Crucially the risk rises with live weight - so the big-bird deboning
      flocks that boneless product comes from are the worst affected. The
      real wing has no equivalent problem: wings are small working muscles
      and simply do not develop these myopathies.
    source: myopathy-prevalence-ontario
    placement: learning
    surprise: 5

  - slug: farmer-gets-twelve-cents
    headline: The farmer got about twelve cents for your dozen wings
    body: >-
      Contract growers are paid 3.8 to 4.6 cents per pound of live weight.
      Six birds at 6.62 lb is 39.7 lb, so raising them earned the grower
      roughly $1.67 - and charging only the wings' share of that bird, about
      12 cents. Growers are paid on a relative "tournament" basis against
      other farms delivering the same week, so two people doing identical
      work can be paid differently.
    source: ers-broiler-grower-fees
    placement: both
    surprise: 5

  - slug: feed-behind-a-dozen-wings
    headline: A dozen wings represents about five pounds of feed
    body: >-
      At a feed conversion of 1.69 and a 6.57 lb market weight, one broiler
      eats about 11 lb of feed. The six birds behind a dozen wings ate
      roughly 67 lb between them - but the wings are only about 7% of the
      bird, so their honest share is close to 4.9 lb of corn and soy. The
      rest of that feed became somebody else's breast fillet.
    source: ncc-broiler-performance
    placement: learning
    surprise: 4

  - slug: footprint-must-be-allocated
    headline: A dozen wings is not six chickens' worth of carbon
    body: >-
      One broiler carries about 2.90 kg of CO2 equivalent across its whole
      life. It is tempting to multiply that by six - but wings are only
      about 7% of the bird, and the breast, thighs and drums went to other
      plates. Allocated by mass, a dozen wings carries closer to 1.3 kg CO2
      equivalent. Charging the whole bird to the wings would overstate it
      roughly fourteenfold.
    source: ncc-broiler-lca-2020
    placement: learning
    surprise: 4

  - slug: chicken-footprint-falling
    headline: Chicken's footprint per bird has fallen every year
    body: >-
      Between 2010 and 2020 the industry cut greenhouse gas per kg of live
      weight by 18%, fossil resource use by 22%, and land and water use by
      13% each. Most of that came from feed efficiency: production rose 21%
      while feed consumption rose only 11%. The same efficiency drive that
      makes birds heavier and cheaper also made them lighter on the planet
      per pound.
    source: ncc-broiler-lca-2020
    placement: learning
    surprise: 4

  - slug: wings-are-mostly-fat-calories
    headline: About 60% of a wing's calories come from fat
    body: >-
      A raw whole wing with skin runs 191 kcal and 17.5 g of protein per
      100 g. Wings carry a high skin-to-meat ratio because they are mostly
      skin, bone, and small muscles - that is inherent to the cut, before
      anyone has breaded or fried it.
    source: usda-fdc-wing-raw
    placement: both
    surprise: 3

  - slug: breading-adds-carbs-not-density
    headline: Breading a wing lowers its calories per gram
    body: >-
      A breaded fried wing measures about 180 kcal per 100 g against 191 for
      raw - which reads backwards until you notice why. Breading adds
      carbohydrate and absorbed water, so the piece gets heavier faster than
      it gets more caloric. The wing on your plate has more total calories;
      it is simply less calorie-dense per gram. Chicken itself contains no
      carbohydrate at all, so every gram of carb in a fried wing is breading.
    source: usda-fdc-wing-fried
    placement: learning
    surprise: 5

  - slug: boneless-wings-contain-no-wing
    headline: A boneless wing contains no wing meat
    body: >-
      It is breast meat, cut into chunks and breaded. Tyson's own foodservice
      catalogue files the product under "boneless wings & chunks" and
      describes it as whole muscle chicken breast - the industry is not
      hiding this, the name just does not mean what it says. The honest
      count of wings in a dozen boneless wings is zero.
    source: tyson-foodservice-boneless
    placement: both
    surprise: 5

  - slug: boneless-takes-a-third-of-a-chicken
    headline: A dozen boneless wings takes about a third of a chicken
    body: >-
      A 6.62 lb broiler carries roughly 691 g of boneless breast, and a
      commercial boneless wing is about 20 g of raw breast meat - so one bird
      makes around 34 of them. Twelve pieces is therefore about 0.35 of a
      chicken. A dozen bone-in wings needs six whole chickens. Same menu
      section, same price bracket, and roughly a seventeenfold difference in
      how many birds it took.
    source: tyson-foodservice-boneless
    placement: both
    surprise: 5

  - slug: boneless-portion-is-not-anatomy
    headline: How many boneless wings a chicken makes is a business decision
    body: >-
      A chicken has exactly two wings and no processor can change that. But
      the number of boneless wings per bird depends purely on how large the
      chunks are cut - somewhere between 25 and 43 pieces per bird for
      plausible portion sizes. For bone-in wings the floor is anatomy. For
      boneless it is a portioning choice, which is why this project stores
      the two with different confidence.
    source: tyson-foodservice-boneless
    placement: learning
    surprise: 4

  - slug: wing-tips-are-a-third-segment
    headline: Every wing has a third segment you never see
    body: >-
      A whole wing is a drumette, a flat, and a tip. The tip is mostly skin,
      bone, and cartilage with almost no meat, so it is cut off and diverted
      before the wings ever reach a restaurant. When a menu says twelve
      wings, twelve tips went somewhere else.
    source: boneless-wing-method
    placement: both
    surprise: 4

  - slug: wing-tips-are-an-export-business
    headline: Wing tips and chicken paws are a $648 million export market
    body: >-
      What Americans discard, China buys. Wing tips and paws are sold there
      for soups, stews, and snacking, and together they make up roughly a
      $648 million annual US export market. Paws fetch $0.80 to $1.00 a pound
      exported against $0.05 to $0.10 a pound as domestic animal feed - close
      to ten times the value for the identical product.
    source: usapeec-paws-export
    placement: learning
    surprise: 5

  - slug: wing-tips-domestic-fate
    headline: At home, wing tips become stock, pet food, or fertilizer
    body: >-
      Tips that do not get exported are ground into pet food, rendered into
      chemicals and fertilizer, or simmered into commercial stock. Rendering
      the whole volume would return less than a tenth of what the export
      market pays, which is why a trade dispute over chicken feet is a real
      and expensive thing.
    source: usapeec-paws-export
    placement: learning
    surprise: 4

  - slug: avian-flu-scale
    headline: Bird flu has cost 168 million birds since 2022
    body: >-
      APHIS has confirmed highly pathogenic avian influenza in 1,689
      commercial and backyard flocks between 2022 and April 2025, affecting
      168.62 million birds. Almost all of that is layers and turkeys rather
      than broilers - a broiler reaches market in 47 days, which is a small
      window to be caught in, while a laying hen sits in one barn for well
      over a year. It is the main reason egg prices move and chicken wing
      prices mostly do not.
    source: aphis-hpai-detections
    placement: learning
    surprise: 4

  - slug: transit-loss-is-unmeasured
    headline: Nobody publishes how many wings are lost in transit
    body: >-
      Loads do get rejected at the receiving dock over temperature
      excursions, and cases do get crushed. But the peer-reviewed modelling
      of cold-chain food loss covers ten supply chain stages and declines to
      break transport out as one of them, stating outright that the
      underlying loss rates remain uncertain. So this model carries a
      deliberately low, deliberately wide estimate and labels it as such.
      Frozen wings also tolerate transit far better than the fresh product
      most of that literature studies, so borrowing a fresh-meat figure
      would overstate it.
    source: cold-chain-refrigeration-losses
    placement: learning
    surprise: 3

  - slug: kitchen-waste-corroborated
    headline: Restaurant kitchens waste 4-13% of what they buy
    body: >-
      EPA figures put food waste at 4% to 13% of food costs in commercial
      kitchens, with spoilage alone running 1-5% in prepare-ahead operations
      and 1-6% in cook-to-order. That independently brackets the ~4.2% of
      purchases the foodservice data says goes unused - two different bodies
      measuring different things and landing in the same place. It is why
      restaurant loss is one of the better-evidenced numbers in this model
      despite sounding like the softest.
    source: epa-foodservice-waste
    placement: learning
    surprise: 3

  - slug: dozen-eggs-could-be-one-hen
    headline: A dozen eggs might have come from a single chicken
    body: >-
      Wings and eggs ask the same question and get opposite answers. Twelve
      wings can never come from fewer than six chickens, because a chicken
      only has two. But a hen lays again tomorrow - so one hen, given about
      fifteen days, can fill an entire carton by herself. For eggs the honest
      answer runs from 1 chicken to 12, and which end you land on is a
      question about patience rather than biology.
    source: nass-chickens-eggs-2025
    placement: both
    surprise: 5

  - slug: same-day-dozen-is-twelve-hens
    headline: A dozen eggs gathered in one day came from twelve different hens
    body: >-
      A hen's ovulation cycle runs a little over 24 hours, so she lays at most
      about one egg a day. No hen laid two of the eggs in a same-day carton,
      which means twelve eggs means twelve hens - necessarily, with no
      estimating involved. It is the same kind of hard fact as a chicken
      having two wings, just arrived at through a clock instead of anatomy.
    source: nass-chickens-eggs-2025
    placement: both
    surprise: 5

  - slug: eggs-invert-the-wing-story
    headline: With eggs, the floor rises to meet the ceiling
    body: >-
      For wings the minimum is six and mixing through the supply chain pushes
      the real answer up toward twelve. For a same-day dozen of eggs the
      minimum is already twelve, so the floor and the ceiling meet and there
      is nothing left for the supply chain to move. Same question, opposite
      structure.
    source: nass-chickens-eggs-2025
    placement: learning
    surprise: 5

  - slug: twelve-eggs-needs-fifteen-hens
    headline: Getting a dozen eggs in one day actually takes about fifteen hens
    body: >-
      Twelve hens is the floor, but hens do not lay every single day. At the
      US average rate of 0.789 eggs per hen per day, you need roughly 15.2
      hens on hand to collect twelve eggs before sundown. The floor is what is
      physically possible; fifteen is what it actually takes.
    source: nass-chickens-eggs-2025
    placement: learning
    surprise: 4

  - slug: low-egg-states-are-broiler-states
    headline: Alabama's hens lay 100 fewer eggs a year than Montana's
    body: >-
      Alabama averaged 224 eggs per layer in 2025 and Montana 327. That is not
      worse farming - it is a different bird doing a different job. Alabama's
      layers are largely broiler-breeder hens producing hatching eggs that
      become meat chickens, and breeder hens lay far fewer eggs than table-egg
      strains. Of 377 million US layers, 60.7 million are hatching birds. A
      state's eggs-per-layer figure is mostly a readout of which mix it runs.
    source: nass-chickens-eggs-2025
    placement: learning
    surprise: 5

  - slug: egg-data-agrees-with-itself
    headline: The egg numbers check out against themselves, twice
    body: >-
      Average layers times eggs per layer reproduces reported total production
      for every one of the 31 states with 2025 figures. And 288 eggs a year
      divided by 365 days gives 0.789 eggs per hen per day, matching the
      78.7 to 79.9 eggs per 100 layers that USDA reports from an entirely
      separate monthly survey. Two unrelated tables landing on the same answer
      is the strongest validation anywhere in this project.
    source: nass-chickens-eggs-2025
    placement: learning
    surprise: 3

  - slug: cage-free-does-not-change-the-count
    headline: Cage-free changes the hen's life, not the arithmetic
    body: >-
      Cage-free, free range, and pasture-raised describe how hens are housed,
      not how many. A cage-free house still holds tens or hundreds of
      thousands of birds, so a same-day dozen is still twelve different hens.
      The only setting where the number genuinely falls is a backyard flock -
      six hens filling a carton over two weeks really is about six hens.
    source: nass-chickens-eggs-monthly-2026
    placement: both
    surprise: 4

  - slug: cracked-eggs-become-liquid-egg
    headline: A cracked egg is not thrown away, it is rerouted
    body: >-
      A cracked shell is a "check", and along with dirty eggs it counts as
      "restricted" - barred from the carton but allowed to go to a breaker
      plant to become liquid egg. So it leaves the shell-egg stream without
      leaving the food supply. USDA tolerances permit up to 7% checks in a
      Grade A pack at origin, though that is a ceiling a pack must stay under,
      not a rate anyone aims for.
    source: ams-shell-egg-grades
    placement: learning
    surprise: 4

  - slug: egg-cholesterol-is-the-outlier
    headline: An egg carries more cholesterol than anything else here
    body: >-
      372 mg per 100 g, or about 186 mg in one large egg - the highest figure
      anywhere in this dataset by a wide margin. It is also the number whose
      dietary meaning changed most in living memory: the 2015 Dietary
      Guidelines dropped the explicit 300 mg-a-day cap that had stood for
      decades. Worth knowing what an egg contains. What that means for your
      diet is a clinical question, and this project has no standing to answer
      it.
    source: usda-fdc-egg-raw
    placement: learning
    surprise: 4

  - slug: an-egg-is-leaner-than-a-wing
    headline: An egg carries wing-like protein with a third less fat
    body: >-
      Per 100 g an egg has 12.56 g of protein against a raw wing's 17.5 g, but
      only 9.51 g of fat against 12.8 g. The wing loses on that trade because
      of what it is: mostly skin, bone and small muscles, so its
      skin-to-meat ratio is high before anyone has breaded or fried it.
    source: usda-fdc-egg-raw
    placement: learning
    surprise: 3

  - slug: bird-flu-hit-the-layers-instead
    headline: Bird flu took 11 million layers out while broilers barely moved
    body: >-
      The companion to the broiler figure, and the two together are the whole
      story. US layers averaged 365 million in 2025, down 3% from 376 million,
      and eggs per layer slipped from 290 to 288 - which compounds into a 4%
      production drop, from 109 to 105 billion eggs. Broilers over the same
      period lost roughly 0.05% of throughput. Same virus, same country, same
      species of bird: one flock devastated, the other essentially untouched,
      because a broiler lives 47 days and a layer lives years.
    source: nass-chickens-eggs-2025
    placement: both
    surprise: 5

  - slug: egg-grading-is-not-separating
    headline: Grading splits a chicken's wings apart, but cannot split her eggs
    body: >-
      This is a modelling choice worth stating plainly rather than burying.
      Wings and eggs are both weighed and sorted, but the step does different
      work. A bird has exactly two wings, so weighing them routes a pair into
      different boxes whenever they straddle a grade boundary - the supply
      chain actively pulls the pair apart. An egg arrives at the grader already
      alone, because a hen laid one that day and nothing pairs it with another.
      There is no pair for grading to break.

      So we model egg grading as ordinary mixing and wing grading as active
      separation. It is a judgement about mechanism, not a figure from a
      source, and it is the kind of assumption that should be visible.
    source: ams-shell-egg-grades
    placement: learning
    surprise: 4

  # ---- Israel -------------------------------------------------------------
  # The first non-US facts in the deck. Each one is either checkable against
  # our own loaded figures or explicitly labelled as an industry claim.

  - slug: israel-wings-on-the-mangal
    headline: Israel has a national holiday whose menu includes chicken wings
    body: >-
      On Yom Ha'atzmaut, Israel's Independence Day, the mangal - the
      barbecue - is treated as about as essential to the day as the
      president's speech. And what goes on it is not large joints of meat but
      small cuts: pargiyot, deboned chicken thighs cubed and skewered, and
      chicken wings, eaten with a great many salads.

      Falafel, shawarma and schnitzel - the dishes outsiders name first when
      they think of Israeli food - barely feature. So the one product this
      whole project is built around is part of a national holiday in the
      country with the highest chicken consumption per person on earth.
    source: jc-israeli-mangal
    placement: both
    surprise: 5

  - slug: israel-pargiyot-baby-chickens
    headline: "'Pargiyot' means baby chickens, and it no longer does"
    body: >-
      Pargiyot is the Israeli grill staple, and the name is a fossil. It
      means "baby chickens" in Hebrew, after the young birds that were once
      the cut of choice. Today the same word is used for cubed and marinated
      chicken thigh or breast from an ordinary broiler.

      Worth noticing because this project counts birds, not menu items. A
      name that used to describe a whole small bird now describes a portion
      of a large one - the same drift that makes "a dozen wings" ambiguous
      between twelve whole wings and twelve fried pieces.
    source: jc-israeli-mangal
    placement: learning
    surprise: 3

  - slug: israel-2023-newcastle-dip
    headline: A disease outbreak and a war are visible in Israel's own statistics
    body: >-
      Israel's Central Bureau of Statistics reports broiler output of 553,068
      tonnes for 2023 - below its 2020 figure of 578,164 tonnes, and 8% below
      the 600,072 tonnes of 2024. Output going backwards for a year is unusual
      in a growing industry, and the reason is documented: some 16 million head
      of poultry were lost in Newcastle disease outbreaks in the fourth quarter
      of 2023, poultry houses in the north and south were shut for the war, and
      foreign workers left, leaving slaughterhouses short-staffed enough to
      move to a six-day week.

      The standing flock tells the same story: 34,121 thousand birds at the end
      of 2023 against 38,239 thousand at the end of 2020.

      This is what a corpus is for. The dip was already in the government data
      we loaded; the explanation came from a trade publication, and neither
      would have meant much alone.
    source: poultryworld-israel-war-2024
    placement: both
    surprise: 5

  - slug: israel-farmer-vs-retail-price
    headline: An Israeli chicken triples in price between the farm and the shelf
    body: >-
      A named industry figure - the secretary of Israel's Poultry Breeders
      Association - puts the price paid to the farmer at about NIS 6.5 a kilo
      against roughly NIS 20 a kilo at the retail chains, on a production cost
      of about NIS 6 over a 40-day grow-out. That is a farmer's margin of
      roughly half a shekel and a chain's margin of about eight.

      Graded 'industry', not 'measured': it is a working figure from inside the
      trade rather than something a statistical agency enumerated. It is here
      because it answers the question people actually ask after "how many
      chickens" - which is "so where does the money go".
    source: toi-poultry-imports-2025
    placement: learning
    surprise: 4

  - slug: israel-head-count-is-not-measured
    headline: Israel counts its chickens in tonnes, and the industry fills in the birds
    body: >-
      Israel's Central Bureau of Statistics publishes one of the longest
      poultry series anywhere - flock and output figures reaching back to
      1960 - with broiler output in tonnes, a standing flock at year-end, and
      a district breakdown. A heads-slaughtered count is simply not one of its
      published measures, a definitional choice many national statistical
      systems make; the US, where the Department of Agriculture enumerates
      broilers slaughtered (9,579,797,000 for 2025), is the exception rather
      than the rule.

      The bird count comes instead from Israel's industry bodies, which
      publish detailed public sector tables of their own: about 260 million
      birds a year, from a named official via the trade press. It survives two
      independent checks. Divide the 600,072 tonnes CBS did measure by that 260
      million and you get about 2.3 kg a bird, which is what a 40-day broiler
      weighs. And a second industry body - the growers' organisation, four
      years earlier - reports 244 million chicks placed in 2021, about 6%
      below, which is roughly what four years of growth looks like.

      Three sources that did not copy each other, agreeing. This corpus still
      declines to derive an official-looking count nobody published - that
      restraint is the project's own discipline, not a shortfall in the
      sources - so both readings stay available: ask for measured figures only
      and Israel answers scale in the measures CBS actually publishes; include
      industry figures and it answers the count question too.
    source: toi-poultry-imports-2025
    placement: both
    surprise: 4

  - slug: israel-kosher-inspection-no-us-analogue
    headline: Kosher slaughter adds an inspection step the US model has no room for
    body: >-
      After a bird is slaughtered under shechita, bedikah inspects the lungs,
      intestines and tendon junctions, and any bird with a blemish is pulled
      off the line for a rabbi to rule on. There is no FSIS equivalent: a US
      plant's post-mortem check is looking for different things and rejects on
      different grounds.

      That is a loss stage with no American counterpart, and it should push the
      birds-required number up in a country where essentially all commercial
      slaughter is kosher. It is not in the model, and it is not in the model
      for an honest reason: no rejection rate is published anywhere we can
      reach. Describing the step costs nothing; putting a number on it would
      mean inventing one.
    source: ou-kosher-shechita
    placement: learning
    surprise: 4

  - slug: season-states-agree-none-is-seasonal
    headline: No state's bird weight is seasonal, and the states agree on the season
    body: >-
      Broiler live weight moves 2.7% across the year nationally, from 6.55 lb
      in March to 6.73 lb in September. Judged on its own that swing is
      indistinguishable from twelve noisy numbers - and so is every single
      state's, all 22 of them.

      Then look across the states instead of at any one of them. Thirteen of
      the 22 peak in August, September or October, where about five would be
      expected if the peak month were random, and twelve trough in February to
      April. Agreement between series that were surveyed separately is a
      different kind of evidence from the size of any one series' range, and it
      is much harder to explain away. The season is real, it is small, and no
      single state is evidence for it.
    source: nass-poultry-slaughter-2025
    placement: both
    surprise: 5

  - slug: season-texas-one-bad-june
    headline: One odd month looks exactly like a season if you only measure the range
    body: >-
      Texas's monthly weights swing 7.3%, and the swing is 5.4 times the
      typical month-to-month movement - which on that test alone reads as
      seasonal. It is one June. Smooth the series across neighbouring months
      and less than half the swing survives, where a real annual cycle keeps
      about 90% of it and a single odd month keeps about a third.

      This is the shape of a whole category of wrong answer. A range is trivial
      to compute and says nothing about whether the year has a shape, so
      Kentucky's 12.3% swing - the largest of any serious broiler state - is
      one August and nothing else, while Alabama's 3.6% is spread across the
      year and means more.
    source: nass-poultry-slaughter-2025
    placement: learning
    surprise: 4

  - slug: season-february-is-not-heavier
    headline: The Super Bowl does not show up in the birds
    body: >-
      Wing demand spikes in the first week of February, so it would be
      reasonable to expect February birds to be bigger. They are not: February
      is the third-lightest month in the national series, and the peak is five
      months earlier in September.

      That is not a mystery, it is a lead time. A bird slaughtered in early
      February was placed as a chick before Christmas, and a grower cannot
      decide in January to have grown a heavier bird. Whatever absorbs the
      spike - frozen inventory, imports, or grade mix - is not bird size, and
      none of those three series is in this corpus, so this project can show
      you that the weight does not move and cannot yet tell you what does.
    source: nass-poultry-slaughter-2025
    placement: both
    surprise: 4
