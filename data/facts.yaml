# Points of fact surfaced in the learning centre and alongside results as
# the user works through a question.
#
# Every fact carries a source. Facts with placement 'result' appear next to
# the answer; 'learning' facts live in the learning centre; 'both' appear in
# either. surprise ranks how counterintuitive a fact is - the UI leads with
# high-surprise facts because those are what make people keep reading.

facts:
  - slug: two-wings-hard-floor
    headline: A chicken has exactly two wings
    body: >-
      This is the only hard constant in the whole model. Every other number
      here is an estimate layered on top of it. Twelve wings cannot come
      from fewer than six chickens - not on the best day, not at any plant,
      not anywhere. That is why the answer is "6 or more" rather than
      "about 6".
    source: wing-yield-eight-strains
    placement: both
    surprise: 2

  - slug: ohio-vs-north-carolina
    headline: An Ohio chicken weighs half what a North Carolina chicken does
    body: >-
      Ohio averaged 4.6 lb live weight in 2025; North Carolina averaged
      8.4 lb. Same country, same year, same species - but they are different
      businesses. Ohio runs small birds for fast food and tray pack; North
      Carolina runs big birds for deboning. A pound of wings from each state
      represents a very different number of chickens.
    source: nass-poultry-slaughter-2025
    placement: both
    surprise: 5

  - slug: wings-most-damaged-part
    headline: Wings are the most damaged part of the chicken, by far
    body: >-
      Median wing injuries run 5.7% per load. Legs, breast, and shoulders
      are each under 1%. Wings stick out, they get caught, and they break
      during catching, loading, and shackling. This is the single largest
      loss in the model and the main reason it takes more than six chickens.
    source: wing-injuries-loading
    placement: both
    surprise: 4

  - slug: bruising-happens-at-the-end
    headline: 90% of bruising happens in the last 12 to 24 hours
    body: >-
      Not during the seven weeks of grow-out - during catching, loading,
      transport, and shackling. By body region, bruises land on the breast
      42% of the time, wings 33%, legs 25%. Almost all the damage in a
      47-day life happens on the final day.
    source: welfare-training-carcass-quality
    placement: learning
    surprise: 5

  - slug: nineteen-billion-wings
    headline: The US produced 19.16 billion whole wings in 2025
    body: >-
      9,579,797,000 broilers were slaughtered, and each had two wings. That
      is about 56 whole wings for every person in the country, every year.
    source: nass-poultry-slaughter-2025
    placement: learning
    surprise: 3

  - slug: dressing-yield
    headline: About three quarters of a live chicken becomes sellable meat
    body: >-
      63.44 billion lb went in live; 48.01 billion lb came out ready-to-cook.
      That is a dressing yield of 75.67% - and it is not an estimate. It
      falls straight out of two totals USDA measures directly.
    source: derived-dressing-yield
    placement: learning
    surprise: 3

  - slug: menu-wing-ambiguity
    headline: A restaurant "dozen wings" usually is not twelve wings
    body: >-
      It is normally twelve PIECES - drumettes and flats. Each whole wing
      splits into a drumette, a flat, and a tip, and the tip is diverted to
      stock or rendering. So twelve pieces is six whole wings, which is
      three chickens' worth of anatomy. This single ambiguity changes the
      answer more than every processing loss combined.
    source: boneless-wing-method
    placement: both
    surprise: 5

  - slug: flat-beats-drumette
    headline: The flat has a better meat yield than the drumette
    body: >-
      The drumette is heavier - 39.9 g against 30.7 g bone-in - but the flat
      yields 80.1% boneless meat against the drumette's 74.9%. Bigger does
      not mean meatier.
    source: boneless-wing-method
    placement: learning
    surprise: 4

  - slug: mortality-rising
    headline: Broiler mortality has been getting worse since 2013
    body: >-
      It hit a historic low of 3.7% in 2013 and has climbed to 5.93% by 2024,
      even as feed conversion kept improving from 1.75 to 1.69. Birds are
      more efficient than they have ever been and also dying more often.
    source: ncc-broiler-performance
    placement: learning
    surprise: 4

  - slug: condemnation-is-tiny
    headline: FSIS condemns less than half a percent
    body: >-
      Post-mortem condemnation ran 0.45% in 2025 and 0.46% in 2024 -
      remarkably stable. People expect this to be the big loss in the
      system. It is one of the smallest.
    source: nass-poultry-slaughter-2025
    placement: learning
    surprise: 4

  - slug: top-four-concentration
    headline: Four companies produce well over half the chicken in America
    body: >-
      Tyson at 21.3%, Pilgrim's Pride at 15.8%, and Wayne-Sanderson at 14.4%
      lead a top four holding roughly 58% of national output across about
      180 plants. A wing picked at random has better than even odds of
      coming from one of four companies.
    source: wattpoultry-top-producers
    placement: learning
    surprise: 3

  - slug: grading-splits-wings
    headline: Size grading deliberately separates a bird's two wings
    body: >-
      Wings are weighed individually and sorted into jumbo, large, and
      medium. Two wings off the same bird rarely weigh exactly the same, so
      whenever they straddle a grade boundary they are routed into different
      boxes. The supply chain is not merely shuffling wings - at this step
      it is actively pulling pairs apart.
    source: project-estimate-mixing
    placement: both
    surprise: 5

  - slug: cook-loss-irrelevant
    headline: Cooking changes the weight, never the count
    body: >-
      Frying costs a wing roughly 20% of its mass, which matters a great
      deal for food cost and not at all here. Twelve wings go into the
      fryer, twelve wings come out. Cook loss has zero effect on how many
      chickens it took.
    source: project-estimate-unsourced
    placement: learning
    surprise: 3

  - slug: line-speed-and-broken-wings
    headline: Some plants run 175 birds a minute, others 140
    body: >-
      Plants under the New Poultry Inspection System may run 175 birds per
      minute; everyone else is capped at 140. That matters for wings
      specifically, because the damage that breaks them happens at
      shackling, and comment records tie faster lines to birds being hung
      improperly. Regulators counter that fast plants meet food safety
      standards - which is true, and a different question. Salmonella
      performance tells you nothing about how many wings got broken.
    source: fsis-line-speed-rule
    placement: learning
    surprise: 4

  - slug: chilling-changes-weight-not-count
    headline: How a plant chills its birds swings wing weight by 10%
    body: >-
      Air chilling makes a carcass LOSE about 2.5-2.8% of its weight.
      Immersion chilling makes it GAIN 4% and sometimes over 9%. That gap is
      larger than any loss in this entire model - and it cannot change the
      answer by a fraction, because chilling changes what a wing weighs, not
      how many wings a chicken has. Buy wings by the pound and it matters
      enormously. Order a dozen and it does not matter at all.
    source: chilling-method-yield
    placement: both
    surprise: 5

  - slug: chunks-are-breast-too
    headline: The "chunks" are not wing either
    body: >-
      Tyson files boneless wings under "boneless wings & chunks", which
      invites the question of whether chunks are a different cut. They are
      not. The ingredient statement reads "boneless, skinless chicken breast
      chunks with rib meat" - and rib meat is the portion left attached to
      the breast when it is deboned, part of the front quarter. It is not
      wing. Neither product contains any wing meat at all.
    source: tyson-foodservice-chunks
    placement: both
    surprise: 4

  - slug: wings-is-a-regulated-word
    headline: '"Wings" is a regulated word, and boneless wings comply with it'
    body: >-
      USDA standards say a product labelled wings must be the entire wing,
      all muscle and skin intact, with only the tip removable - and that
      where bone has been removed the name must say so. "Boneless wing"
      satisfies that rule by disclosing the missing bone. The label is not a
      loophole; it is doing exactly what the regulation asks, which is why
      the name survives despite containing no wing.
    source: fsis-poultry-labeling-standards
    placement: learning
    surprise: 4

  - slug: bird-flu-is-an-egg-story
    headline: Bird flu barely touches chicken wings
    body: >-
      168.62 million birds have been lost to avian influenza since 2022, and
      the headlines are relentless - but roughly 75% of those were egg-laying
      hens and 11% turkeys. Broilers were about 8%, which works out near
      0.05% of the 9.58 billion broilers slaughtered each year. Broilers live
      only 47 days, sit on smaller farms, and get restocked fast, so their
      cumulative exposure is low. Bird flu moves the price of eggs. It does
      not meaningfully move the price or supply of wings.
    source: crs-hpai-outbreak
    placement: both
    surprise: 5

  - slug: nearly-every-breast-is-striped
    headline: 96% of chicken breasts now show white striping
    body: >-
      White striping appears in essentially every commercial fillet. Severe
      woody breast runs about 12%, up from roughly 5% in 2012, and spaghetti
      meat 36%. More than 85% of fillets show more than one of these at once.
      Crucially the risk rises with live weight - so the big-bird deboning
      flocks that boneless product comes from are the worst affected. The
      real wing has no equivalent problem: wings are small working muscles
      and simply do not develop these myopathies.
    source: myopathy-prevalence-ontario
    placement: learning
    surprise: 5

  - slug: farmer-gets-twelve-cents
    headline: The farmer got about twelve cents for your dozen wings
    body: >-
      Contract growers are paid 3.8 to 4.6 cents per pound of live weight.
      Six birds at 6.62 lb is 39.7 lb, so raising them earned the grower
      roughly $1.67 - and charging only the wings' share of that bird, about
      12 cents. Growers are paid on a relative "tournament" basis against
      other farms delivering the same week, so two people doing identical
      work can be paid differently.
    source: ers-broiler-grower-fees
    placement: both
    surprise: 5

  - slug: feed-behind-a-dozen-wings
    headline: A dozen wings represents about five pounds of feed
    body: >-
      At a feed conversion of 1.69 and a 6.57 lb market weight, one broiler
      eats about 11 lb of feed. The six birds behind a dozen wings ate
      roughly 67 lb between them - but the wings are only about 7% of the
      bird, so their honest share is close to 4.9 lb of corn and soy. The
      rest of that feed became somebody else's breast fillet.
    source: ncc-broiler-performance
    placement: learning
    surprise: 4

  - slug: footprint-must-be-allocated
    headline: A dozen wings is not six chickens' worth of carbon
    body: >-
      One broiler carries about 2.90 kg of CO2 equivalent across its whole
      life. It is tempting to multiply that by six - but wings are only
      about 7% of the bird, and the breast, thighs and drums went to other
      plates. Allocated by mass, a dozen wings carries closer to 1.3 kg CO2
      equivalent. Charging the whole bird to the wings would overstate it
      roughly fourteenfold.
    source: ncc-broiler-lca-2020
    placement: learning
    surprise: 4

  - slug: chicken-footprint-falling
    headline: Chicken's footprint per bird has fallen every year
    body: >-
      Between 2010 and 2020 the industry cut greenhouse gas per kg of live
      weight by 18%, fossil resource use by 22%, and land and water use by
      13% each. Most of that came from feed efficiency: production rose 21%
      while feed consumption rose only 11%. The same efficiency drive that
      makes birds heavier and cheaper also made them lighter on the planet
      per pound.
    source: ncc-broiler-lca-2020
    placement: learning
    surprise: 4

  - slug: wings-are-mostly-fat-calories
    headline: About 60% of a wing's calories come from fat
    body: >-
      A raw whole wing with skin runs 191 kcal and 17.5 g of protein per
      100 g. Wings carry a high skin-to-meat ratio because they are mostly
      skin, bone, and small muscles - that is inherent to the cut, before
      anyone has breaded or fried it.
    source: usda-fdc-wing-raw
    placement: both
    surprise: 3

  - slug: breading-adds-carbs-not-density
    headline: Breading a wing lowers its calories per gram
    body: >-
      A breaded fried wing measures about 180 kcal per 100 g against 191 for
      raw - which reads backwards until you notice why. Breading adds
      carbohydrate and absorbed water, so the piece gets heavier faster than
      it gets more caloric. The wing on your plate has more total calories;
      it is simply less calorie-dense per gram. Chicken itself contains no
      carbohydrate at all, so every gram of carb in a fried wing is breading.
    source: usda-fdc-wing-fried
    placement: learning
    surprise: 5

  - slug: boneless-wings-contain-no-wing
    headline: A boneless wing contains no wing meat
    body: >-
      It is breast meat, cut into chunks and breaded. Tyson's own foodservice
      catalogue files the product under "boneless wings & chunks" and
      describes it as whole muscle chicken breast - the industry is not
      hiding this, the name just does not mean what it says. The honest
      count of wings in a dozen boneless wings is zero.
    source: tyson-foodservice-boneless
    placement: both
    surprise: 5

  - slug: boneless-takes-a-third-of-a-chicken
    headline: A dozen boneless wings takes about a third of a chicken
    body: >-
      A 6.62 lb broiler carries roughly 691 g of boneless breast, and a
      commercial boneless wing is about 20 g of raw breast meat - so one bird
      makes around 34 of them. Twelve pieces is therefore about 0.35 of a
      chicken. A dozen bone-in wings needs six whole chickens. Same menu
      section, same price bracket, and roughly a seventeenfold difference in
      how many birds it took.
    source: tyson-foodservice-boneless
    placement: both
    surprise: 5

  - slug: boneless-portion-is-not-anatomy
    headline: How many boneless wings a chicken makes is a business decision
    body: >-
      A chicken has exactly two wings and no processor can change that. But
      the number of boneless wings per bird depends purely on how large the
      chunks are cut - somewhere between 25 and 43 pieces per bird for
      plausible portion sizes. For bone-in wings the floor is anatomy. For
      boneless it is a portioning choice, which is why this project stores
      the two with different confidence.
    source: tyson-foodservice-boneless
    placement: learning
    surprise: 4

  - slug: wing-tips-are-a-third-segment
    headline: Every wing has a third segment you never see
    body: >-
      A whole wing is a drumette, a flat, and a tip. The tip is mostly skin,
      bone, and cartilage with almost no meat, so it is cut off and diverted
      before the wings ever reach a restaurant. When a menu says twelve
      wings, twelve tips went somewhere else.
    source: boneless-wing-method
    placement: both
    surprise: 4

  - slug: wing-tips-are-an-export-business
    headline: Wing tips and chicken paws are a $648 million export market
    body: >-
      What Americans discard, China buys. Wing tips and paws are sold there
      for soups, stews, and snacking, and together they make up roughly a
      $648 million annual US export market. Paws fetch $0.80 to $1.00 a pound
      exported against $0.05 to $0.10 a pound as domestic animal feed - close
      to ten times the value for the identical product.
    source: usapeec-paws-export
    placement: learning
    surprise: 5

  - slug: wing-tips-domestic-fate
    headline: At home, wing tips become stock, pet food, or fertilizer
    body: >-
      Tips that do not get exported are ground into pet food, rendered into
      chemicals and fertilizer, or simmered into commercial stock. Rendering
      the whole volume would return less than a tenth of what the export
      market pays, which is why a trade dispute over chicken feet is a real
      and expensive thing.
    source: usapeec-paws-export
    placement: learning
    surprise: 4

  - slug: avian-flu-scale
    headline: Bird flu has cost 168 million birds since 2022
    body: >-
      APHIS has confirmed highly pathogenic avian influenza in 1,689
      commercial and backyard flocks between 2022 and April 2025, affecting
      168.62 million birds. Almost all of that is layers and turkeys rather
      than broilers - a broiler reaches market in 47 days, which is a small
      window to be caught in, while a laying hen sits in one barn for well
      over a year. It is the main reason egg prices move and chicken wing
      prices mostly do not.
    source: aphis-hpai-detections
    placement: learning
    surprise: 4

  - slug: transit-loss-is-unmeasured
    headline: Nobody publishes how many wings are lost in transit
    body: >-
      Loads do get rejected at the receiving dock over temperature
      excursions, and cases do get crushed. But the peer-reviewed modelling
      of cold-chain food loss covers ten supply chain stages and declines to
      break transport out as one of them, stating outright that the
      underlying loss rates remain uncertain. So this model carries a
      deliberately low, deliberately wide estimate and labels it as such.
      Frozen wings also tolerate transit far better than the fresh product
      most of that literature studies, so borrowing a fresh-meat figure
      would overstate it.
    source: cold-chain-refrigeration-losses
    placement: learning
    surprise: 3

  - slug: kitchen-waste-corroborated
    headline: Restaurant kitchens waste 4-13% of what they buy
    body: >-
      EPA figures put food waste at 4% to 13% of food costs in commercial
      kitchens, with spoilage alone running 1-5% in prepare-ahead operations
      and 1-6% in cook-to-order. That independently brackets the ~4.2% of
      purchases the foodservice data says goes unused - two different bodies
      measuring different things and landing in the same place. It is why
      restaurant loss is one of the better-evidenced numbers in this model
      despite sounding like the softest.
    source: epa-foodservice-waste
    placement: learning
    surprise: 3

  - slug: dozen-eggs-could-be-one-hen
    headline: A dozen eggs might have come from a single chicken
    body: >-
      Wings and eggs ask the same question and get opposite answers. Twelve
      wings can never come from fewer than six chickens, because a chicken
      only has two. But a hen lays again tomorrow - so one hen, given about
      fifteen days, can fill an entire carton by herself. For eggs the honest
      answer runs from 1 chicken to 12, and which end you land on is a
      question about patience rather than biology.
    source: nass-chickens-eggs-2025
    placement: both
    surprise: 5

  - slug: same-day-dozen-is-twelve-hens
    headline: A dozen eggs gathered in one day came from twelve different hens
    body: >-
      A hen's ovulation cycle runs a little over 24 hours, so she lays at most
      about one egg a day. No hen laid two of the eggs in a same-day carton,
      which means twelve eggs means twelve hens - necessarily, with no
      estimating involved. It is the same kind of hard fact as a chicken
      having two wings, just arrived at through a clock instead of anatomy.
    source: nass-chickens-eggs-2025
    placement: both
    surprise: 5

  - slug: eggs-invert-the-wing-story
    headline: With eggs, the floor rises to meet the ceiling
    body: >-
      For wings the minimum is six and mixing through the supply chain pushes
      the real answer up toward twelve. For a same-day dozen of eggs the
      minimum is already twelve, so the floor and the ceiling meet and there
      is nothing left for the supply chain to move. Same question, opposite
      structure.
    source: nass-chickens-eggs-2025
    placement: learning
    surprise: 5

  - slug: twelve-eggs-needs-fifteen-hens
    headline: Getting a dozen eggs in one day actually takes about fifteen hens
    body: >-
      Twelve hens is the floor, but hens do not lay every single day. At the
      US average rate of 0.789 eggs per hen per day, you need roughly 15.2
      hens on hand to collect twelve eggs before sundown. The floor is what is
      physically possible; fifteen is what it actually takes.
    source: nass-chickens-eggs-2025
    placement: learning
    surprise: 4

  - slug: low-egg-states-are-broiler-states
    headline: Alabama's hens lay 100 fewer eggs a year than Montana's
    body: >-
      Alabama averaged 224 eggs per layer in 2025 and Montana 327. That is not
      worse farming - it is a different bird doing a different job. Alabama's
      layers are largely broiler-breeder hens producing hatching eggs that
      become meat chickens, and breeder hens lay far fewer eggs than table-egg
      strains. Of 377 million US layers, 60.7 million are hatching birds. A
      state's eggs-per-layer figure is mostly a readout of which mix it runs.
    source: nass-chickens-eggs-2025
    placement: learning
    surprise: 5

  - slug: egg-data-agrees-with-itself
    headline: The egg numbers check out against themselves, twice
    body: >-
      Average layers times eggs per layer reproduces reported total production
      for every one of the 31 states with 2025 figures. And 288 eggs a year
      divided by 365 days gives 0.789 eggs per hen per day, matching the
      78.7 to 79.9 eggs per 100 layers that USDA reports from an entirely
      separate monthly survey. Two unrelated tables landing on the same answer
      is the strongest validation anywhere in this project.
    source: nass-chickens-eggs-2025
    placement: learning
    surprise: 3

  - slug: cage-free-does-not-change-the-count
    headline: Cage-free changes the hen's life, not the arithmetic
    body: >-
      Cage-free, free range, and pasture-raised describe how hens are housed,
      not how many. A cage-free house still holds tens or hundreds of
      thousands of birds, so a same-day dozen is still twelve different hens.
      The only setting where the number genuinely falls is a backyard flock -
      six hens filling a carton over two weeks really is about six hens.
    source: nass-chickens-eggs-monthly-2026
    placement: both
    surprise: 4

  - slug: cracked-eggs-become-liquid-egg
    headline: A cracked egg is not thrown away, it is rerouted
    body: >-
      A cracked shell is a "check", and along with dirty eggs it counts as
      "restricted" - barred from the carton but allowed to go to a breaker
      plant to become liquid egg. So it leaves the shell-egg stream without
      leaving the food supply. USDA tolerances permit up to 7% checks in a
      Grade A pack at origin, though that is a ceiling a pack must stay under,
      not a rate anyone aims for.
    source: ams-shell-egg-grades
    placement: learning
    surprise: 4

  - slug: egg-cholesterol-is-the-outlier
    headline: An egg carries more cholesterol than anything else here
    body: >-
      372 mg per 100 g, or about 186 mg in one large egg - the highest figure
      anywhere in this dataset by a wide margin. It is also the number whose
      dietary meaning changed most in living memory: the 2015 Dietary
      Guidelines dropped the explicit 300 mg-a-day cap that had stood for
      decades. Worth knowing what an egg contains. What that means for your
      diet is a clinical question, and this project has no standing to answer
      it.
    source: usda-fdc-egg-raw
    placement: learning
    surprise: 4

  - slug: an-egg-is-leaner-than-a-wing
    headline: An egg carries wing-like protein with a third less fat
    body: >-
      Per 100 g an egg has 12.56 g of protein against a raw wing's 17.5 g, but
      only 9.51 g of fat against 12.8 g. The wing loses on that trade because
      of what it is: mostly skin, bone and small muscles, so its
      skin-to-meat ratio is high before anyone has breaded or fried it.
    source: usda-fdc-egg-raw
    placement: learning
    surprise: 3

  - slug: bird-flu-hit-the-layers-instead
    headline: Bird flu took 11 million layers out while broilers barely moved
    body: >-
      The companion to the broiler figure, and the two together are the whole
      story. US layers averaged 365 million in 2025, down 3% from 376 million,
      and eggs per layer slipped from 290 to 288 - which compounds into a 4%
      production drop, from 109 to 105 billion eggs. Broilers over the same
      period lost roughly 0.05% of throughput. Same virus, same country, same
      species of bird: one flock devastated, the other essentially untouched,
      because a broiler lives 47 days and a layer lives years.
    source: nass-chickens-eggs-2025
    placement: both
    surprise: 5

  - slug: egg-grading-is-not-separating
    headline: Grading splits a chicken's wings apart, but cannot split her eggs
    body: >-
      This is a modelling choice worth stating plainly rather than burying.
      Wings and eggs are both weighed and sorted, but the step does different
      work. A bird has exactly two wings, so weighing them routes a pair into
      different boxes whenever they straddle a grade boundary - the supply
      chain actively pulls the pair apart. An egg arrives at the grader already
      alone, because a hen laid one that day and nothing pairs it with another.
      There is no pair for grading to break.

      So we model egg grading as ordinary mixing and wing grading as active
      separation. It is a judgement about mechanism, not a figure from a
      source, and it is the kind of assumption that should be visible.
    source: ams-shell-egg-grades
    placement: learning
    surprise: 4

  # ---- Israel -------------------------------------------------------------
  # The first non-US facts in the deck. Each one is either checkable against
  # our own loaded figures or explicitly labelled as an industry claim.

  - slug: israel-wings-on-the-mangal
    headline: Israel has a national holiday whose menu includes chicken wings
    body: >-
      On Yom Ha'atzmaut, Israel's Independence Day, the mangal - the
      barbecue - is treated as about as essential to the day as the
      president's speech. And what goes on it is not large joints of meat but
      small cuts: pargiyot, deboned chicken thighs cubed and skewered, and
      chicken wings, eaten with a great many salads.

      Falafel, shawarma and schnitzel - the dishes outsiders name first when
      they think of Israeli food - barely feature. So the one product this
      whole project is built around is part of a national holiday in the
      country with the highest chicken consumption per person on earth.
    source: jc-israeli-mangal
    placement: both
    surprise: 5

  - slug: israel-pargiyot-baby-chickens
    headline: "'Pargiyot' means baby chickens, and it no longer does"
    body: >-
      Pargiyot is the Israeli grill staple, and the name is a fossil. It
      means "baby chickens" in Hebrew, after the young birds that were once
      the cut of choice. Today the same word is used for cubed and marinated
      chicken thigh or breast from an ordinary broiler.

      Worth noticing because this project counts birds, not menu items. A
      name that used to describe a whole small bird now describes a portion
      of a large one - the same drift that makes "a dozen wings" ambiguous
      between twelve whole wings and twelve fried pieces.
    source: jc-israeli-mangal
    placement: learning
    surprise: 3

  - slug: israel-2023-newcastle-dip
    headline: A disease outbreak and a war are visible in Israel's own statistics
    body: >-
      Israel's Central Bureau of Statistics reports broiler output of 553,068
      tonnes for 2023 - below its 2020 figure of 578,164 tonnes, and 8% below
      the 600,072 tonnes of 2024. Output going backwards for a year is unusual
      in a growing industry, and the reason is documented: some 16 million head
      of poultry were lost in Newcastle disease outbreaks in the fourth quarter
      of 2023, poultry houses in the north and south were shut for the war, and
      foreign workers left, leaving slaughterhouses short-staffed enough to
      move to a six-day week.

      The standing flock tells the same story: 34,121 thousand birds at the end
      of 2023 against 38,239 thousand at the end of 2020.

      This is what a corpus is for. The dip was already in the government data
      we loaded; the explanation came from a trade publication, and neither
      would have meant much alone.
    source: poultryworld-israel-war-2024
    placement: both
    surprise: 5

  - slug: israel-farmer-vs-retail-price
    headline: An Israeli chicken triples in price between the farm and the shelf
    body: >-
      A named industry figure - the secretary of Israel's Poultry Breeders
      Association - puts the price paid to the farmer at about NIS 6.5 a kilo
      against roughly NIS 20 a kilo at the retail chains, on a production cost
      of about NIS 6 over a 40-day grow-out. That is a farmer's margin of
      roughly half a shekel and a chain's margin of about eight.

      Graded 'industry', not 'measured': it is a working figure from inside the
      trade rather than something a statistical agency enumerated. It is here
      because it answers the question people actually ask after "how many
      chickens" - which is "so where does the money go".
    source: toi-poultry-imports-2025
    placement: learning
    surprise: 4

  - slug: israel-head-count-is-not-measured
    headline: Israel counts its chickens in tonnes, and the industry fills in the birds
    body: >-
      Israel's Central Bureau of Statistics publishes one of the longest
      poultry series anywhere - flock and output figures reaching back to
      1960 - with broiler output in tonnes, a standing flock at year-end, and
      a district breakdown. A heads-slaughtered count is simply not one of its
      published measures, a definitional choice many national statistical
      systems make; the US, where the Department of Agriculture enumerates
      broilers slaughtered (9,579,797,000 for 2025), is the exception rather
      than the rule.

      The bird count comes instead from Israel's industry bodies, which
      publish detailed public sector tables of their own: about 260 million
      birds a year, from a named official via the trade press. It survives two
      independent checks. Divide the 600,072 tonnes CBS did measure by that 260
      million and you get about 2.3 kg a bird, which is what a 40-day broiler
      weighs. And a second industry body - the growers' organisation, four
      years earlier - reports 244 million chicks placed in 2021, about 6%
      below, which is roughly what four years of growth looks like.

      Three sources that did not copy each other, agreeing. This corpus still
      declines to derive an official-looking count nobody published - that
      restraint is the project's own discipline, not a shortfall in the
      sources - so both readings stay available: ask for measured figures only
      and Israel answers scale in the measures CBS actually publishes; include
      industry figures and it answers the count question too.
    source: toi-poultry-imports-2025
    placement: both
    surprise: 4

  - slug: israel-kosher-inspection-no-us-analogue
    headline: Kosher slaughter adds an inspection step the US model has no room for
    body: >-
      After a bird is slaughtered under shechita, bedikah inspects the lungs,
      intestines and tendon junctions, and any bird with a blemish is pulled
      off the line for a rabbi to rule on. There is no FSIS equivalent: a US
      plant's post-mortem check is looking for different things and rejects on
      different grounds.

      That is a loss stage with no American counterpart, and it should push the
      birds-required number up in a country where essentially all commercial
      slaughter is kosher. It is not in the model, and it is not in the model
      for an honest reason: no rejection rate is published anywhere we can
      reach. Describing the step costs nothing; putting a number on it would
      mean inventing one.
    source: ou-kosher-shechita
    placement: learning
    surprise: 4

  - slug: season-states-agree-none-is-seasonal
    headline: No state's bird weight is seasonal, and the states agree on the season
    body: >-
      Broiler live weight moves 2.7% across the year nationally, from 6.55 lb
      in March to 6.73 lb in September. Judged on its own that swing is
      indistinguishable from twelve noisy numbers - and so is every single
      state's, all 22 of them.

      Then look across the states instead of at any one of them. Thirteen of
      the 22 peak in August, September or October, where about five would be
      expected if the peak month were random, and twelve trough in February to
      April. Agreement between series that were surveyed separately is a
      different kind of evidence from the size of any one series' range, and it
      is much harder to explain away. The season is real, it is small, and no
      single state is evidence for it.
    source: nass-poultry-slaughter-2025
    placement: both
    surprise: 5

  - slug: season-texas-one-bad-june
    headline: One odd month looks exactly like a season if you only measure the range
    body: >-
      Texas's monthly weights swing 7.3%, and the swing is 5.4 times the
      typical month-to-month movement - which on that test alone reads as
      seasonal. It is one June. Smooth the series across neighbouring months
      and less than half the swing survives, where a real annual cycle keeps
      about 90% of it and a single odd month keeps about a third.

      This is the shape of a whole category of wrong answer. A range is trivial
      to compute and says nothing about whether the year has a shape, so
      Kentucky's 12.3% swing - the largest of any serious broiler state - is
      one August and nothing else, while Alabama's 3.6% is spread across the
      year and means more.
    source: nass-poultry-slaughter-2025
    placement: learning
    surprise: 4

  - slug: season-february-is-not-heavier
    headline: The Super Bowl does not show up in the birds
    body: >-
      Wing demand spikes in the first week of February, so it would be
      reasonable to expect February birds to be bigger. They are not: February
      is the third-lightest month in the national series, and the peak is five
      months earlier in September.

      That is not a mystery, it is a lead time. A bird slaughtered in early
      February was placed as a chick before Christmas, and a grower cannot
      decide in January to have grown a heavier bird. Whatever absorbs the
      spike - frozen inventory, imports, or grade mix - is not bird size, and
      none of those three series is in this corpus, so this project can show
      you that the weight does not move and cannot yet tell you what does.
    source: nass-poultry-slaughter-2025
    placement: both
    surprise: 4

  - slug: silk-pupa-killed-for-an-unbroken-thread
    headline: The count is exact because the animal's whole life's work is taken at once
    body: >-
      A silkworm spins one cocoon, from one continuous filament three hundred
      to nine hundred metres long, and then it is killed inside it - baked,
      steamed or boiled before the moth can emerge.

      That is not cruelty for its own sake and it is not a detail. A moth that
      emerges dissolves a hole through the wall and cuts the single thread into
      short useless lengths, so the cocoon has to be taken whole or not at all.
      The economics and the arithmetic point the same way: one animal, one
      cocoon, one unbroken thread, all of it or none.

      It is why "about 150 silkworms per necktie" is a headcount rather than an
      average. Everywhere else in this project a number of animals is inferred
      from a mass or a yield that varies. Here each worm contributes its entire
      lifetime output exactly once, and the reason the figure is exact is the
      same reason the pupa does not survive.
    source: nwe-silkworm
    placement: both
    surprise: 5

  - slug: silk-nobody-writes-down-one-cocoon-per-worm
    headline: The hardest silk figure to source is the most obvious one
    body: >-
      One silkworm spins one cocoon. Every per-garment figure in this corpus is
      a cocoon count, and a cocoon count only becomes an animal count because
      that holds - so it is the load-bearing number of the whole subject.

      It is also the one number that could not be extracted automatically. Two
      runs of two different models declined to answer it, and they were right
      to: sericulture writers never state it numerically. They write "the
      larvae enclose themselves in a cocoon", which contains no number at all,
      so an honest answer of 1 has nothing to verify against. A sweep of
      thirty-five sources - the FAO, Britannica, Wikipedia, zoos, university
      extension PDFs - turned up exactly one fetchable sentence stating the
      relation, and it states it sideways.

      Things everybody knows are not written down. That is a general hazard for
      any project that builds a corpus by reading documents, and it is worth
      knowing that the gap tends to sit under the foundations rather than out
      at the edges.
    source: pubmed-multi-silkworm-cocoon
    placement: learning
    surprise: 4

  - slug: beef-the-only-pool-anyone-has-ever-counted
    headline: One mixing pool in this corpus was measured, and it took DNA to do it
    body: >-
      Every cascade here rests on an estimate of how many animals are in the
      pool. Nobody in poultry, eggs, saffron or maple measures that, because
      nobody has a reason to, so the audit prints `project-estimate-mixing`
      against pool after pool and it has always been the softest joint in the
      model.

      Ground beef is the one exception. Hu et al. profiled DNA markers in six
      commercial grind batches and estimated animal abundance by mark-recapture
      - the same technique used to count fish in a lake, pointed at a hamburger.
      They found an average of 411 to 1,367 animals present per batch. That is a
      pool size counted rather than asserted, measured in the product itself, by
      the only method that can see through a grinder.

      It matters well beyond beef. The commingling model claims that ordinary
      food is a blend of a great many animals, and for five of six subjects that
      claim rests on reasoning about how the trade works. Here it rests on
      somebody reading the DNA and finding the animals were there.
    source: plos-hu-2012-grind-batch
    placement: both
    surprise: 5

  - slug: beef-the-answer-is-one-and-that-is-the-honest-answer
    headline: The batch held a thousand cattle; the model still says your patty holds one
    body: >-
      Ask this project how many cattle are in a hamburger and it says about one,
      which reads like the model failing at the exact moment it should be most
      impressive. It is not. It is the model refusing to make something up.

      The two numbers answer different questions. The batch your patty came out
      of held somewhere between 411 and 1,367 animals - that is the pool, and it
      is counted. Your patty is one share of a homogenate drawn from that pool,
      so the draw model has exactly one draw to work with, and one draw can be
      accounted for by one animal. To get a bigger number the model would need a
      figure for how many distinct parcels of trim survive into a single quarter
      pound. Nobody has measured that. Grinding is the most total mixer in the
      corpus precisely because it destroys the individual, which is the same
      reason the question is so hard to answer from the other end.

      Wings work differently: six chickens is anatomy, and no supply chain can
      argue with it. A patty has no anatomical floor at all - its floor of one is
      only the observation that one animal is physically sufficient, reachable
      only on the home-ground route where nothing commingles. Inventing a
      parcels-per-patty figure would produce a far better headline and would be
      the single most dishonest number in the corpus.
    source: nrc-2002-ground-beef-risk
    placement: learning
    surprise: 4

  - slug: canada-per-capita-disappearance
    headline: Chicken is Canada's most-eaten meat, and the number is government-dated
    body: >-
      Agriculture and Agri-Food Canada puts chicken's "per capita
      disappearance" - the standard supply-side proxy for how much of a food
      actually gets eaten - at 35.64 kilograms per person in 2025, ahead of
      every other animal protein in the country.

      "Disappearance" is kept rather than translated to "consumption"
      because it means something narrower: total supply minus exports minus
      the change in frozen stocks, not a measured intake figure. It is the
      standard the industry itself uses, and it is the reason this figure
      can ship as a dated fact where Israel's much-repeated "highest
      per-capita consumer" claim could not - Israel's version traced to a
      dead link, and every replacement disagreed with the others by up to
      20%. Canada's traces to one government page, for one named year.
    source: aafc-chicken-industry-2026
    placement: both
    surprise: 3

  - slug: canada-quota-not-demand
    headline: Canadian chicken farmers do not decide how many birds to raise
    body: >-
      Chicken Farmers of Canada sets a national base allocation every few
      weeks, and provincial boards divide it into farm-level quota. A farmer
      cannot simply raise more chickens because a market signal says to -
      production is set in advance by a marketing board response to
      projected demand, import levels, and (as 2025 showed) disease and
      hatching-egg supply constraints, not the other way around.

      This is the same kind of structural fact Israel's kosher slaughter
      stage was for that country's plan: it changes what "how many chickens
      does Canada raise" even means, rather than just changing an answer.
      It is also why Canada has no published "standing flock" figure the
      way Israel's or the US's inventories do - a quota-set system has no
      equivalent census to publish, because the quota itself already states
      the intended throughput.
    source: cfc-annual-report-2025
    placement: learning
    surprise: 4

  - slug: canada-two-weight-bases-one-report
    headline: Canada's own chicken statistics do not agree on how to weigh a chicken
    body: >-
      Statistics Canada reports 2025 chicken production in what a separate
      government page confirms is eviscerated weight - the dressed carcass,
      after processing. Chicken Farmers of Canada's own annual report, in
      the very same year, reports "average farm size" and producer price
      per kilogram of LIVE weight - the bird before slaughter, which for a
      broiler runs roughly 30% heavier than its eviscerated weight.

      Two publishers, one country, one year, two different birds by weight -
      and neither publication says so next to the number. This project
      never combines the two: an average bird weight for Canada is derived
      only from StatCan's own head count and StatCan's own tonnage, both
      on the same (eviscerated) basis, precisely so this trap cannot enter
      through the back door.
    source: cfc-annual-report-2025
    placement: learning
    surprise: 4

  # Wagyu grading facts, batch-03-wagyu round 2 (accepted 2026-08-16).
  # First facts outside the poultry domain -- `domain:` is new and optional,
  # defaulting to poultry, so every existing fact above is untouched.
  - slug: a5-two-grades-not-one
    domain: livestock
    headline: The A and the 5 in "A5 wagyu" grade two different things
    body: >-
      Japan's Meat Grading Association assigns every carcass a yield grade -
      a letter, A to C, for how much meat the carcass gives up - and a
      separate meat quality grade, a number from 1 to 5. "A5" is the pairing
      of the best of each, not a single scale. The famous marbling score
      (BMS, 1 to 12) sits inside the quality number as one of four inputs
      alongside meat color, firmness and texture, and fat quality - and the
      quality grade takes the lowest of the four. A carcass with perfect
      marbling and slightly dull fat is not a 5.
    source: gotoh-2018-wagyu-review
    placement: both
    surprise: 4

  - slug: bms-eight-earns-the-five
    domain: livestock
    headline: It takes a marbling score of 8 out of 12 to earn the 5 in A5
    body: >-
      The 12-point Beef Marbling Standard is bucketed into the 5-point
      quality grade: BMS 8 through 12 all earn a quality score of 5, and BMS
      5 through 7 earn a 4. So "A5" spans a wide range of actual marbling -
      the floor of the top grade sits at 8, and everything above it collapses
      into the same letter-number pair. An American wagyu breeder's guide
      also puts the entry point for BMS 3 at a minimum of 21% intramuscular
      fat - and notes Japan measures at a different rib site (6th/7th) than
      the US (12th/13th), so the two systems' numbers are not directly
      comparable.
    source: lone-mountain-carcass-grading
    placement: learning
    surprise: 3
  # ---- Mexico ---------------------------------------------------------------
  # Second country after Israel. See docs/MEXICO-PLAN.md. Each fact is either
  # checkable against a loaded figure or explicitly graded industry/trade
  # press - the same discipline the Israel facts follow.

  - slug: mexico-ave-vs-pollo-taxonomy
    headline: "Mexico's own statistics split poultry meat two ways"
    body: >-
      Mexican agricultural statistics report "carne de ave" (poultry meat)
      as a category that includes both chicken and turkey, and "carne de
      pollo" (chicken meat) as chicken alone. A national poultry-meat total
      would overstate this project's broiler figure by whatever share
      turkey contributes - so every Mexican number this project publishes
      is checked against a source's own wording and is specifically the
      "pollo" reading, never the broader "ave" aggregate.
    source: bmeditores-panorama-carne-ave
    placement: learning
    surprise: 3

  - slug: mexico-self-sufficiency-eighty-percent
    headline: Mexico makes about four in five of its own chickens
    body: >-
      In 2023, Mexico produced 3,888,000 tonnes of chicken meat against a
      total domestic supply (production plus imports) of 4,894,000 tonnes -
      about 79.4% self-sufficiency, with the remaining fifth arriving
      mostly from the United States (about 86% of 2023 imports) and Brazil
      (about 14%). Two independently reported trade-press figures land
      within a point of the same number (79.6% and "almost 80%"), which is
      why this is one of the few Mexican figures in this project confident
      enough to publish as a headline.

      This is the opposite shape from Israel, which the corpus already
      describes as a net surplus producer - Mexico runs the more ordinary
      pattern of a large producer that still imports a meaningful share of
      what it eats.
    source: usda-fas-gain-mx2024-0040
    placement: both
    surprise: 3

  - slug: mexico-veracruz-consistent-state-leader
    headline: The same state has led Mexican chicken production in every recent ranking
    body: >-
      Veracruz was Mexico's top chicken-meat-producing state in 2019
      (11.7% of national output, per a peer-reviewed citation of SIAP), in
      2021 (per the national agricultural council), and again in 2023-24
      (per the USDA's own attaché report), with Aguascalientes, Jalisco,
      Querétaro and Durango rotating through the next few places across
      every year checked in this research pass. The one earlier year
      checked, 2014, named a different leader - Aguascalientes, per a
      SADER article - so the streak is "every ranking since 2019", not
      forever.

      The exact order of that second tier is NOT settled: sources
      describing the same 2023-24 period disagree on whether Aguascalientes
      or Jalisco ranks second, and this project deliberately does not pick
      a side - see docs/MEXICO-PLAN.md. What is consistent across every
      source from 2019 onward is Veracruz in first place and the same five
      or six states making up roughly half to two-thirds of national output.
    source: usda-fas-gain-mx2024-0040
    placement: learning
    surprise: 2

  - slug: mexico-weekly-throughput-not-annualized
    headline: Mexico's own poultry trade body counts birds by the week, not the year
    body: >-
      The Unión Nacional de Avicultores (UNA) - Mexico's national poultry
      producers' association - reports approximately 39.3 million chickens
      processed per week as of 2025. This project deliberately does not
      multiply that by 52 to produce an annual head count: doing so would
      assert a constant weekly rate that nobody has published, on top of a
      figure that is already an industry estimate rather than a government
      enumeration. So Mexico, like Israel, currently has no bird count in
      this corpus - the reason is different (a rate that resists honest
      annualization, rather than a measurement nobody took at all), but the
      caution is the same.
    source: una-industria-2025
    placement: learning
    surprise: 3

  - slug: mexico-tif-inspection-not-fsis-equivalent
    headline: Only some Mexican poultry plants answer to a federal inspector
    body: >-
      Mexico's Tipo Inspección Federal (TIF) system federally certifies
      slaughter and processing plants; industry estimated that about 85% of
      2024 poultry slaughter ran through TIF-certified plants (121 of them
      nationally), up from about 83% in 2023. The remaining slaughter runs
      through state or municipal inspection, or none at all.

      Unlike Israel's kosher bedikah inspection, which the corpus already
      describes as a loss stage with no US analogue, TIF coverage is a
      question of which SHARE of the national supply is inspected at all,
      not what an inspector rejects - and no rejection or condemnation rate
      for either TIF or non-TIF slaughter was found in this research pass.
      Described here rather than modelled as a loss stage, for the same
      reason Israel's bedikah is described and not quantified: a number
      here would be invented, not sourced.
    source: usda-fas-gain-mx2024-0040
    placement: learning
    surprise: 3

  # ---- Brazil ------------------------------------------------------------
  # Fifth country. See docs/BRAZIL-PLAN.md. Unlike Mexico, Brazil's own
  # statistical agency (IBGE) answers directly - the interesting finding
  # here is not "can we reach the data" but "two real sources disagree,
  # and only one fits in the schema".

  - slug: brazil-two-national-headcounts-disagree
    headline: Brazil has two real chicken headcounts for 2025, and they disagree by 17%
    body: >-
      IBGE, Brazil's statistics agency, counted 6.695 billion chickens
      slaughtered in 2025 across federally-, state-, and municipally-
      inspected plants combined. ABPA, the national poultry trade body,
      reports 5.706 billion for the same year - but its own chart says
      that figure is sourced to the Ministry of Agriculture and citing
      FEDERAL inspection only, a narrower population than IBGE's.

      This project loads IBGE's number: a direct government census-type
      survey outranks a trade body's citation of a government figure one
      step removed, the same rule that graded Mexico's USDA-sourced
      figures below its peer-reviewed one. ABPA's figure is not discarded
      - it is recorded in the source library and in docs/BRAZIL-PLAN.md,
      because a number this project chooses not to load is still a number
      worth explaining why.
    source: ibge-sidra-1094-abate-frangos
    placement: both
    surprise: 4

  - slug: brazil-south-exports-more-than-it-produces-share-of
    headline: Southern Brazil ships a bigger share of exports than it does of production
    body: >-
      Paraná, Santa Catarina and Rio Grande do Sul together produce 57.9%
      of Brazil's chicken meat but ship 77.3% of its chicken meat exports
      - a gap ABPA states in its own words. Paraná alone accounts for
      34.8% of national production and 40.76% of national exports.

      The three southern states are not just where Brazil raises the most
      chickens; they are disproportionately where Brazil's export-grade
      plants sit, closer to the ports (Paranaguá, São Francisco do Sul,
      Itajaí, Rio Grande) that ship 153 countries' worth of chicken meat
      out of the country.
    source: abpa-annual-report-2026
    placement: both
    surprise: 3

  - slug: brazil-largest-exporter-not-largest-producer
    headline: Brazil ships more chicken abroad than any country, without raising the most
    body: >-
      The United States and China both raise more chickens than Brazil
      does (21.8 and 16.2 million tonnes of production in 2025, against
      Brazil's 15.3 million, per ABPA's own World Chicken Meat Market
      table) - but Brazil exports more chicken meat than any country on
      Earth: 5.324 million tonnes to 153 countries in 2025, worth US$9.8
      billion, a bit over a third of everything Brazil produces.

      Being the biggest exporter and being the biggest producer are two
      different superlatives, and Brazil holds only the second-place one
      on production while leading the world on the other.
    source: abpa-annual-report-2026
    placement: both
    surprise: 3

  - slug: brazil-breeder-stock-not-broiler-flock
    headline: "63 million housed hens in Brazil are not broilers at all"
    body: >-
      ABPA reports 63.0 million breeding hens ("matrizes de corte")
      housed in 2025 - but these are parent stock, the hens that lay the
      fertile eggs broiler chicks hatch from, not meat birds themselves.
      Brazil has no published national standing-flock count for the
      broiler population that IBGE and ABPA both count at slaughter -
      the same absence Canada's supply-managed system produces for a
      different structural reason, and the same absence this project
      declines to paper over with an estimate for either country.
    source: abpa-annual-report-2026
  # ---- China ------------------------------------------------------------
  # Fifth country. See docs/CHINA-PLAN.md. Every fact here is checked
  # against a source's own wording for the 禽肉 (all-poultry) vs. 鸡肉/肉鸡
  # (chicken-specific) distinction before being written, the same
  # discipline Mexico's ave/pollo split established.

  - slug: china-ave-vs-pollo-taxonomy
    headline: China's own statistics agency does not publish a chicken-only figure
    body: >-
      The National Bureau of Statistics' national communique reports
      poultry meat production (禽肉) as one number - 26.6 million tonnes for
      2024, up 3.8% - covering chicken, duck, goose and other fowl
      together, with no chicken-specific breakout anywhere in the
      document. Every chicken-SPECIFIC figure in this corpus therefore
      comes from a source one step removed from China's own statistical
      agency: USDA's FAS attaché reports, which quote a "Meat, Chicken"
      PSD table their own cover page annotates "Not official USDA data".
      This is the same shape of gap Mexico's SIAP left, for a different
      reason - not unreachable, but aggregated across species in the one
      place this project could reach it directly.
    source: nbs-china-2024-communique
    placement: learning
    surprise: 3

  - slug: china-second-largest-producer
    headline: China makes the world's second-most chicken meat, and eats relatively little of it
    body: >-
      USDA's own global circular states plainly that "China is the world's
      second largest producer of chicken meat, significantly behind the
      United States and often on par with Brazil" - a rare case in this
      project of a world-rank claim with no competing figure found (unlike
      Mexico, where three sources gave three different ranks for the same
      years). Yet China's per-capita chicken consumption is low for a top
      producer: about 11 kg per person in 2025, against 43 kg of pork
      within China itself, and far below the United States (55 kg), Japan
      (24 kg) and Taiwan (42 kg). A country can lead world production and
      still not be where the chicken is eaten - production scales with
      population and export capacity, consumption per head does not follow
      automatically.

      This per-capita figure is carried at industry grade and is
      single-source: no independent Chinese domestic figure was found in
      this pass to corroborate or conflict with it, unlike Mexico's
      five-way per-capita spread. That is a gap flagged for a future pass,
      not a claim this project treats as settled the way Canada's
      AAFC-sourced per-capita figure is.
    source: usda-fas-livestock-poultry-wmt-2026-04
    placement: both
    surprise: 4

  - slug: china-production-estimate-conflict
    headline: Two credible counts of China's 2024 chicken meat disagree by nearly half
    body: >-
      USDA's FAS attaché report puts China's 2024 chicken meat production
      at 15.35 million tonnes. China's own National Broiler Industry
      Technology System, reported via trade press, puts white-feather and
      yellow-feather broiler meat ALONE (excluding a third category, small
      white-feather broilers, entirely) at 22.11 million tonnes for the
      same year - 44% higher, before that third category is even added
      in. Both describe chicken specifically, not the broader
      all-poultry aggregate, so the taxonomy trap that explains many of
      this project's other cross-source gaps does not explain this one.

      Neither source states whether it is reporting live weight or
      processed/carcass-equivalent weight - the same basis ambiguity this
      project already tracks for Canada (StatCan vs. Chicken Farmers of
      Canada) and the US (live vs. ready-to-cook) - and that is the most
      likely explanation, but it was NOT confirmed in this research pass.
      Recorded as an open, unresolved conflict rather than resolved by
      picking a source: this project loads the USDA figure into its
      output table (the more conservative, more precisely sourced of the
      two), and states the larger industry estimate here rather than
      silently dropping it.
    source: agripost-cn-broiler-industry-2024
    placement: both
    surprise: 5

  - slug: china-self-sufficiency
    headline: China makes almost all the chicken it eats, and the share keeps rising
    body: >-
      Dividing production by total supply in the USDA FAS "Meat, Chicken"
      PSD table gives 95.1% self-sufficiency for 2023, 97.0% for 2024, and
      97.4% for 2025 - a rising share, and far closer to fully
      self-sufficient than Mexico's ~79-80% or the UK's 83%. China became
      a net chicken-meat exporter in 2024 for the first time in the
      series, and both the export share of production and the import share
      of consumption have stayed in the low single digits throughout.

      Computed here from the same PSD table's production and total-supply
      rows, the same way Canada's self-sufficiency was computed from two
      AAFC figures rather than published as a ratio directly - carried as
      a fact rather than an output_stat_year row for that reason.
    source: usda-fas-gain-ch2025-0170
    placement: both
    surprise: 3

  - slug: china-broiler-headcount-not-loaded
    headline: The one Chinese broiler head count found could not be reconciled with its own tonnage
    body: >-
      China's National Broiler Industry Technology System reports 14.84
      billion broilers produced in 2024 (white-feather 9.03 billion,
      yellow-feather 3.33 billion, small white-feather 2.48 billion) - the
      only broiler-specific bird count this project found anywhere for
      China. It is not loaded as this project's head_slaughtered figure,
      because the same report's own meat-output tonnage for white and
      yellow broilers alone (22.11 million tonnes) does not reconcile with
      the production tonnage this project DOES load from USDA (15.35
      million tonnes) - see china-production-estimate-conflict. Loading a
      head count next to a tonnage figure it cannot be squared against
      would imply a bird weight nobody actually measured.
    source: agripost-cn-broiler-industry-2024
  # Fifth country. See docs/JAPAN-PLAN.md.

  - slug: japan-shipped-not-slaughtered
    headline: "Japan's national chicken count measures a truck leaving, not a bird dying"
    body: >-
      MAFF's annual broiler figure - 731,847 thousand birds for the year
      ending February 2024 - counts 出荷羽数, birds SHIPPED off the farm,
      not a post-mortem count taken at the processing plant the way
      Statistics Canada's registered-plant slaughter reports are. This
      project loads it as head_slaughtered anyway, on the working
      assumption that a broiler shipped from a Japanese farm has nowhere
      else to go but immediate slaughter - but that assumption was not
      independently checked against a separate post-mortem count, because
      no such Japanese national count was found in this research pass.

      This is the same family of caution as Canada's eviscerated-vs-live
      weight basis and the UK's carcase-weight footnote: naming exactly
      what a government number measures, rather than assuming every
      country's "how many birds" answer was taken at the same point in the
      supply chain.
    source: maff-chikusan-toukei-broiler-2024
    placement: learning
    surprise: 3

  - slug: japan-kyushu-tohoku-concentration
    headline: Two regions produce three in four of Japan's chickens
    body: >-
      Kyushu alone accounts for 49.3% of Japan's broiler shipments and
      Tohoku a further 24.6% - together 73.8% of the national total, per
      MAFF's own 2024 prefecture-level count. Within Kyushu, Kagoshima
      (21.8% of the NATIONAL total on its own) and Miyazaki (18.7%) are,
      along with Tohoku's Iwate (16.7%), the three prefectures that between
      them ship more than half of every broiler raised in the country -
      three prefectures out of forty-seven.

      This is a sharper concentration than the corpus has recorded for any
      other country: Canada's largest province (Ontario) is 32.6% of that
      country's head count, and the US spreads its top three states
      (Georgia, Arkansas, Alabama) across a wider base.
    source: maff-chikusan-toukei-broiler-2024
    placement: both
    surprise: 3

  - slug: japan-self-sufficiency-65-percent
    headline: Japan grows about two in three of its own chickens, and the number is rising
    body: >-
      Japan's chicken meat self-sufficiency ratio - domestic production
      divided by domestic consumption, by weight - was 65% for FY2023, up
      from 64% the year before and part of a longer climb from the high
      50s a decade earlier, per MAFF's own Food Balance Sheet. This is a
      DIFFERENT statistic from Japan's much more widely quoted overall
      calorie-basis food self-sufficiency rate (38% the same year), which
      covers every food category at once and is not specific to chicken.

      Domestic production itself is a genuine twelve-year streak: 2023 was
      the twelfth consecutive record year for Japanese chicken meat output,
      reaching 1.69 million tonnes on a bone-in-equivalent basis.
    source: maff-shokuryo-jukyuhyo-r5
    placement: result
    surprise: 2

  - slug: japan-two-government-sources-agree-within-a-fraction
    headline: A Japanese ministry and a US attaché independently landed within 0.2% of each other
    body: >-
      MAFF's own Food Balance Sheet puts 2023 Japanese chicken meat
      production at 1,690 thousand tonnes. The USDA's Foreign Agricultural
      Service, working independently from its own "New Post" estimate
      rather than simply relaying MAFF's figure, put the same year at 1,686
      thousand tonnes - 0.2% apart. Two publishers, two different
      methodologies, the same year, landing four thousand tonnes apart out
      of nearly 1.7 million: the kind of agreement that makes a figure
      worth trusting rather than merely worth citing.
    source: maff-shokuryo-jukyuhyo-r5
  - slug: germany-poultry-skin-included
    headline: German chicken statistics count the skin -- almost nothing else's do
    body: >-
      Germany's official "Schlachtgewicht" (slaughter weight) definition
      excludes skin for cattle, sheep, goats and horses, but poultry is one
      of only two exceptions -- alongside pigs -- where the skin stays on
      the reported figure. The government's own definition: "the plucked
      and eviscerated body, without head, feet, neck, heart, liver or
      gizzard" - eviscerated, but not skinned.

      So Germany's 1.1-million-tonne broiler figure is closer in concept to
      a whole roasting bird than to a skinless retail cut, and comparing it
      directly to a country whose statistics quietly assume skin-off would
      overstate that country's chickens by however much a chicken's skin
      weighs. Germany's own statistics agency says plainly that there is no
      single uniform Schlachtgewicht definition across species - this
      project treats that as a warning worth repeating, not a technicality.
    source: bmel-versorgungsbilanz-fleisch-doku
    placement: learning
    surprise: 4

  - slug: germany-niedersachsen-half-the-flock
    headline: Half of Germany's chicken housing sits in one state
    body: >-
      The 2020 Agricultural Census counted about 186.3 million housing
      places for chickens nationwide, and Destatis states plainly that
      poultry housing "is with 50% of all housing places especially
      concentrated in Niedersachsen" (Lower Saxony) - one of sixteen German
      states holding half the country's capacity.

      This is a housing-capacity figure, not a slaughter-throughput one, and
      it covers chickens broadly (broilers and laying hens together), not
      broilers alone - the two caveats this project carries alongside it
      rather than smoothing into a cleaner-sounding broiler-specific claim
      the census does not actually make.
    source: destatis-lz2020-viehhaltung-pm
    placement: both
    surprise: 3

  - slug: germany-niedersachsen-2014-broiler-share
    headline: A decade ago, Lower Saxony alone slaughtered more than half of Germany's broilers
    body: >-
      Niedersachsen's own state statistics office reported that in 2014 the
      state accounted for 53.0% of German Jungmasthühner (broiler) slaughter
      by head count, and 59.1% of national poultry slaughter by weight -
      already a majority from one of sixteen states, a decade before the
      2020 census's housing-capacity figure told a similar story from a
      different angle.

      Kept explicitly dated to 2014 rather than presented as current: this
      is the most recent BROILER-SPECIFIC regional figure this project
      could source for Germany, because Destatis's own poultry-slaughter
      tables carry no state (Bundesland) breakdown at all in the years this
      project could reach directly - see docs/GERMANY-PLAN.md.
    source: niedersachsen-fleischerzeugung-1994-2014
    placement: learning
    surprise: 3

  - slug: germany-selfsufficiency-hides-which-bird
    headline: Germany's "100% self-sufficient in poultry" headline is not about chicken alone
    body: >-
      Germany's government reports poultry meat self-sufficiency at 100.4%
      and per-capita poultry consumption at 13.6 kg, both for 2024 - but
      both figures are for "Geflügelfleisch," which bundles chicken with
      turkey, duck and goose. The same release says the year's growth was
      driven "particularly" by chicken, without ever separating out a
      chicken-only version of either headline number.

      This project does not load either figure as a chicken statistic for
      that reason - the same discipline Mexico's carne-de-ave/carne-de-pollo
      distinction already established. A German reader asking "is Germany
      self-sufficient in CHICKEN specifically" does not currently have a
      sourced answer here, and neither does this project invent one.
    source: ble-fleischbilanz-2025-pm
    placement: learning
    surprise: 3
  # ---- Russia -----------------------------------------------------------
  # Fifth country. See docs/RUSSIA-PLAN.md. Thinner than Mexico's coverage:
  # only a 2020 GAIN report reaches chicken-specific figures at all, and the
  # 2023-2024 conflict below is reported rather than resolved.

  - slug: russia-poultry-not-broken-out-by-species
    headline: "Russia's national statistics don't separate chicken from other poultry"
    body: >-
      Rosstat, Russia's federal statistics service, publishes a single
      national line for "птица" (poultry: chicken, turkey, duck, and goose
      together), with no chicken-only or broiler-only row at the national
      level. That is a step behind even Mexico's "carne de ave" vs "carne de
      pollo" split, where the broader poultry aggregate is at least
      published separately from the chicken-specific one. The only source
      this project could reach that isolates chicken meat specifically is a
      2020 USDA attaché report, quoting 2019-2020 Rosstat data one step
      removed from Rosstat's own publication - so this project's Russian
      figures are older and thinner than its Mexican ones, not because
      nobody looked harder, but because the underlying government
      publication genuinely does not exist at that granularity.
    source: usda-fas-gain-rs2020-0042
    placement: both
    surprise: 4

  - slug: russia-2023-poultry-meat-three-way-conflict
    headline: Three sources, three different numbers, one year
    body: >-
      For 2023 Russian poultry-meat production alone, this project found
      three mutually inconsistent published totals: 5,339,467 tonnes
      (Rosstat's own national workbook, all-poultry, slaughter weight),
      5.34 million tonnes (a trade-press site, labelled "broiler meat" but
      numerically indistinguishable from Rosstat's all-poultry figure), and
      5.156 million tonnes (an industry-analytics site, again all-poultry,
      not broiler-specific). None of the three is confirmed chicken-only,
      and none of the three agrees with either of the others to within
      3.5%. Rather than pick one, or split the difference, this project
      reports none of them as a corpus figure and states the conflict
      plainly - the same discipline Mexico's world-rank and per-capita
      traps already established for this corpus.
    source: tsenovik-imit-dinamika-2023
    placement: learning
    surprise: 4

  - slug: russia-poultry-union-reports-all-poultry-not-broiler
    headline: "Even Russia's own poultry trade body talks about all poultry, not just chicken"
    body: >-
      Rosptitsesoyuz, the Russian poultry producers' union, forecast 5.46
      million tonnes of poultry meat (carcass weight, all farm categories)
      for 2024 in its most recent public statement this project could
      reach - and that figure, like Rosstat's own, is for poultry as a
      whole, not chicken specifically. Rosptitsesoyuz's own website
      (rosptitsesoyuz.ru) could not be reached at all from this research
      environment (a DNS failure, the same shape of dead end Mexico's SIAP
      portals hit), so even this figure reaches the corpus secondhand, via
      press coverage of a spokesperson's remarks, not from the union's own
      publication.
    source: interfax-rosptitsesoyuz-2024-forecast
    placement: learning
    surprise: 2
