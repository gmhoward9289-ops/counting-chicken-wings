# What it took to make the bird, and who got paid.
#
# ALLOCATION WARNING, and it matters more than any single figure here.
#
# A dozen wings does NOT carry six birds' worth of footprint. Wings are
# about 7.3% of live weight; the rest of each bird became breast, thighs,
# and drums that someone else ate. Charging the whole bird to the wings
# would overstate the answer by roughly 14x.
#
# So every per-bird figure below is stored raw, and the model allocates by
# MASS at query time. Mass allocation is the conservative, standard LCA
# choice. Economic allocation would give a HIGHER number for wings, because
# wings sell at a premium per pound relative to the rest of the carcass --
# worth stating plainly rather than hiding behind one number.

footprint:
  species: broiler
  source: ncc-broiler-lca-2020
  reference_lw_lb: 6.37
  year: 2020
  metrics:
    - metric: global_warming
      label: Greenhouse gas
      unit: kg CO2 eq
      per_individual: 2.90
      per_kg_liveweight: 1.00
      pct_change_decade: -18.1
      notes: >-
        Driven down by an 8.7% feed conversion improvement and less
        distillers' grain in the ration. Production rose 21% while feed use
        rose only 11%.

    - metric: land_use
      label: Land use
      unit: m2a crop eq
      per_individual: 5.26
      per_kg_liveweight: 1.85
      pct_change_decade: -13.0
      notes: Almost entirely feed crops, not the chicken house.

    - metric: water
      label: Water consumption
      unit: m3
      per_individual: 0.73
      per_kg_liveweight: 0.25
      pct_change_decade: -13.0
      notes: >-
        Dominated by feed crop irrigation. On-farm drinking and cleaning
        water is under 10% of the total, so "how much water does a chicken
        drink" is close to irrelevant to the footprint.

    - metric: fossil_resources
      label: Fossil resource use
      unit: kg oil eq
      per_individual: 0.61
      per_kg_liveweight: 0.21
      pct_change_decade: -22.1
      notes: The largest improvement of the five categories.

    - metric: particulate_matter
      label: Fine particulate formation
      unit: g PM2.5 eq
      per_individual: 5.87
      per_kg_liveweight: 2.03
      pct_change_decade: -13.8

    - metric: electricity
      label: Electricity use
      unit: kWh
      per_individual: 0.251
      # 0.251 kWh / 2.8894 kg (6.37 lb converted) -- OUR division, not the
      # source's; the source reports the per-bird figure only.
      per_kg_liveweight: 0.0869
      notes: >-
        NOT one of the five headline ReCiPe impact categories above (those
        are the blended "broiler + culled breeder hen" average bird) --
        this is a distinct line straight out of the same source's raw
        lifecycle inventory (Table 7, "2020 broiler operation lifecycle
        inventory flows"), which reports inputs of 0.251 kWh grid
        electricity plus 0.235 MJ diesel (generator) and 3.336 MJ propane
        heat per one broiler at 6.37 lb live weight -- the identical
        reference weight used throughout this block. Electricity alone is
        reported here because it is the metric this gap asks for; the
        propane and diesel heat inputs are real too but are not
        electricity and are left out rather than folded in.

        Scope matters: this is ON-FARM GROWOUT electricity only (house
        ventilation, heating/cooling controls, lighting, feed/water
        auger motors). Hatchery incubation and processing-plant chilling,
        freezing and cold-chain electricity are real additional draws
        NOT captured in this figure and NOT currently sourced anywhere in
        this corpus -- the LCA's breeder-operation table (its Table 8)
        does report 0.0179 kWh per hatching egg for the parent/grandparent
        stage, but converting that into a per-broiler hatchery figure
        would require assumptions this source doesn't support, so it is
        left out rather than estimated.

        No 2010 comparison is published for this line item (unlike the
        five ReCiPe categories above), so pct_change_decade is omitted
        rather than invented.

# Feed, derived rather than asserted: feed conversion ratio times market
# weight. FCR 1.69 (2024) against a 6.57 lb market weight.
derived_feed:
  species: broiler
  source: ncc-broiler-performance
  feed_lb_per_bird_lo: 10.5
  feed_lb_per_bird_mode: 11.1
  feed_lb_per_bird_hi: 11.7
  notes: >-
    1.69 lb of feed per lb of gain at a 6.57 lb market weight is about
    11.1 lb of feed per bird. Six birds behind a dozen wings therefore ate
    roughly 67 lb of feed - but only about 7.3% of that is chargeable to
    the wings under mass allocation, so the wings' share is about 4.9 lb.

economics:
  domain: poultry
  stats:
    - slug: grower_pay_per_lb
      label: Contract grower pay
      value_lo: 0.038
      value_mode: 0.042
      value_hi: 0.046
      unit: USD per lb live weight
      basis: per_lb_liveweight
      confidence: measured
      source: ers-broiler-grower-fees
      notes: >-
        Paid under a relative "tournament" system: a farm's rate depends on
        how it performed against other farms delivering the same week, so
        two growers doing identical work can be paid differently.

        Six birds at 6.62 lb is 39.7 lb of live weight, so the grower
        received about $1.67 for raising them. Allocated to the wings alone
        that is roughly 12 cents. The farmer's share of a dozen wings is
        about the price of a stick of gum.

    - slug: grower_net_annual
      label: Grower net income per house
      value_lo: 6000
      value_mode: 9000
      value_hi: 12000
      unit: USD per year
      basis: per_year
      confidence: industry
      source: poultrysite-contract-economics
      notes: >-
        A 20,000 sq ft house grosses $34,000-$40,000 against $28,000-$30,000
        of costs during the 15-year mortgage period. The gross is large and
        the margin is thin, which is the defining feature of contract
        growing.

    - slug: direct_jobs
      label: Direct industry employment
      value_mode: 355000
      unit: workers
      basis: national
      confidence: industry
      source: ncc-key-facts
      notes: 355,000 direct and about 1.2 million indirect workers.

    - slug: contract_farms
      label: Contract family farms
      value_mode: 25000
      unit: farms
      basis: national
      confidence: industry
      source: ncc-key-facts

    - slug: slaughter_plants
      label: Slaughter and evisceration plants
      value_mode: 180
      unit: plants
      basis: national
      confidence: industry
      source: ncc-key-facts

# LABOR-HOURS PER BIRD / PER DOZEN WINGS -- LOOKED FOR, NOT ADDED.
# ------------------------------------------------------------------
# direct_jobs above (355,000) is a national employment STOCK, not a
# per-unit figure, and does not answer "how many person-minutes did this
# plate take". Searched for a real per-unit labor-intensity figure and
# found two candidates, both rejected:
#
#   1. USDA AMS Marketing Research Report No. 83 (1955), "Marketing
#      Georgia Broilers Through Commercial Processing Plants" -- reports
#      28-41 birds processed per labor-hour (~1.5-2.1 labor-minutes/bird)
#      on hand-run processing lines observed in spring 1953. A real,
#      verifiable government figure, but describing 1953-54 hand
#      processing technology 70+ years before line-speed automation,
#      mechanical evisceration, and modern plant throughput. Presenting
#      it as today's labor intensity would be the kind of false precision
#      this project exists to refuse.
#
#   2. A derived ratio: BLS "Hours Worked, Poultry Processing (NAICS
#      311615)" total industry hours divided by USDA NASS young-chicken
#      headcount/weight (Poultry Slaughter, 2024 Summary). Rejected for
#      two reasons. First, NAICS 311615 hours cover ALL poultry
#      processing establishments -- turkey and other poultry are
#      commingled with chicken in the numerator, while the USDA
#      denominator is young chickens only, so the ratio overstates
#      chicken-specific labor by an un-quantified amount. Second, and
#      decisive: the BLS series could not actually be verified against a
#      primary BLS page during this pass -- fred.stlouisfed.org and
#      bls.gov both returned HTTP 403 to direct fetch, leaving only a
#      third-party-reported number with no primary document this project
#      could point at, which fails the "verify a source actually loads
#      and says what you think" bar the rest of this corpus holds to.
#
# A modern, chicken-specific, verifiable labor-hours-per-unit figure
# (USDA ERS poultry processing productivity work, or a peer-reviewed
# study breaking out broiler-only processing labor) is a real follow-up
# worth another pass. Nothing is better than a fabricated precision here.
