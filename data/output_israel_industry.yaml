# Israeli broiler figures that CBS does not publish.
#
# Hand-curated, unlike data/output_israel.yaml, which is generated by
# tools/parse_cbs_israel.py and must not be edited. The split is deliberate:
# one file holds what a national statistical agency measured, the other holds
# what the industry says, and the two are never mixed in one file.
#
# THE POINT OF THIS FILE: chapter 21 answers scale and nothing else, so with
# CBS alone Israel cannot answer "how many chickens" at all. This is the
# figure that unlocks it, and it is a weaker figure than everything CBS
# publishes. Both readings are therefore kept available rather than one being
# chosen on the reader's behalf:
#
#   government only   -> min_confidence=measured. Israel reports tonnage,
#                        value, a standing flock and districts. No bird count,
#                        so no count answer. This is the conservative case.
#   including industry -> the default. 260 million birds a year, from a named
#                        industry official, and an implied ~2.3 kg a bird that
#                        agrees with a 40-day grow-out.
#
# `GET /api/output/ISR?min_confidence=measured` is the first; the same call
# without the parameter is the second. The answer changes and the grade says
# why.

species: broiler
country: ISR

national:
  # Throughput, and the distinction from inventory_eoy is the whole reason
  # this row is worth having. CBS's 37,895 thousand head is a STANDING FLOCK;
  # this is birds through the system in a year. A flock of 37.9 million
  # turning over five to seven times a year is consistent with 260 million,
  # which is the cross-check that makes the figure credible rather than merely
  # quotable.
  - measure: head_slaughtered
    unit: thousand_head
    confidence: industry
    source: toi-poultry-imports-2025
    notes: >-
      Attributed to Moti Elkabetz, secretary of the Poultry Breeders
      Association, in the Times of Israel, 2025-09-07. A named official rather
      than an anonymous "industry estimate", which is the only reason it is
      loaded at all.

      Graded 'industry', not 'measured'. Nobody enumerated it: it is a working
      figure from inside the trade, and the contrast with the US - where NASS
      counts 9,579,797,000 birds and publishes the count - is the honest thing
      to show a reader rather than hide.

      The year is the year the claim was published. The source says "raised
      annually" without naming a year, so 2025 is when it was true according
      to the person saying it, not a year CBS would recognise. Do not pair it
      with a specific CBS year and call the pair a measurement.
    years:
      - {year: 2025, value: 260000}

  # Promoted 2026-07-30 from the human read of batch-05's returned documents.
  # Both figures come from the growers' organisation summary for 2021, and
  # both exist to CHECK the Times of Israel head count rather than to replace
  # it -- it is a single-source figure and this is its only corroboration.
  - measure: chicks_placed
    unit: thousand_head
    confidence: industry
    source: ofot-sector-summary-2021
    notes: >-
      244 million chicks supplied by 78 breeding operations in 2021, verbatim
      "שלוחות הרבייה 78 · 244 מיל' אפרוחים".

      NOT birds slaughtered, and the distinction is the whole reason this has
      its own measure. Grow-out mortality sits between a chick placed and a
      bird slaughtered, so loading 244 million as head_slaughtered would
      overstate throughput by exactly that mortality - which the model already
      carries as a loss factor, and would then be double-counting.

      What it is good for: 244 million in 2021 against 260 million a year
      reported for 2025 by a different industry body is a ~6% gap over four
      years, which is roughly what growth looks like. Two organisations that
      did not copy each other, agreeing on the order of magnitude.
    years:
      - {year: 2021, value: 244000}

  - measure: grower_count
    unit: growers
    confidence: industry
    source: ofot-sector-summary-2021
    notes: >-
      604 broiler growers in 2021, verbatim "בשר פטמים 604".

      Corroborates the Times of Israel's "about 600 large chicken farms" from
      the Poultry Breeders Association secretary. Two industry bodies, two
      publications, one number - which is what makes it worth holding despite
      neither being a government count.
    years:
      - {year: 2021, value: 604}
