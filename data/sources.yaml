# Every statistic in this project traces to one of these.
# The build refuses to insert a fact whose source_id is missing.

- slug: nass-poultry-slaughter-2025
  title: Poultry Slaughter 2025 Summary
  publisher: USDA National Agricultural Statistics Service
  url: https://www.nass.usda.gov/Publications/Todays_Reports/reports/pslaan26.pdf
  published_on: '2026-02-01'
  retrieved_on: '2026-07-28'
  source_type: government
  notes: >-
    Definitive US slaughter statistics. NASS reports the broiler population
    under the category "Young Chickens", defined in the report as
    "commercially grown broilers-fryers and other young immature birds such
    as roasters and capons". Highest-confidence source in the project.

