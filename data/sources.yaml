- slug: wing-yield-eight-strains
  title: Yield of Carcass, Parts, Meat, Skin, and Bone of Eight Strains of Broilers
  publisher: Poultry Science
  url: https://www.sciencedirect.com/science/article/pii/S003257911946625X/pdf
  retrieved_on: '2026-07-28'
  source_type: peer_reviewed
  notes: >-
    Whole wing as a share of carcass weight (9.1-10.2%) and of live weight
    (6.7-7.3%), measured across eight commercial broiler strains.

- slug: boneless-wing-method
  title: >-
    A method of production of boneless chicken wings (drumettes and winglets)
    by separation of periosteum from bone without cutting skin and muscles
  publisher: Poultry Science
  url: https://www.sciencedirect.com/science/article/pii/S0032579119322989
  retrieved_on: '2026-07-28'
  source_type: peer_reviewed
  notes: >-
    Segment masses: bone-in drumette 39.9 g at 74.9% boneless yield, bone-in
    winglet 30.7 g at 80.1% boneless yield.

- slug: wing-injuries-loading
  title: >-
    Rearing and handling injuries in broiler chickens and risk factors for
    wing injuries during loading
  publisher: Canadian Journal of Animal Science
  url: https://cdnsciencepub.com/doi/10.1139/cjas-2019-0204
  retrieved_on: '2026-07-28'
  source_type: peer_reviewed
  notes: >-
    Median wing injuries per load 5.7%, against under 1% per load for legs,
    breast, and shoulders. Wings are by a wide margin the most damaged part
    of the bird. Load-to-load variance is high, so this is stored with a
    wide lo/hi band.

- slug: welfare-training-carcass-quality
  title: >-
    The Influence of Welfare Training on Bird Welfare and Carcass Quality in
    Two Commercial Poultry Primary Processing Plants
  publisher: Animals (PMC)
  url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6719098/
  retrieved_on: '2026-07-28'
  source_type: peer_reviewed
  notes: >-
    90% of bruising occurs in the 12-24 hours before processing. Bruise
    distribution by region: breast 42%, wings 33%, legs 25%.

