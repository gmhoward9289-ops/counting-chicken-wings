  title: Производство и потребление мяса, поголовье скота в РФ — 2024
  publisher: Agromiks (agromics.ru)
  url: https://agromics.ru/novosti/proizvodstvo-myasa-2024/
  retrieved_on: '2026-08-16'
  source_type: trade_press
  notes: >-
    Trade-press analytics site, attributing its figures to Rosstat. States
    "5,42 миллиона тонн" (5.42 million tonnes, slaughter/carcass weight) of
    what it labels "мясо бройлеров" (broiler meat) for 2024, up 1.5% from
    "5,34 миллиона тонн" in 2023, plus a broiler headcount of "556,03
    миллиона особей" (556.03 million birds) as of end-2024 (+2.2% y/y). Also
    states chicken is 44.48% of Russia's 12.2-million-tonne total meat
    output (all species, not just poultry) in 2024, and derives a per-capita
    figure of 36.49 kg/person/year from production plus net trade.

    NOT LOADED AS A CHICKEN-SPECIFIC CORPUS FIGURE. Both the 2023 tonnage
    (5.34 million) and the shape of the 2024 tonnage (5.42 million) are
    numerically indistinguishable, to three significant figures, from
    Rosstat's own ALL-POULTRY slaughter-weight total for the same years
    (5,339,467 t reported for 2023 in Rosstat's national workbook, per
    independent research - see docs/RUSSIA-PLAN.md and
    docs/research/library/poultry-russia.yaml). This site's own separate
    "мясо птицы" (poultry meat, not broiler-specific) article
    (rynok-myasa) reports figures in the same range for the same years.
    Whether this source has genuinely isolated broiler-only production, or
    is relabeling Rosstat's all-poultry total as "бройлеров" the way trade
    press sometimes conflates "ave" and "pollo" for Mexico, could not be
    resolved from the page itself - it names Rosstat as its source but does
    not name a specific Rosstat table or publication. Carried as a fact
    with this caveat stated plainly, not as an output_stat_year row.

