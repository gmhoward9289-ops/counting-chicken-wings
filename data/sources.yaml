- slug: maff-chikusan-toukei-broiler-2024
  title: >-
    畜産統計調査 確報 令和６年畜産統計 ブロイラー（令和６年２月１日現在）
    ("Livestock Statistics Survey, Reiwa 6 report, Broiler, as of
    February 1, 2024") — tables 5(1) and 5(4)
  publisher: Ministry of Agriculture, Forestry and Fisheries (MAFF), via e-Stat
  url: https://www.e-stat.go.jp/stat-search/files?toukei=00500222&tstat=000001015614&tclass1=000001020206&tclass2=000001223340&layout=datalist&cycle=7
  published_on: '2024-11-29'
  retrieved_on: '2026-08-16'
  source_type: government
  notes: >-
    A genuine annual government enumeration, not an interview or trade-body
    estimate — the direct MAFF equivalent of StatCan's registered-plant
    slaughter reports for Canada. Two tables from this survey are loaded,
    fetched as raw .xlsx directly from e-Stat's file-download endpoint
    (statInfId=000040226155 for table 5(1), statInfId=000040226158 for
    table 5(4)) and parsed with openpyxl, not read from a rendered page —
    see docs/research/library/poultry-japan.yaml for the exact URLs.

    Table 5(1), "飼養戸数・羽数" (farms and rearing/inventory bird count):
    144,859 thousand birds nationally as of 2024-02-01 (up 2.4% year on
    year), across 2,050 farms (down 2.4% year on year -- the farm-count and
    bird-count columns move in opposite directions and must not be swapped).
    This is a STANDING-FLOCK snapshot (inventory_eoy),
    not throughput — the same distinction NASS draws for the US and the same
    one Mexico's plan could not resolve at all. Independently corroborates
    the USDA FAS GAIN report's "approximately 145 million birds... up two
    percent" citation of this same MAFF survey (usda-fas-gain-ja2024-0043),
    confirming the secondhand quote against the primary table itself.

    Table 5(4), "出荷羽数規模別の出荷羽数" (shipment numbers by shipment-scale
    category): 731,847 thousand birds shipped nationally, with a full
    47-prefecture breakdown and nine regional-agriculture-bureau subtotals.
    THE BASIS CAVEAT THE PROJECT BRIEF ASKED FOR: this is 出荷羽数 (birds
    SHIPPED from the farm within the past year), not a post-mortem
    processing-plant count the way StatCan's Canadian figure is. MAFF's own
    note 2 on this table clarifies the count includes any operation that
    shipped 3,000+ birds in the past year even if it held no birds on the
    February 1 census date — i.e. it is an annual throughput figure, not a
    second inventory snapshot. Loaded as head_slaughtered on the working
    assumption (not independently verified against a separate post-mortem
    count) that a broiler shipped from a Japanese farm has no destination
    other than immediate slaughter — unlike, say, a laying hen, which can be
    sold on as breeding or backyard stock. Suppressed prefecture cells ('x'
    in the source) are loaded as suppressed=1/value=NULL; cells marked '-'
    (no broiler operations meeting survey scope) are loaded as value=0.
    Survey excludes non-commercial keepers (schools, test farms) per the
    table's own note 1.

