    marked "0" under "USDA Official" (not yet published at the time of this
    report) and are FORECASTS under "New Post" — not loaded, following this
    project's standing rule against loading projections as actuals (see the
    Mexico precedent in usda-fas-gain-mx2024-0040).

    Also the source for Japan's stated 2023-2024 weight-basis convention:
    Table 2 reports "Chicken Production in January – June, Unit: MT, RTC"
    (ready-to-cook), corroborating the "bone-in meat equivalent" basis
    documented for MAFF's own production figure.
