- slug: ibge-sidra-1094-abate-frangos
  title: >-
    Tabela 1094 - Número de informantes, Quantidade e Peso total das
    carcaças dos frangos abatidos, no mês e no trimestre, por tipo de
    inspeção (Pesquisa Trimestral do Abate de Animais)
  publisher: Instituto Brasileiro de Geografia e Estatística (IBGE)
  url: https://sidra.ibge.gov.br/tabela/1094
  retrieved_on: '2026-08-16'
  source_type: government
  notes: >-
    Brazil's NASS/StatCan-equivalent quarterly animal slaughter survey,
    queried directly via IBGE's SIDRA REST API
    (apisidra.ibge.gov.br/values/t/1094/...), not scraped from the table
    viewer - the same "real API" shape Statistics Canada's Web Data
    Service was for Canada, and the opposite of Mexico's unreachable SIAP.
    Isolates chicken ("frangos") slaughter specifically, by state (UF),
    with head count (variable 284, "Animais abatidos") and carcass weight
    in kg (variable 285, "Peso total das carcaças") from federal + state +
    municipal sanitary inspection combined, plus a machine-readable
    suppression code ("X" for confidential cells, ".." for not-applicable)
    per state per quarter.

    NATIONAL 2025, summed from the four published quarters (this project's
    own arithmetic on IBGE's real quarterly counts - IBGE does not itself
    publish a 2025 annual total in this table): 6,695,465,295 head
    slaughtered (1,647,469,931 + 1,641,006,289 + 1,690,778,193 +
    1,716,210,882), 14,304,261,496 kg carcass weight = 14,304,261 tonnes
    (3,492,399,355 + 3,558,452,775 + 3,598,165,273 + 3,655,244,093).

