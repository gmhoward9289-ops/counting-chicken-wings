- slug: usda-fas-gain-mx2024-0040
  title: 'Mexico: Poultry and Products Annual (GAIN Report MX2024-0040)'
  publisher: USDA Foreign Agricultural Service (FAS GAIN)
  url: https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Poultry+and+Products+Annual_Mexico+City_Mexico_MX2024-0040.pdf
  published_on: '2024-09-04'
  retrieved_on: '2026-08-16'
  source_type: government
  notes: >-
    A US government attaché report, not Mexico's own statistical agency, but
    the only route this project found into current Mexican production
    figures at all: SIAP's own portals (infosiap.siap.gob.mx,
    nube.agricultura.gob.mx) were unreachable from this research
    environment - DNS failure on the first, connection refused on the
    second, for every path tried. See docs/research/library/poultry-mexico
    for the full record.

    Its PSD Table 1 is titled "Meat, Chicken" specifically - the
    broiler-only reading, checked against the report's own wording rather
    than assumed, because Mexican usage separately reports "carne de ave"
    (poultry, including turkey) as a broader aggregate that must not be
    conflated with it. Production: 3,888 thousand MT (2023) and 3,985
    thousand MT (2024, still an in-year estimate at publication - loaded
    provisional). 2025's 4,085 thousand MT is a FORECAST and is not loaded.

    CONFIDENCE DELIBERATELY CAPPED AT INDUSTRY, not measured, even though
    the publisher is a government body. The report's own PSD table carries
    the footnote "Note: Not official USDA data" and directs readers to PSD
    Online for the reconciled figure - this is a Post-level estimate
    reconciling SIAP and trade data, one step further from the primary
    measurement than a government agency's own published table.

    SELF-SUFFICIENCY is arithmetic already sitting in this table: 3,888 /
    4,894 (total supply, 2023) = 79.4%, corroborated within a point by two
    independent trade-press figures (bmeditores 79.6%, avicola.com.mx
    ~80%) - which is why it ships as a fact and per-capita consumption does
    not.

    STATE RANKING SPLITS IN TWO, and conflating them would misattribute
    which crop each describes. "Puebla, Veracruz, Aguascalientes, and
    Querétaro follow Jalisco in flock size... 50 percent of Mexico's
    poultry population" is ALL POULTRY (Jalisco leads it partly via egg
    layers), not broiler-specific. Separately, "For chicken meat
    production, Veracruz is the leading state, followed by Aguascalientes,
    Jalisco, Querétaro, and, to a lesser extent, Durango, Chiapas,
    Guanajuato, and Puebla" (70% of national output across the eight) IS
    broiler-specific and is the ranking used in the state-concentration
    fact - ordinal only, since no percentages are given here.

    Also carries, NOT loaded as corpus figures: per-capita consumption
    "37.75 kg for chicken" (2024, one of five mutually inconsistent
    Mexican per-capita figures found in this pass - see the plan's headline
    section), imports (2024 est. 960,000 MT, down 4.57% from 2023's
    1,006,000 MT; 86% from the US, ~14% from Brazil in 2023), exports
    (2024 est. 4,000 MT), and TIF (federally-inspected) slaughter coverage
    - 121 plants, an estimated 85% of 2024 slaughter, up from 83% in 2023.

