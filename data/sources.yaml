- slug: usda-fas-gain-rs2020-0042
  title: 'Russia: Poultry and Products Annual (GAIN Report RS2020-0042)'
  publisher: USDA Foreign Agricultural Service (FAS GAIN), Post Moscow
  url: https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Poultry%20and%20Products%20Annual_Moscow_Russian%20Federation_08-15-2020
  published_on: '2020-09-21'
  retrieved_on: '2026-08-16'
  source_type: government
  notes: >-
    A US government attaché report, the only source this project found that
    isolates CHICKEN meat specifically (Table 1, "Poultry, Meat, Chicken")
    from Russia's blended national poultry total. Fetched directly; WebFetch's
    own summarizer refused the PDF as binary, but the file it saves to disk
    underneath extracts cleanly with PyMuPDF (`fitz`) - the same workaround
    Mexico's GAIN report needed.

    Table 1 gives, in 1,000 MT RTC (ready-to-cook weight, stated explicitly):
    Production 2019 = 4,668 ("New Post" column; final, adjusted to Rosstat's
    confirmed 2019 total per the report's own text) and 2020 = 4,715 ("New
    Post"; still an in-year estimate as of the report's 2020-09-21
    publication date - loaded provisional). 2021's 4,725 is explicitly a
    FORECAST ("expected to lift production to 4.725 MMT (RTC) in 2021") and
    is deliberately not loaded, mirroring Mexico's exclusion of GAIN's 2025
    forecast row.

    Table 1 also carries an "Inventory (Reference)" row in million head
    (535 for Jan 2019, 520/523 for Jan 2020, 523 for Jan 2021) - a
    chicken-specific standing-stock reference distinct from the report's
    separate ALL-POULTRY inventory figure (544.691 million head, all fowl,
    as of 2020-01-01). Not loaded into output_stat_year: the table does not
    state whether this "Inventory (Reference)" figure is a beginning- or
    end-of-year snapshot for the labelled market year, and guessing the
    mapping would risk double-counting or mis-dating a stock figure - see
    docs/RUSSIA-PLAN.md.

    CAVEAT CARRIED TO CONFIDENCE GRADE, same reasoning as Mexico's GAIN
    report: annotated "NOTE: Not Official USDA data; Official USDA data is
    available at http://apps.fas.usda.gov/psdonline/" - a Post estimate
    reconciling Rosstat and trade data, not a direct quote of a Rosstat
    publication. Loaded at confidence=industry, even though source_type is
    'government'.

    STRUCTURAL CONTEXT, not loaded as corpus figures: broilers and layers
    together are ~96% of Russia's total poultry inventory (544.691 million
    head, 2020-01-01); industrialized commercial farms account for 93.4% of
    poultry meat production; chicken meat production and consumption
    DECLINED year-on-year in 2019 amid market oversaturation and farm
    bankruptcies, before recovering in 2020. No Russia-specific "Poultry and
    Products Annual" GAIN report has been published since this one - the
    USDA FAS website and search of apps.fas.usda.gov turned up no
    2021-through-2026 successor, so this is necessarily a pre-2022 baseline,
    not a current one. See docs/RUSSIA-PLAN.md.

