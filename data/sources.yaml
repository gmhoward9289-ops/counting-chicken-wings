- slug: ou-kosher-shechita
  title: 'Shechita: All About Kosher Ritual Slaughter'
  publisher: Orthodox Union (OU Kosher)
  url: https://oukosher.org/blog/consumer-kosher/shechita/
  retrieved_on: '2026-07-29'
  source_type: trade_body
  notes: >-
    A kosher certification agency describing its own procedure, which makes it
    authoritative on WHAT HAPPENS and silent on HOW OFTEN.

    For poultry, post-slaughter bedikah inspects the lungs, intestines and
    tendon junctions, and a mashgiach pulls any bird with a blemish off the
    line for a rav to rule on. That is a loss stage with no US analogue -
    FSIS has no equivalent check - and it should push the birds-required
    number up.

    NO REJECTION RATE IS PUBLISHED, here or anywhere reachable. So the stage
    can be described honestly and cannot yet be quantified: any figure we put
    on it would be an 'estimate' of our own making, which is the grade the
    project is trying to reduce. Recorded as a known gap rather than filled.

