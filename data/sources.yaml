- slug: kstate-ext-pork-cutout
  title: Pork Processing Options for Consumers (MF3396)
  publisher: Kansas State University Agricultural Experiment Station and Cooperative Extension Service
  url: https://www.asi.k-state.edu/research/meat-science/Pork.pdf
  published_on: '2018-02-01'
  retrieved_on: '2026-08-17'
  source_type: trade_body
  notes: >-
    The pork-specific yield this subject actually needs, and the only source
    found anywhere that isolates a "ground pork and sausage" line item rather
    than lumping it into a general boneless/bone-in split. The Pork Cutout
    Table, "based on a pork carcass with a 205-pound hot (unchilled) carcass
    weight with average muscling" and "a 3% shrink (cooler shrink and cutting
    loss)": "Trimmings 7.8 [percent of hot carcass] 15.9 [lbs] / Ground pork
    and sausage."

    Two things this figure is NOT: it is not the maximum possible ground pork
    stream (the same page notes "Any of the carcass can be used to make
    ground product" and that picnic shoulder "could also be used to make
    ground pork or sausage" beyond the trimmings line), and it is not a
    stated range - one carcass weight, one point value, unlike SDSU's beef
    bulletin which gave lean trim as a range outright. The lo/hi band on
    ground_pork_1lb_package therefore comes from applying this document's own
    7.8 percent trim fraction across a real range of carcass weights (see
    wsu-ext-butcher-hog-yield), not from a range this document states itself.

    Prepared by Kassandra McKillip, Alaena Wilfong and Travis O'Quinn, Ph.D.,
    Kansas State University, February 2018 (MF3396).

- slug: wsu-ext-butcher-hog-yield
  title: 'From Pig to Pork Chop: How Much Meat to Expect from a Butcher Hog'
  publisher: Washington State University Extension
  url: https://s3.wp.wsu.edu/uploads/sites/2049/2021/02/02.21PorkFabVideoDataFactSheet02.16.2021.pdf
  published_on: '2021-02-16'
  retrieved_on: '2026-08-17'
  source_type: trade_body
  notes: >-
    Supplies the carcass-weight range the K-State trim fraction is spread
    across, and the dressing-percent band: "Market hogs weighing between 250
    - 325 pounds will dress on average 70% (range 68 to 72%) with the
    skin-on and the head-off, resulting in a hanging carcass weight range of
    175 - 228 pounds."

    Also states, without isolating a pounds figure: "if you have more cuts
    made into boneless products, or more grind done for sausage or
    cured/smoked products, the hanging carcass will yield about 65% boneless
    retail meat cuts and some cured meat items, about 114-149 pounds of
    take-home meat." That 65 percent bundles sausage in with cured product
    and is not usable alone for a ground-pork-only figure, which is why
    kstate-ext-pork-cutout carries the product-level number and this source
    carries the carcass-weight range instead.

    By Paul Kuber and Sarah M. Smith, WSU Extension Regional Specialists.
    Fetched successfully via direct PDF download after WebFetch's HTML
    conversion choked on the source's embedded font encoding - the retrieval
    failure was a tooling artifact, not a reason to treat the document as
    unread.

- slug: wisc-ext-hog-yield
  title: How much meat should a hog yield?
  publisher: University of Wisconsin-Madison, Division of Extension
  url: https://livestock.extension.wisc.edu/articles/how-much-meat-should-a-hog-yield/
  retrieved_on: '2026-08-17'
  source_type: trade_body
  notes: >-
    Cited for the general carcass-to-packaged band in loss_chain_ground_pork,
    which is deliberately kept separate from kstate-ext-pork-cutout's
    ground-pork-specific trim figure to avoid double counting - the same
    discipline ground_beef uses. Table 2, "Average Carcass Cutting Yield":
