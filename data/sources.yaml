    That makes this project's exact product part of an Israeli national
    holiday, which is a better demo hook than any production statistic. It
    also observes that falafel, shawarma and schnitzel - the dishes outsiders
    name first - play very little role in the day.

    Undated on the page, so published_on is NULL rather than guessed.

- slug: jfs-independence-day-grilling
  title: The Grilling Tradition of Israel's Independence Day
  publisher: Jewish Food Society
  url: https://www.jewishfoodsociety.org/stories/the-grilling-tradition-of-israels-independence-day
  retrieved_on: '2026-07-29'
  source_type: trade_press
  notes: >-
    Independent corroboration that Yom Ha'atzmaut grilling is near-universal
    rather than a niche custom - the mangal treated as as essential to the day
