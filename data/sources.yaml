    not scraped from the table viewer -- see docs/research/library/poultry-canada.yaml
    for the exact coordinates queried. The one table in this project's whole
    corpus that separates "Chicken" (broilers) from "Fowl" (spent laying
    hens and other stewing birds), which is why it is preferred over
    32-10-0117-01's blended "Chicken (including stewing hen)" line.

    CANADA, Chicken only, 2025: 806,000 thousand head slaughtered,
    1,416,554 thousand kg meat output (numerically equal to 1,416,554
    tonnes), $4,060,369 thousand production value. Five-year national head
    series: 750,419 (2021) / 769,616 (2022) / 782,999 (2023) / 786,183
    (2024) / 806,000 (2025).

    Provincial 2025 (thousand head / thousand kg): Ontario 262,866 /
    493,780; Quebec 218,281 / 371,268; Alberta 81,067 / 139,102; British
    Columbia 119,133 / 197,314; Manitoba 37,244 / 57,973; Saskatchewan
    28,591 / 48,016; Atlantic (a StatCan-defined aggregate of Newfoundland
    and Labrador, Prince Edward Island, Nova Scotia and New Brunswick, each
    suppressed individually via securityLevelCode=1) 58,818 / 109,102. The
    six named provinces plus Atlantic sum EXACTLY to the national HEAD total
    (806,000 to the last thousand) -- unlike Israel's district marketing
    figures, which fall 4.76% short of national output for a documented
    reason. The WEIGHT rows sum to 1,416,555 thousand kg against a published
    national 1,416,554 -- one rounding unit apart, because StatCan rounds
    each series row to the nearest thousand kg independently; confirmed
    against the WDS API directly, so the discrepancy is StatCan's own
    publication artifact and not a transcription error here. Sourced from
    reports of birds
    slaughtered in registered processing plants, per StatCan's own survey
    methodology (record number 5039), so head_slaughtered here is a genuine
    government enumeration, not an industry estimate -- Israel has never had
    this combination at this grade.

    WEIGHT BASIS: this table's own footnotes state only that weight is
    reported in thousand kilograms, not whether that is live or eviscerated
    weight. Resolved via a SEPARATE AAFC publication (see
    aafc-chicken-industry-2026 below), which states explicitly that the
    1.4 billion kg 2025 figure is "eviscerated weight". Treated as
    eviscerated for the purposes of this corpus's meat_output measure on
    that basis, though the two publications are not the same document.

- slug: statcan-32100117-poultry-meat-2026
  title: >-
    Table 32-10-0117-01, Production, disposition and farm value of poultry
    meat (annual)
  publisher: Statistics Canada
