- slug: ers-supermarket-loss
  title: >-
    Supermarket Loss Estimates for Fresh Fruit, Vegetables, Meat, Poultry,
    and Seafood and Their Use in the ERS Loss-Adjusted Food Availability Data
  publisher: USDA Economic Research Service (EIB-44)
  url: https://www.ers.usda.gov/publications/44309
  retrieved_on: '2026-07-28'
  source_type: government
  notes: >-
    Retail-level shrink. ERS previously assumed a flat 7% retail loss for
    every meat, poultry, and seafood category; this study replaced that with
    measured supermarket estimates, cutting loss-adjusted fresh meat,
    poultry, and seafood availability by 7.3% for 2012.

- slug: refed-foodservice
  title: Foodservice methodology, Insights Engine Food Waste Monitor
  publisher: ReFED
  url: https://docs.refed.org/methodologies/food_waste_monitor/foodservice.html
  retrieved_on: '2026-07-28'
  source_type: trade_body
  notes: >-
    Restaurants and foodservice generated 12.5 million tons of surplus food
    in 2024. Pre-consumer waste - spoilage, over-ordering, overproduction -
    runs 4% to 10% of food purchased. Separately, roughly 4.2% of food
    purchases go unutilised in commercial kitchens on average across
    Leanpath's client base. Post-consumer plate waste is about 70% of total
    foodservice waste but is deliberately EXCLUDED from this model: those
    wings reached the plate, which is where our question stops.

- slug: epa-foodservice-waste
  title: Food waste reduction in commercial kitchens (Winnow, EPA materials)
  publisher: US Environmental Protection Agency
  url: https://www.epa.gov/sites/default/files/2019-12/documents/winnow_presentation_12_19_19.pdf
  retrieved_on: '2026-07-28'
  source_type: government
  notes: >-
    Food waste typically runs 4% to 13% of food costs in commercial
    kitchens. Spoilage specifically ranges 1-5% in prepare-ahead operations
    and 1-6% in cook-to-order operations. Corroborates the ReFED band.

- slug: cold-chain-refrigeration-losses
  title: >-
    The impact of refrigeration on food losses and associated greenhouse gas
    emissions throughout the supply chain
  publisher: Environmental Research Letters (IOP)
  url: https://iopscience.iop.org/article/10.1088/1748-9326/ad4c7b
  retrieved_on: '2026-07-28'
  source_type: peer_reviewed
  notes: >-
    Models food loss across 10 supply chain stages and finds improved
    refrigeration cuts losses 26-63% for meat, milk, and produce. IMPORTANTLY
    it does NOT break out a transport-stage loss rate, and the authors state
    that underlying food loss rate data "remain uncertain". Cited here as
    evidence that a clean transit figure does not exist, not as a source for
    one. For meat the paper finds post-harvest handling and storage, not
    transport, is where refrigeration matters most.

- slug: cold-chain-transport-trade
  title: Overcoming challenges in refrigerated transport
  publisher: The National Provisioner
  url: https://www.provisioneronline.com/articles/116667-overcoming-challenges-in-refrigerated-transport
  retrieved_on: '2026-07-28'
  source_type: trade_press
  notes: >-
    Qualitative. Identifies the loss mechanisms for meat in transit -
    temperature excursion triggering load rejection at the receiving dock,
    physical damage, and mishandling - and notes temperature abuse during
    LOADING causes more rejected shipments than transit failures. No
    quantified rejection rate is given, in this or any source found.

- slug: tyson-foodservice-boneless
  title: Fully Cooked Breaded Whole Muscle Boneless Chicken Wings, product specs
  publisher: Tyson Foodservice
  url: https://www.tysonfoodservice.com/products/tyson/chicken/boneless-wings--chunks/00023700055446
  retrieved_on: '2026-07-28'
  source_type: industry_spec
  notes: >-
    Manufacturer piece weights for commercial boneless wings: 0.76 oz and
    0.79 oz per finished breaded piece. A 3.78 oz portion is about six
    pieces. Note the product category name Tyson itself uses - "boneless
    wings & chunks" - and the descriptor "whole muscle chicken breast".
    These are breast chunks, and the manufacturer does not pretend
    otherwise.

- slug: usapeec-paws-export
  title: Chinese appetite for chicken paws proves a boon for U.S. producers
  publisher: USA Poultry & Egg Export Council
  url: https://www.usapeec.org/newsroom/media/pressrelease/chineseappetiteforchickenpaws/
  retrieved_on: '2026-07-28'
  source_type: trade_body
  notes: >-
    Chicken paws and wing tips together form roughly a $648 million annual
    US export market, sold into China for soups, stews, and snacking.
    Rendering the same volume domestically would return less than a tenth
    of that. Paws fetch $0.80-$1.00/lb exported against $0.05-$0.10/lb as
    domestic animal feed - close to a tenfold difference.

- slug: derived-dressing-yield
  title: National dressing yield derived from NASS totals
  publisher: counting-chicken-wings
  retrieved_on: '2026-07-28'
  source_type: derived
  derived_from:
    - nass-poultry-slaughter-2025
  notes: >-
    Ready-to-cook pounds divided by live weight pounds, both reported by
    NASS for the same population and period. 48,006,482 / 63,443,212 =
    0.75667 for 2025. Not an estimate - it falls directly out of two
    measured totals.

- slug: project-estimate-mixing
  title: Mixing pool sizes reasoned from process equipment scale
  publisher: counting-chicken-wings
  retrieved_on: '2026-07-28'
  source_type: estimate
  notes: >-
    Pool sizes for the mixing cascade are OUR ESTIMATES, reasoned from line
    speeds, chiller residence times, and standard container sizes. They are
    not measured. Flagged confidence=estimate throughout and shown as such
    in the UI. The qualitative conclusion is robust to these values: the
    distinct-individual curve flattens above roughly 1,000 individuals, so
    any plausible commodity-scale pool lands within a hair of the ceiling.

