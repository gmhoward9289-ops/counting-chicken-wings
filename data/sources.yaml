    basis conflict recorded on cbs-st21-11-output-2025.

- slug: usda-psd-israel-broiler-2000
  title: >-
    Production, Supply and Distribution database, Israel broiler meat
    production, market years 1964-2000
  publisher: USDA Foreign Agricultural Service
  url: https://apps.fas.usda.gov/psdonline/downloads/psd_livestock_csv.zip
  retrieved_on: '2026-07-29'
  source_type: government
  notes: >-
    Held ONLY as evidence in the CBS weight-basis question. No figure from it
    is loaded, and it is not an Israeli source.

    The question it addresses: CBS reports Israeli broiler tonnage but never
    states whether the figure is live weight or carcass weight, so the tonnage
    cannot be used for anything that depends on the basis. USDA PSD reports
    broiler meat on a ready-to-cook basis by its own convention, which makes it
    a yardstick.

    The one overlapping year is 2000. CBS reports 270,000 tonnes; PSD reports
    195,000 tonnes. The ratio is 72.2%, which is dressing-yield shaped - this
    project's own US figure derives to 75.67% from two NASS totals. If CBS were
    already reporting carcass weight the ratio would sit near 100%.

    That is evidence for CBS being LIVE weight, not proof, and three things
    keep it from being proof. It is a single overlapping year. That year is
    2000, twenty-six years before the figures actually in use. And PSD's unit
    string for broiler meat is a bare "(1000 MT)" where its beef series says
    "(1000 MT CWE)" explicitly, so the ready-to-cook basis is convention rather
    than a label on the row.

    Two further checks, both consistent with live weight and neither decisive.
    CBS's own output and marketing series agree at 95-100% for the same year,
    so both share one basis and the gap between them is stock change rather
    than dressing. And 571,497 tonnes marketed against 275,427,900 chicks
    placed gives 2.075 kg per bird placed, or about 2.18 kg per bird marketed
    at 5% farm mortality - plausible as a live weight for Israel's smaller
    birds, and requiring roughly 2.9 kg live if read as carcass weight.

    Recorded as a conflict rather than resolved, per the rule in
    docs/research/README.md that a source disagreement is reported and not
    adjudicated, and because promoting this to a stated basis is a human
    judgement about provenance.

- slug: uvm-jones-rule-86
  title: The "Jones Rule of 86" Revisited
  publisher: University of Vermont Extension, Proctor Maple Research Center
  url: https://www.uvm.edu/extension/agriculture/maple/bizmodules/sites/default/files/imce/uploads/1013jonesruleof86.pdf
  published_on: '2013-10-01'
  retrieved_on: '2026-07-30'
  source_type: trade_body
  notes: >-
    The strongest maple source in the corpus and the only one that gives a
    RULE rather than a constant: divide 86 by the sap sugar concentration in
    degrees Brix to get gallons of sap per gallon of syrup. Devised by C.H.
    Jones at UVM in 1946.

    Preferred over the folk "40 gallons" wherever both would serve, because
    40:1 is only true near 2 Brix and this document says so in the same
    breath: an average 2 Brix sap "would require 43 gallons of sap to produce
    1 gallon of syrup, or a sap:syrup ratio of close to 40:1".

    Worth recording that COOPER read this document and quoted the weaker
    source anyway in batch-07-maple. The passage was retrieved and in front of
    the model - a single chunk, returned by best_chunks - so the preference
    for the round number was the model's, not a retrieval failure. See
    docs/research/accepted/batch-07-maple-REVIEW.md.

    Also note the document's own caveat: the rule degrades at the high sugar
    concentrations reverse osmosis now produces, so it is a field rule, not a
    physical law.

- slug: umaine-7036e-maple
  title: 'Bulletin #7036: How to Tap Maple Trees and Make Maple Syrup'
  publisher: University of Maine Cooperative Extension
  url: https://extension.umaine.edu/publications/7036e/
  published_on: '2019-01-01'
  retrieved_on: '2026-07-30'
  source_type: trade_body
  notes: >-
    Source for taps-per-tree by trunk diameter and for the conservative end of
    the per-tap seasonal yield. Its tapping guidance is stricter than older
    literature - one tap below 18 inches, a second only at 18 to 25 inches, a
    third only on very healthy trees over 25 inches - which is the direction
    the whole industry has moved for tree health.

    Its season is given as calendar windows rather than a duration
    ("mid-February to early April in Southern Maine"), which is why
    season_length came back from COOPER with a quote and no number. That was
    the correct behaviour: subtracting two dates would have been our
    arithmetic, not the source's.

- slug: nysmaple-sap-per-tree
  title: How Much Sap Can One Tree Produce?
  publisher: New York State Maple Producers Association
  url: https://nysmaple.com/how-much-sap-can-one-tree-produce/
  retrieved_on: '2026-07-30'
  source_type: trade_body
  notes: >-
    A producers' association page, and the most quotable of the three - which
    is exactly why it needs watching. It supplies the modal "most trees today
    have only one tap", which is load-bearing here: it is what lets a per-TAP
    yield stand in for a per-TREE yield without inventing a multiplier.

    It also states the bare "approximately 40 gallons of sap" that COOPER
    preferred over UVM's rule. Kept as a source because the one-tap figure is
    genuinely useful, cited for the ratio nowhere.

- slug: plos-hu-2012-grind-batch
  title: Estimating Animal Abundance in Ground Beef Batches Assayed with Molecular Markers
  publisher: Hu X-S, Simila J, Platz SS, Moore SS, Plastow G, Meghen CN; PLoS ONE 7(3):e34191
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3316629/
  published_on: '2012-03-30'
  retrieved_on: '2026-07-31'
  source_type: peer_reviewed
  notes: >-
    The most important source in the ground beef subject and the only measured
    mixing pool anywhere in this corpus. DNA markers profiled in six commercial
    grind batches, animal abundance estimated by mark-recapture: "An average of
    411 to1367 animals was present in the six grind batches." (The missing space
    is the document's own.)

    Promoted to `study` by hand. COOPER graded it `industry` because it cannot
    grade higher, and the promotion rests on a narrow point that the honey batch
    taught: 411-1,367 is this paper's own primary result, not uncited
    scene-setting borrowed from someone else. The same paper's "a single ground
    beef batch may consist of many hundreds of animals" IS scene-setting, and is
    deliberately not used as a figure anywhere.

    Four things it is not, all easy to get wrong: not a per-patty count (a batch
    is many bins); not a per-bin count; not a national figure (six batches, one
    manufacturer, one line, one shift); and not a mean worth quoting on its own -
    the paper's own point is the variance between batches.

- slug: nrc-2002-ground-beef-risk
  title: >-
    Escherichia coli O157:H7 in Ground Beef - Review of a Draft Risk Assessment
  publisher: National Research Council / Institute of Medicine, National Academies Press
  url: https://www.ncbi.nlm.nih.gov/books/NBK221105/
  published_on: '2002-01-01'
  retrieved_on: '2026-07-31'
  source_type: peer_reviewed
  notes: >-
    The structure of a ground beef lot, on a host the pipeline can actually
    reach. "Trim is removed from each carcass and combined into 2,000-pound
    combo bins during the slaughter process." "Grinder loads are presumed to
    vary in size from the equivalent of 2 to 15 combo bins of trim." And, in the
    Slaughter Module chapter (NBK221092): "Lot is defined in the draft as the
    number of cattle necessary to fill one combo bin with trim; and a single lot
    may take one or more truckloads of cattle."

    HOW IT WAS FOUND, because the method generalises. The figures wanted here
    live in an FSIS draft risk assessment, and fsis.usda.gov returns HTTP 403 to
    this project's fetcher site-wide - verified against three paths on two
    separate days. This volume is the National Academies REVIEWING that draft,
    and it quotes the definitions at length. When an agency document is
    unfetchable, look for the body that reviewed it: oversight literature quotes
    what it reviews, and oversight publishers host differently.

    Note "presumed" in the grinder-load sentence. It is a modelling assumption
    inside a risk assessment, not an observation, which is why the combo-bin
    pool derived from it is graded `estimate`.

- slug: sdsu-ext-fed-steer-yield
  title: How Much Meat Can You Expect from a Fed Steer?
  publisher: South Dakota State University Extension
  url: https://extension.sdstate.edu/how-much-meat-can-you-expect-fed-steer
  published_on: '2022-07-13'
  retrieved_on: '2026-07-31'
  source_type: trade_body
  notes: >-
    The ground-beef-specific yield, which is the figure the subject actually
    needs: "This 150 -185 pounds of lean trim would likely be packaged as ground
    beef." The space before the dash is the page's own typography and is
    preserved everywhere it is quoted - tidying it is what made a true quote fail
    the gate on the Wikipedia row in this same batch.

    Also carries the whole-chain arithmetic that reconciles: a 1,200 lb steer at
    63 percent dressing gives a 750 lb carcass, "about 65% of the carcass weight,
    or roughly 490 pounds, as boneless, trimmed beef", which is "approximately
    40% of the live weight". That internal consistency is why the 65 percent
    figure anchors the low end of the carcass-to-packaged band while MSU's 75
    percent anchors the high end.

    Lean trim is roughly a third of total packaged beef. The two must never be
    merged; only the trim figure becomes patties.

- slug: msstate-ext-beef-yield
  title: How Much Meat to Expect from a Beef Animal (farm-direct beef)
  publisher: Mississippi State University Extension Service
  url: https://extension.msstate.edu/publications/how-much-meat-expect-beef-animal-farm-direct-beef
  retrieved_on: '2026-07-31'
  source_type: trade_body
  notes: >-
    "The average dressing percentage of beef cattle is 60 to 64 percent." Cited
    for dressing, and for the upper bound of the carcass-to-packaged band.

    Carries a conflict this project records rather than resolves. Its take-home
    sentence gives two figures that do not reconcile with each other: "the
    take-home weight of packaged beef will be approximately 40 percent of the
    animal's live weight, or 75 percent of the hot carcass weight." At its own 63
    percent dressing percent, 75 percent of the carcass is 47 percent of live
    weight, not 40. SDSU's 65 percent does reconcile. Both bounds are kept and
    neither is averaged away.

