- slug: wing-injuries-loading
  title: >-
    Rearing and handling injuries in broiler chickens and risk factors for
    wing injuries during loading
  publisher: Canadian Journal of Animal Science
  url: https://cdnsciencepub.com/doi/10.1139/cjas-2019-0204
  retrieved_on: '2026-07-28'
  source_type: peer_reviewed
  notes: >-
    Median wing injuries per load 5.7%, against under 1% per load for legs,
    breast, and shoulders. Wings are by a wide margin the most damaged part
    of the bird. Load-to-load variance is high, so this is stored with a
    wide lo/hi band.

- slug: welfare-training-carcass-quality
  title: >-
