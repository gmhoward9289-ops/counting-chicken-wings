- slug: psu-extension-saffron
  title: 'Saffron: A Tale of Red Gold and How to Produce Your Own'
  publisher: Penn State Extension
  url: https://extension.psu.edu/saffron-a-tale-of-red-gold-and-how-to-produce-your-own
  retrieved_on: '2026-07-29'
  source_type: trade_body
  notes: >-
    Held for its per-acre yield figure, which CONFLICTS with HS661 and is
    stored as a conflict rather than reconciled: Penn State says "one acre of
    land produces only about 3 pounds", HS661 says "an annual yield of 8-10
    pounds of dried saffron per acre is obtained in an established planting".

    Both are plausible and they are probably not measuring the same thing -
    HS661 explicitly says "in an established planting", and a saffron field
    takes years to reach that state. Neither figure is loaded as data. The
    disagreement is recorded because a three-fold spread between two
    extension services is the most honest thing we know about saffron yields.

    Also states "It takes about 50 flowers to produce just one teaspoon of
    dried saffron", which is consistent with 150 flowers per gram only if a
    teaspoon of threads is about a third of a gram. Not loaded: converting it
    would require assuming the mass of a teaspoon of saffron, and that
    assumption would be ours rather than the source's.

