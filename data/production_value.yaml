# Broiler production, live weight, and value by state.
#
# GENERATED by tools/parse_production_value.py - do not hand-edit.
#
# Source: USDA NASS "Poultry - Production and Value" annual summary,
# a different publication from Poultry Slaughter. It counts broilers
# PRODUCED over Dec 1 - Nov 30; the slaughter report counts young
# chickens SLAUGHTERED over the calendar year and also includes
# roasters and capons. The national totals therefore differ - 9.40bn
# produced against 9.58bn slaughtered in 2025 - and must not be summed
# or treated as the same series.
#
# derived_live_weight_lb is production pounds divided by head. It
# reproduces the slaughter report's state average live weight exactly,
# which is the cross-check that makes this file worth carrying.
#
# The report excludes any state producing under 500,000 broilers, and
# suppresses others to avoid disclosing individual operations. Which
# states get suppressed CHANGES BY YEAR, so keeping every year widens
# coverage. The suppressed states are not lost: the report publishes
# them as named aggregates, carried in `aggregates:` below, and the
# parser refuses to emit unless states + aggregates reproduce the
# published United States total exactly.

