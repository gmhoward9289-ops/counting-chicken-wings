# Eggs per layer and total production by state, from the NASS
# Chickens and Eggs 2025 Summary. Generated by tools/parse_eggs.py.
#
# The spread -- Alabama 224 to Montana 327 -- is mostly a readout of
# table-egg versus hatching-egg mix, not of husbandry quality. Broiler-
# breeder hens lay far fewer eggs than table-egg strains, so the low
# states are the broiler states.
#
# (NA) in the source becomes an omitted year rather than a zero: Maryland,
# South Dakota and Virginia are suppressed for 2025 but present for 2024,
# so the union across years covers all 34.

