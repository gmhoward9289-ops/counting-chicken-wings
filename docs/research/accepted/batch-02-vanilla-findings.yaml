# flowers_per_bean dropped by human review (2026-08-15): the quote --
# "A flower gives a vanilla bean after hand pollination" -- supports the
# anatomical constant (1) grammatically (singular "a flower"/"a bean") but
# never states the numeral 1, so it cannot clear the mechanical bound-in-quote
# gate at `industry` grade. `derived`/`measured` are human-only grades this
# pipeline's own `verify` step rejects outright (see docs/research/README.md),
# so recording this properly means a human entering it directly into data/ as
# `derived`, citing this same quote -- not something the candidate/accept flow
# can carry through. Left for a follow-up pass rather than forced through.
#
# curing_duration_days dropped by human review (2026-08-15): the extracted
# quote -- "curing should be done within a week of harvesting the beans" --
# answers a different question than asked. That is time from harvest to when
# curing must BEGIN, not how long the curing process itself takes. The spec
# expects curing to run months-long (the poultry contrast is 47 days), so a
# 7-day figure attributed to "curing duration" is a misextraction, not a
# borderline bound.
#
