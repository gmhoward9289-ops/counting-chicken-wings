  agreement: rejected
  verified_by: null
  notes: >-
    The beefresearch.ca "6:1 feed to gain ratio" sentence the round-1 review
    flagged as present-but-unextracted turns out to be a hypothetical
    teaching example, not a measured statistic: "Imagine two steer calves
    placed on feed... Steer A consumes an average of 21 lbs (9.53 kg) DM per
    day, which equates to a 6:1 feed to gain ratio." The two models were
    right to decline it -- using it would have been a real quote answering
    the wrong question (an illustration, not a survey result). The Gotoh
    review does carry a genuine wagyu-specific total-feed figure -- "Total
    feed consumption during fattening is normally 4,000 to 5,000 kg/head" --
    but that is total feed per animal for the whole fattening period, not a
    per-kg-of-beef efficiency ratio, and turning it into one would mean
    dividing by the carcass-weight finding above, which is a derive step for
    a human to decide on, not something to fold in here silently. Recorded
    as a candidate for a human to combine, not as an accepted figure.
