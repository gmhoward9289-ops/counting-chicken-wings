- field: saleable_meat_pct
  subject_qualifier: american_beef_generic
  value_lo: null
  value_mode: 65
  value_hi: null
  unit: '% of carcass weight yielded as boneless, trimmed beef'
  confidence: industry
  document: inbox/wagyu/https-extension-sdstate-edu-how-much-meat-can-yo-7bbd1da6.txt
  quote: 'So, in other words, you start with a 1200 pound steer, which has a
    dressing percent of 63%, so that you have a 750 pound carcass. From that
    you will get about 65% of the carcass weight, or roughly 490 pounds, as
    boneless, trimmed beef. If you look at that as a percentage of the live
    weight of the steer you started with, it is approximately 40% of the
    live weight.'
  agreement: human-read, no second pass
  verified_by: null
  notes: >-
    Two bases in one quote, both worth keeping: 65% of carcass weight, and
    40% of live weight. Neither is wagyu-specific -- this is the same
    "generic fed steer" worked example already used in ground-beef's
    packaged_beef_fraction_of_live_weight finding, reused here as the
    saleable-meat comparison basis. Do not average this against the USDA
    Yield Grade %CTBRC figures below -- they measure a narrower cut set
    (round/loin/rib/chuck only, excludes ground beef and other trim) and are
    not the same denominator.
- field: saleable_meat_pct
  subject_qualifier: usda_yield_grade_ctbrc
  value_lo: 45.4
  value_mode: null
  value_hi: 52.3
  unit: '% of carcass weight as closely trimmed boneless retail cuts from round/loin/rib/chuck
    only (USDA Yield Grades 5 through 1)'
  confidence: industry
  document: inbox/wagyu/https-www-beefresearch-org-resources-product-qua-3cda73ba.txt
  quote: 'Table 1. Expected Yields of Closely Trimmed, Boneless Retail Cuts (%
    CTBRC) and Total Retail Cuts (% Total Yield) for Each USDA Yield Grade
    ... 1 >52.3 ≥80 ... 5 <45.4 <65'
  agreement: human-read, no second pass
  verified_by: null
  notes: >-
    NCBA/beefresearch.org checkoff-funded fact sheet by Daryl Tatum PhD
    (Colorado State), citing the 1996 USDA grading standard directly. Two
    columns in the same table: %CTBRC (round/loin/rib/chuck only, <45.4 to
    >52.3 across Yield Grades 5-1) and %Total Yield (all retail cuts
    including ground beef, <65 to >=80). Neither basis matches SDSU's 65%
    figure above exactly, because SDSU's worked example is one hypothetical
    carcass rather than the industry-wide Yield Grade range -- consistent
    with each other in direction and rough magnitude, not identical, and
    that is expected given the different bases.
- field: bms_scale_definition
  value_lo: 1
  value_mode: null
  value_hi: 12
  unit: BMS points (Beef Marbling Standard, Japan Meat Grading Association)
  confidence: industry
  target_table: quality_defect
  document: inbox/wagyu/https-www-animbiosci-org-journal-view-php-doi-10-7c1b73c6.txt
  quote: 'Graders determine the BMS score (from 1 to 12) by comparing the actual
    carcass marbling with the marbling standard photograph... assigns both a
    yield grade (A, B, or C) and a meat quality grade (1 to 5)'
  agreement: human-read, no second pass
  verified_by: null
  notes: >-
    Resolves the spec's own "A5 is not a yield grade" watch item directly:
    JMGA pairs a yield LETTER (A/B/C) with a quality NUMBER (1-5), and BMS
    1-12 sits inside the quality score as one of four inputs (marbling; meat
    color/brightness; meat firmness/texture; fat color/luster/quality -- the
    quality grade takes the LOWEST of the four). A desirable grade fits the
    quality_defect table's shape exactly as the spec hoped: an axis that
    changes price and desirability without changing any count.
- field: bms_scale_mapping
  value_lo: null
  value_mode: null
  value_hi: null
  unit: BMS-to-quality-grade mapping
  confidence: industry
  target_table: quality_defect
  document: inbox/wagyu/https-www-lonemountaincattle-com-breeding-guide-979bb5cd.txt
  quote: 'there are grades of beef yield going from A to C and the BMS scores
    are noted by a designation of 1 to 5 (BMS scores of 8 to 12 are given a
    5; BMS 5 through 7 are given a 4; etc). Note that the BMS grade is based
    on a number of different factors... The most highly prized carcasses are
    deemed an A-5 and the lowest grade is C-1.'
  agreement: human-read, no second pass
  verified_by: null
  notes: >-
    Commercial source (American Wagyu breeder), not JMGA itself or a
    peer-reviewed paper -- graded industry, not higher, and its BMS->quality
    mapping should be checked against Table 1 in the Gotoh review (same
    numbers, independent restatement) before being treated as the
    authoritative bucketing. Also states "a BMS 3 grade requires a minimum
    of 21% IMF" as an anchor point, and separately that Japanese carcasses
    are ribbed between the 6th/7th rib versus the US 12th/13th rib -- a
    basis difference worth carrying into any US/Japan comparison note.
