- url: https://worldpopulationreview.com/country-rankings/chicken-consumption-by-country
  title: Chicken Consumption by Country 2026
  publisher: World Population Review
  kind: aggregator
  verified_on: '2026-07-29'
  http_status: 200
  bytes: 769417
  subjects: [per_capita, international]
  covers: []
  does_not_cover:
    - citable_per_capita_figure      # aggregator, and it disagrees with others
  confidence_ceiling: industry
  notes: >-
    Reachable, and NOT loaded. It puts Israel at 70.83 kg per person for 2022
    citing FAOSTAT food balances, against OECD-FAO's 58.2 kg and a 64.9 kg
