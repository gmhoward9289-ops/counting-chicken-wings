- url: https://worldpopulationreview.com/country-rankings/chicken-consumption-by-country
  title: Chicken Consumption by Country 2026
  publisher: World Population Review
  kind: aggregator
  verified_on: '2026-07-29'
  http_status: 200
  bytes: 769417
  subjects: [per_capita, international]
  covers: []
