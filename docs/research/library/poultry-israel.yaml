# ------------------------------------------------- second pass, 2026-07-29
#
# CBS answers scale and nothing else, so this pass went after everything else
# Israel needs: the head count, the reason 2023 dipped, and the cultural
# material a demo actually lands with. Non-government by necessity - graded
# accordingly, and every URL below was checked with curl on the date shown.

- url: https://www.timesofisrael.com/poultry-producers-warn-first-ever-imports-of-chickens-will-destroy-local-farms/
  title: >-
    Poultry producers warn first-ever imports of chickens will destroy local
    farms
  publisher: The Times of Israel
  kind: trade_press
  verified_on: '2026-07-29'
  http_status: 200
  bytes: 385488
  subjects: [poultry, israel, industry_structure]
  covers:
    - head_slaughtered_per_year      # ~260 million broilers, THE missing one
    - farm_count                     # ~600 large farms
    - slaughterhouse_count           # 20 kosher plants
    - farmgate_and_retail_price      # NIS 6.5/kg vs ~NIS 20/kg
    - industry_turnover              # NIS 10 billion
    - grow_out_days                  # 40 days
    - frozen_share                   # ~30%
  does_not_cover:
    - per_capita_consumption         # quotes it, but sourced to a dead 404
    - average_bird_weight            # implied only, via CBS tonnage
  confidence_ceiling: industry
  notes: >-
    By Sue Surkes, 2025-09-07. Figures attributed to a NAMED official - Moti
    Elkabetz, secretary of the Poultry Breeders Association - which is what
    separates this from an anonymous industry claim and the only reason it is
    usable.

    This is the source that unlocks the count question for Israel. CBS
    publishes no bird count; 600,072 tonnes divided by 260 million gives about
    2.3 kg a bird, which is what a 40-day broiler weighs. Two sources not
    derived from each other, agreeing.

    The 58.2 kg per-capita figure it quotes traces to Euromeatnews, which
    404s. A live article citing a dead one does not revive the citation.

- url: https://www.poultryworld.net/the-industrymarkets/market-trends-analysis-the-industrymarkets-2/israel-poultry-industry-hit-by-war-and-labour-shortage/
  title: Israel poultry industry hit by war and labour shortage
  publisher: Poultry World (Misset)
  kind: trade_press
  verified_on: '2026-07-29'
  http_status: 200
  bytes: 389901
  subjects: [poultry, israel, disease, labour]
  covers:
    - newcastle_disease_losses_2023  # 16 million head, Q4 2023
    - wartime_plant_closures
  does_not_cover:
    - head_slaughtered_per_year
    - plant_market_shares            # present but THIRD-HAND, see notes
  confidence_ceiling: industry
  notes: >-
    By Vladislav Vorotnikov, 2024-03-04. Explains a hole already visible in the
    CBS series: output of 553,068 tonnes for 2023 sits below 2020, and 16
    million head were lost to Newcastle disease in Q4 2023 on top of wartime
    closures and a labour shortage.

    REACHABILITY TRAP: returns 403 to some automated fetchers and 200 to an
    ordinary browser user-agent. It is alive. Do not retire it on one 403 --
    curl with a normal UA and it serves fine.

    Of HaGalil at ~15% of national slaughter and Of Oz at ~5% are Poultry World
    citing TheMarker citing unnamed industry sources. Not loaded. Both plants
    sit in districts our own data covers, so the claim is checkable against a
    Hebrew original if someone finds it.

