- url: https://www.cbs.gov.il/he/publications/DocLib/2025/agriculture_q202502/t07.xlsx#slaughter-block
  title: "CBS slaughterhouse head-count block (within quarterly Table 7)"
  publisher: Israel Central Bureau of Statistics
  kind: government
  verified_on: '2026-07-29'
  http_status: 200
  subjects: [israel, slaughter]
  covers:
    - cattle_head_slaughtered
    - sheep_and_goat_head_slaughtered
    - pig_head_slaughtered
  does_not_cover:
    - poultry_head_slaughtered      # the point of this entry
  notes: >-
    Recorded so nobody spends the hour again. Table 7 does contain a
    "Slaughtering in slaughterhouses" block reported in HEADS -- but it covers
    only cattle, sheep and goats, and pigs. The 2024 grand total of 529,550
    head is exactly cattle 164,559 + sheep and goats 229,195 + pigs 135,796,
    which confirms poultry is excluded rather than merely unlabelled.

    So CBS appears not to publish poultry head slaughtered anywhere: not in
    Statistical Abstract chapter 21, and not in the quarterly series. Chicks
    placed (above) is the closest real count. If a true slaughter figure is
    needed, the untried source is the Israeli Poultry Board / מועצת הלול, which
    ISRAEL-PLAN.md lists third and expects to be Hebrew-only.

