- url: https://apis.cbs.gov.il/series/data/list
  title: CBS time-series API
  publisher: Israel Central Bureau of Statistics
  kind: government
  verified_on: '2026-07-29'
  http_status: 200
  subjects: [israel, macroeconomic]
  covers:
    - foreign_trade
    - industry_output
    - prices
    - population
  does_not_cover:
    - agriculture               # sampled 400 series; no agriculture level1
    - poultry
  confidence_ceiling: measured
  notes: >-
    Works, and is genuinely useful for anything macroeconomic --
    ?id=<N>&format=json returns a series with its full catalog path, and a
    comma list of ids works. But it does not carry agriculture, so it cannot
    answer this project's Israeli questions. Its catalog endpoints
    (/series/catalog/{tree,maintopic,level}) return HTML rather than JSON, so
    series ids are not discoverable from the API itself.

