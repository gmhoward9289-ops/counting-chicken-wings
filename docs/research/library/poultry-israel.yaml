    - citable_per_capita_figure      # aggregator, and it disagrees with others
  confidence_ceiling: industry
  notes: >-
    Reachable, and NOT loaded. It puts Israel at 70.83 kg per person for 2022
    citing FAOSTAT food balances, against OECD-FAO's 58.2 kg and a 64.9 kg
