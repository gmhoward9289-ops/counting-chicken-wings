# Source library — Israeli poultry.
#
# Produced by the manual pass of 2026-07-29, which is steps 1-3 of the workflow
# in ../SOURCE-LIBRARY.md: search, verify every URL with curl, then probe what
# each document can actually answer. Recorded so the pass is not thrown away.
#
# Every url below was fetched and its status recorded. Nothing unverified is
# listed, because COOPER fetches exactly what it is given and never searches --
# a plausible-looking dead URL returns empty for a reason nobody can see.
#
# Route worth knowing before adding to this file, none of it guessable:
#
#   * CBS's TIME SERIES api is the wrong database. 400 series sampled across
#     the id space returned level1 subjects of foreign trade, industry, prices,
#     business surveys and population -- no agriculture at all. Agriculture
#     exists only in the Statistical Abstract.
#   * The abstract's own pages are a SharePoint shell, but SharePoint REST
#     answers anonymously: /en/_api/web/title returns JSON, and
#     /he/publications/_api/web/lists enumerates the libraries.
#   * The files are on the HEBREW web, in a 472,859-item library at
#     /he/publications/DocLib. The English path returns a 200 soft-404 of
#     exactly 2,056 bytes, so a wrong guess looks like a working URL.
#   * Agriculture is chapter 21, not 19.
#   * The .xlsx are 27-52 KB and parse with zipfile + ElementTree; an xlsx is a
#     zip of XML, so openpyxl is not required.

- url: https://www.cbs.gov.il/he/publications/DocLib/2025/21.ShnatonAgriculture/st21_11.xlsx
  title: >-
    Table 21.11, Agricultural output by industry and product — Statistical
    Abstract of Israel 2025, chapter 21
  publisher: Israel Central Bureau of Statistics
  kind: government
  verified_on: '2026-07-29'
  http_status: 200
  content_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  bytes: 52557
  rows_non_empty: 146
  subjects: [poultry, israel]
  covers:
    - broiler_meat_output_tonnes
    - broiler_output_value_ils
    - turkey_meat_output_tonnes
    - table_egg_output
  does_not_cover:
    - head_slaughtered_per_year   # reports tonnage only, never head
    - average_live_weight         # no per-bird weight anywhere in the table
    - per_capita_consumption
  confidence_ceiling: measured    # government-measured; a human must promote it
  notes: >-
    Bilingual Hebrew/English, value in NIS million and quantity in 1,000
    tonnes, for years 2024*, 2023, 2020, 2010, 2000. CBS's own asterisk marks
    2024 provisional.

    Broilers, quantity in 1,000 tonnes: 600.072 (2024*), 553.068 (2023),
    578.164 (2020), 450 (2010), 270 (2000). Value in NIS million: 5,367.6 /
    5,303.8 / 3,796.2 / 2,644.7 / 1,265.5. Poultry total 688.594 and turkeys
    88.522 for 2024*.

    Footnote 5 defines broilers as "Chickens intended for fattening for the
    meat industry", which matches our broiler species rather than needing a
    mapping decision.

- url: https://www.cbs.gov.il/he/publications/DocLib/2025/21.ShnatonAgriculture/st21_08.xlsx
  title: >-
    Table 21.8, Livestock — Statistical Abstract of Israel 2025, chapter 21
  publisher: Israel Central Bureau of Statistics
  kind: government
  verified_on: '2026-07-29'
  http_status: 200
  content_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  bytes: 26768
  rows_non_empty: 21
  subjects: [poultry, israel]
  covers:
    - broiler_inventory_head
    - laying_hen_inventory_head
    - turkey_inventory_head
  does_not_cover:
    - head_slaughtered_per_year   # THE trap on this table -- see notes
    - broiler_meat_output_tonnes
  confidence_ceiling: measured
  notes: >-
    Thousands, END OF YEAR. Ten year columns back to 1960, so it is the best
    long series available for Israeli poultry.

    Broilers, thousand head: 37,895 (2024*), 34,121 (2023), 38,239 (2020),
    33,594 (2010), 20,462 (2000). Laying hens 10,930 (2024*).

    Do not read 37.9 million as annual slaughter. It is a standing flock at a
    point in time, and broilers turn over several times a year -- the same
    inventory-versus-throughput distinction already carried as a caveat on the
    US census sales figures. It is also why the trade-press lead of "~260
    million broilers/year" in docs/ISRAEL-PLAN.md is neither confirmed nor
    refuted by this table.

- url: https://www.cbs.gov.il/he/publications/DocLib/2025/21.ShnatonAgriculture/st21_04.xlsx
  title: >-
    Table 21.4, Marketing of animals and animal products by district and
    regional council — Statistical Abstract of Israel 2025, chapter 21
  publisher: Israel Central Bureau of Statistics
  kind: government
  verified_on: '2026-07-29'
  http_status: 200
  content_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  bytes: 31390
  rows_non_empty: 74
  subjects: [poultry, israel, subnational]
  covers:
    - broiler_marketing_tonnes_by_district
    - table_egg_marketing_by_district
    - turkey_marketing_by_district
  does_not_cover:
    - head_slaughtered_per_year
    - multi_year_trend            # single year, 2024 only
  confidence_ceiling: measured
  notes: >-
    Answers the open question at the foot of ISRAEL-PLAN.md: Israel DOES have
    subnational poultry data, so a choropleth has a real counterpart and the
    comparison need not be visibly lopsided. Districts and regional councils,
    broilers in tonnes, 2024 -- Golan 24,602, HaGalil HaElyon 27,796, Matte
    Asher 23,248, Emeq HaMa'ayanot 17,237, Emeq Yizre'el 17,072.

    Uses suppression markers "-" and ". ." exactly as NASS does, so the
    existing "presence, not volume" rendering applies unchanged rather than
    needing new handling.

    CROSS-CHECK THAT FAILS, and it must travel with either figure: district
    marketing sums to 571,499.95 tonnes for 2024 against 600,072 tonnes of
    output in st21_11 -- a gap of 4.76%. Output and marketing are different
    measurements so the gap is probably real, but a reader who adds up the
    districts will find it, and finding it unannounced reads as an error.

# ---------------------------------------------------------------- dead ends
