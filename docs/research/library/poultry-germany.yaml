# Source library — German poultry.
#
# Produced 2026-08-16, following the workflow in ../SOURCE-LIBRARY.md: search,
# verify every URL, then probe what each document can actually answer.
# Germany is the fifth country in this project and, per the research brief,
# the strongest shot yet at a `measured`-grade non-US, non-Canada country —
# Destatis runs a genuine mandatory survey of licensed poultry
# slaughterhouses, not an industry proxy or a secondhand GAIN-report quote.
#
# THE ROUTE THAT ACTUALLY WORKED:
#
#   * Destatis's own annual press releases ("Fleischproduktion im Jahr
#     20XX...") state head-slaughtered figures for Jungmasthühner (broiler)
#     SEPARATELY from Suppenhühner (spent/stewing hens) -- the same
#     species-isolation Canada's table 32-10-0118-01 provides, here built
#     into the headline release rather than requiring a second, finer table.
#   * The underlying data table ("gewerbliche Schlachtung nach Tierarten")
#     carries decimal-precision figures one year behind the press releases
#     (2022/2023 at the time of this pass) -- pdftotext -layout on the
#     rendered page extracted this cleanly, no font-encoding trap.
#   * GENESIS-Online itself (the StatCan-WDS equivalent) is a JavaScript
#     single-page app with no data in the initial HTML -- a WebFetch of any
#     genesis.destatis.de URL returns only the page shell. Unlike Canada's
#     www150.statcan.gc.ca (a TLS-handshake problem, fixed with one curl
#     flag), this is a genuine SPA-behind-API problem: the real data lives
#     behind POST calls this research pass did not attempt to replicate.
#     Flagged as a real gap, not investigated further this pass -- see the
#     dead-ends section.
#   * PDFs that WebFetch's own summarizer refuses as "corrupted/binary" are
#     frequently fine underneath -- the same finding Mexico's and Canada's
#     passes made. `pdftotext -layout` on the saved binary recovered clean
#     text from three PDFs this pass initially wrote off, including the
#     state-level 2014 Niedersachsen comparison table.

- url: https://www.destatis.de/DE/Presse/Pressemitteilungen/2025/02/PD25_050_413.html
  title: "Fleischproduktion im Jahr 2024 um 1,4 % gestiegen"
  publisher: Statistisches Bundesamt (Destatis)
  kind: government
  verified_on: '2026-08-16'
  http_status: 200
  published_on: '2025-02-07'
  subjects: [poultry, germany, broiler, 2024]
  covers:
    - jungmasthuhn_head_slaughtered_2024   # 626.7 million, broiler isolated from Suppenhühner
    - jungmasthuhnerfleisch_tonnes_2024    # "1,1 Millionen Tonnen", +1.8% vs 2023
    - suppenhuhn_head_2024                 # 27.1 million, kept separate, not loaded (not broiler)
  does_not_cover:
    - bundesland_breakdown
    - precise_decimal_tonnage              # rounded to one decimal of a million
  confidence_ceiling: measured
  notes: >-
    "Insgesamt wurden in den Betrieben im Jahr 2024 rund 653,8 Millionen
    Hühner, davon 626,7 Millionen Jungmast- und 27,1 Millionen Suppenhühner
    geschlachtet." Jungmasthuhn (broiler) is isolated from Suppenhuhn (spent/
    stewing hen) in the same sentence -- the species split this project
    needs, stated directly rather than requiring a second finer table the
    way Canada's national release did. Meat: "die um 1,8 % auf 1,1 Millionen
    Tonnen gestiegene Erzeugung von Jungmasthühnerfleisch" -- rounded to one
    decimal place of a million tonnes, load as printed (1,100,000) rather
    than back-solving a more precise figure from the percentage change,
    which would invent precision the source did not publish.

