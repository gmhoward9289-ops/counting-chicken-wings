- url: https://rosstat.gov.ru/storage/mediabank/PROD_2023.xlsx
  title: 'Производство продуктов животноводства в Российской Федерации (national workbook)'
  publisher: Rosstat (Федеральная служба государственной статистики)
  kind: government
  verified_on: '2026-08-16'
  http_status: 0
  subjects: [poultry, russia, dead_end, taxonomy_source]
  covers: []
  does_not_cover: [everything]
  notes: >-
    UNREACHABLE from this research environment. WebFetch: "unable to
    verify the first certificate". curl (twice, plain and forced TLS 1.2):
    "schannel: SEC_E_UNTRUSTED_ROOT ... certificate chain was issued by an
    authority that is not trusted". A raw Python urllib request hit the
    same underlying TLS trust failure. This is NOT the same failure shape
    as Canada's www150.statcan.gc.ca (a TLS 1.3 handshake reset, fixed by
    forcing TLS 1.2) or Mexico's SIAP (DNS failure / connection refused):
    Rosstat's certificate itself is not trusted by any certificate store
    available in this environment, which is consistent with Rosstat using
    a Russian government root CA that Western trust stores do not carry.

    A separate deep-research pass (via Perplexity, presumably routed
    through infrastructure that DOES trust Rosstat's certificate) read
    this workbook and reported its structure: a `tab78` worksheet with a
    single "птицы" (poultry, all species) row, in both live weight and
    slaughter weight, for 2020-2023, and NO chicken/broiler-only row
    anywhere in the file. That finding is recorded here and used to shape
    docs/RUSSIA-PLAN.md and the taxonomy-trap facts in data/facts.yaml, but
    this project does NOT cite the workbook's URL as a source in
    sources.yaml or attach it to any output_stat_year row, because this
    pass could not independently open and verify the file itself -- a
    secondhand report of a document's contents is not the same thing as
    having read the document, and this project's own discipline (stated
    plainly in docs/MEXICO-PLAN.md and repeated here) is that a URL nobody
    on this pass could actually open does not become a citation.
