  notes: >-
    2021 figures: "Mexico ranks as the 1st producer of poultry carcass meat
    worldwide" -- which flatly CONTRADICTS the GAIN report and UNA's own
    "sixth largest poultry producer globally" claim found elsewhere in this
    pass. Recorded as a second headline trap alongside per-capita, and
