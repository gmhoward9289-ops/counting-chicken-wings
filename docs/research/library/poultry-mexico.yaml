# Source library -- Mexican poultry.
#
# Produced 2026-08-16, mirroring the format and discipline of
# ../poultry-israel.yaml: every URL below was actually fetched and its
# outcome recorded, live or dead, because a dead source costs the next
# attempt the same hour it cost this one.
#
# THE ROUTE THAT ACTUALLY WORKED, stated up front because it is not the
# route the plan assumed going in:
#
#   * SIAP's own web portals -- infosiap.siap.gob.mx and
#     nube.agricultura.gob.mx -- are UNREACHABLE from this environment.
#     infosiap.siap.gob.mx does not resolve in DNS at all. nube.agricultura.
#     gob.mx resolves (52.203.155.94) but refuses the connection on 443 for
#     every path tried, http and https alike. This is the same shape of
#     failure Israel's Ministry of Agriculture hit (403 to every automated
#     fetcher) -- a portal that exists and that a human with a browser could
#     probably reach, but that a plain fetch cannot. NOT resolved by this
#     pass; flagged as the highest-value target left, exactly as the
#     Israeli Ministry of Agriculture was.
#   * web.archive.org is blocked outright by the fetch tool in this
#     environment ("Claude Code is unable to fetch from web.archive.org"),
#     so an archived snapshot of the SIAP portal was not a fallback either.
#   * SIAP's data DOES reach the corpus, just secondhand: a USDA Foreign
#     Agricultural Service GAIN report (government, English, PDF) quotes
#     SIAP directly and cites it under its own production chart, and a
#     peer-reviewed Mexican academic journal article separately quotes a
#     specific dated SIAP publication (9 de octubre de 2020) for a 2019
#     figure. Both are loaded; neither is SIAP's own page, and that
#     remove is recorded on both source entries in sources.yaml.
#   * PDF text extraction needed PyMuPDF (`fitz`) directly -- the WebFetch
#     tool's own text extraction returned "binary content, cannot read" for
#     both PDFs tried, but the same file downloaded and saved by WebFetch's
#     side-effect landed on disk, and `fitz.open(path).get_text()` on it
#     produced full clean text. Unlike Israel's OECD-FAO PDF, this is
#     ordinary embedded text, not a custom font encoding -- the blocker was
#     the fetch tool's own summarizer refusing binary, not the PDF itself.
#   * The taxonomy trap the task asked to resolve is real and is resolved
#     below, by a trade-press source that states it in one sentence: "carne
#     de ave" (poultry meat) includes chicken AND turkey; "carne de pollo"
#     (chicken meat) is chicken only. Every figure loaded into
#     data/output_mexico.yaml is a "carne de pollo" / "Meat, Chicken" figure,
#     never the broader "ave" aggregate -- checked against each source's own
#     wording before loading, not assumed.

- url: https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Poultry+and+Products+Annual_Mexico+City_Mexico_MX2024-0040.pdf
  title: 'Mexico: Poultry and Products Annual (GAIN Report MX2024-0040)'
  publisher: USDA Foreign Agricultural Service (FAS GAIN)
  kind: government
  verified_on: '2026-08-16'
  http_status: 200
  content_type: application/pdf
  bytes: 828130
  subjects: [poultry, mexico, broiler, trade]
  covers:
    - broiler_meat_output_tonnes    # "Meat, Chicken" PSD table, not aggregate poultry
    - imports_exports_tonnes
    - self_sufficiency_derivable    # production / total supply, both in the same table
    - per_capita_consumption_kg     # 37.75 kg 2024, but see the per-capita trap below
    - state_ranking_ordinal         # named, not percentaged
    - tif_inspection_count          # 121 federally-inspected plants, 85% of slaughter
  does_not_cover:
    - head_slaughtered              # no bird count anywhere in the report
    - average_live_weight
    - standing_flock_head           # only a relative ranking of flock SIZE, not a number,
                                     # and that ranking is for ALL POULTRY (it names Jalisco
                                     # first because Jalisco leads egg-layer population too)
    - state_level_tonnage           # ranking is ordinal ("Veracruz, then Aguascalientes,
                                     # then Jalisco...") with no percentages or absolute
                                     # figures per state
  confidence_ceiling: industry
  notes: >-
    Dated 2024-09-04, by Gustavo Lara / Susan Karimiha. WebFetch's own text
    extraction refused the PDF as binary; the same file was saved to disk by
    the tool as a side effect and `fitz` (PyMuPDF) extracted it cleanly --
    18,275 characters, ordinary embedded text, no font-encoding trap.

    Table 1 (Chicken Meat PSD): Production 3,888 thousand MT (2023, both
    "USDA Official" and "New Post" columns agree) and 3,985 thousand MT
    (2024, "New Post" -- matches the prose "3.99 MMT"). 2025 is a FORECAST
    (4,085 thousand MT / "4.09 MMT") and is not loaded. Total supply 2023:
    4,894 thousand MT. Imports 2023: 1,006 thousand MT; 2024 estimated
    960,000 MT. Exports 2024 estimated 4,000 MT.

    SELF-SUFFICIENCY, and it is arithmetic already sitting in this one
    table rather than an outside computation: 3,888 / 4,894 = 79.4% for
    2023. Two independent sources (bmeditores 79.6%, avicola.com.mx ~80%)
    land within a point of this, which is why self-sufficiency ships as a
    fact and the per-capita figure below does not.

    CAVEAT CARRIED TO CONFIDENCE GRADE: the table itself is annotated
    "Note: Not official USDA data" and directs a reader to PSD Online for
    the official figure. This is a Post estimate reconciling SIAP and
    trade data, not a direct quote of a SIAP publication -- one step
    further from the primary measurement than CBS's own tables were for
    Israel. Loaded at confidence=industry rather than measured for exactly
    that reason, even though the publisher (USDA FAS) is a government
    body and source_type is 'government'.

    STATE RANKING SPLITS IN TWO, and conflating the two would misstate
    which crop each ranks: "Puebla, Veracruz, Aguascalientes, and Querétaro
    follow Jalisco in flock size. These five states account for 50 percent
    of Mexico's poultry population" is FLOCK SIZE (all poultry, since
    Jalisco leads egg-laying hens too) -- NOT chicken meat production.
    Separately: "For chicken meat production, Veracruz is the leading
    state, followed by Aguascalientes, Jalisco, Querétaro, and, to a lesser
    extent, Durango, Chiapas, Guanajuato, and Puebla. These eight states
    represent 70 percent of Mexico's total chicken meat production" IS the
    broiler-specific ranking, and is the one carried into a fact. Ordinal
    only -- no percentages given, so no per-state tonnage is loaded.

    PER-CAPITA CONSUMPTION TRAP: "estimated per capita consumption was
    37.75 kg for chicken" in 2024. This is one of five mutually
    inconsistent Mexican per-capita chicken figures found in this pass
    (22.4 / 28.7 / 34.5 / 35.82 / 37.75 kg, spanning different sources and
    years) -- see the dead-end-style entry at the foot of this file. Not
    loaded, on the same reasoning Israel's population stayed NULL.

    TIF (Tipo Inspección Federal): 121 federally-inspected poultry plants;
    industry estimates 85% of 2024 slaughter runs through them, up from
    83% in 2023 -- the closest thing found to an FSIS-equivalent structural
    fact, loaded as a fact rather than a rate because no rejection or
    condemnation RATE is given, the same gap Israel's kosher inspection hit.

- url: https://www.redalyc.org/journal/674/67472343005/67472343005.pdf
  title: >-
    Distribución regional de carne de pollo en México: Una aplicación de las
    condiciones Karush-Kuhn-Tucker
  publisher: >-
    Investigación y Ciencia, Universidad Autónoma de Aguascalientes
    (Rebollar-Rebollar, S., 2021)
  kind: peer_reviewed
  verified_on: '2026-08-16'
  http_status: 200
  content_type: application/pdf
  bytes: 813742
  subjects: [poultry, mexico, broiler, subnational, peer_reviewed]
  covers:
    - broiler_meat_output_tonnes_2019
    - state_shares_2019             # percentages, unlike the GAIN report's ordinal-only
    - per_capita_consumption_2019   # another entry in the per-capita trap, not loaded
    - import_volume_2019
    - import_entry_points_2019      # not loaded -- out of scope, recorded for completeness
  does_not_cover:
    - head_slaughtered
    - subnational_full_table        # names only the top 4 states; the other ~28 are not
                                     # given even in aggregate, so this cannot become a
                                     # districts: block the way Israel's 47-region CBS
                                     # table could
  confidence_ceiling: measured
  notes: >-
    Same extraction path as the GAIN report: WebFetch's summarizer refused
    the PDF as binary; `fitz` on the saved file produced 31,899 characters
    of clean text (Redalyc's PDFs are not font-encoded, unlike OECD-FAO's).

    The number this project actually wanted: "En el mismo año México
    produjo 3,447.6 miles de toneladas de carne de pollo (Servicio de
    Información Agroalimentaria y Pesquera, 9 de octubre de 2020) auspiciada
    por Veracruz con 11.7%, Jalisco con 11.6%, Aguascalientes con 11.5% y
    Querétaro con 10.3%." -- 3,447,600 tonnes of CHICKEN meat (carne de
    pollo, not the "ave" aggregate) for 2019, with a SIAP publication date
    named precisely enough to be a real citation rather than a paraphrase,
    even though the SIAP page itself could not be reached directly. Loaded
    at confidence=measured on that basis -- a peer-reviewed paper naming a
    specific dated government publication is closer to the primary source
    than an attaché report's own Post-level estimate.

    Also carries, from UNA (15 de octubre de 2020), for cross-context only
    and NOT loaded as a corpus figure: 2019 apparent national consumption
    4,121,000 t, per-capita 28.7 kg (pollo) vs pork 16 kg vs beef 18 kg,
    imports 550,000 t (76% leg-and-thigh), 2008-2019 CAGR 2.8%/yr, and import
    entry-point shares (68% through the Nuevo León/Tamaulipas/Coahuila
    corridor, 32% through the Baja California/Sonora/Chihuahua corridor).
    The 28.7 kg is the earliest data point in the per-capita trap below.

    STATE PERCENTAGES ARE FOR 2019, NOT 2023-24. A later trade-press source
    (bmeditores, below) gives 2024 percentages in a different order
    (Jalisco ahead of Aguascalientes) from the GAIN report's 2023-24
    ordinal ranking (Aguascalientes ahead of Jalisco) -- a real conflict
    between two sources describing the SAME recent years, not resolved by
    this 2019 figure, which predates both and is not in conflict with
    either on its own terms.

- url: https://bmeditores.mx/avicultura/panorama-de-la-industria-de-la-carne-de-ave-en-mexico
  title: Panorama de la industria de la carne de ave en México
  publisher: BM Editores
  kind: trade_press
  verified_on: '2026-08-16'
  http_status: 200
  subjects: [poultry, mexico, taxonomy, subnational]
  covers:
