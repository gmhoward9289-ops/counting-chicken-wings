    - state_shares_2024
    - self_sufficiency_2023
    - per_capita_trap_entry
  does_not_cover:
    - primary_citation             # does not itself name SIAP/UNA table numbers by date;
                                     # read as trade-press synthesis, not a primary quote
  confidence_ceiling: industry
  notes: >-
    THE TAXONOMY SOURCE. States explicitly: "Carne de ave (poultry meat):
    Includes chicken, poultry products/pasta, and turkey" against "Carne de
    pollo (chicken meat): Specific to chicken only." This is exactly the
    distinction the task asked to resolve, and every figure this project
    loads is deliberately the "pollo" reading, checked against each
    source's own wording rather than assumed.

    2024 state shares: Veracruz 13.6%, Jalisco 11.5%, Aguascalientes 10.7%,
    Querétaro 9.8%, Durango 7.4% (top five = 53.1%, matching UNA's own
    "53.1 por ciento" figure found separately). NOT loaded as a districts:
    table -- see the note on the GAIN report entry for why this conflicts
    with GAIN's ordinal ranking on the Jalisco/Aguascalientes order, and
    why that conflict is left unresolved rather than picked a winner.

    2023 self-sufficiency: 79.6% domestic / 20.4% imports, corroborating
    the GAIN report's own table arithmetic (79.4%) to within 0.2 points --
    the reason self-sufficiency ships as a fact and per-capita does not.

    Also carries a 2023 per-capita figure of 22.4 kg "OCDE/FAO data" --
    the outlier in the per-capita trap, roughly a third BELOW every other
    source found (28.7-37.75 kg). Likely a different definitional basis
    (OECD-FAO outlooks report retail-weight consumption, other sources
    report a mix of carcass-equivalent apparent consumption) but this was
    not chased to ground, the same discipline Israel's plan applied to its
    own per-capita spread. Not loaded.

