# ------------------------------------------- per-capita trap, all sources
#
# Five figures for the same claim, spanning three orders of citation
# quality, none loaded. Recorded together because the pattern itself -- not
# any one number -- is the finding, exactly as Israel's five-figure spread
# was the finding there.
#
#   22.4 kg  (2023, bmeditores, "OCDE/FAO data")
#   28.7 kg  (2019, UNA via Rebollar-Rebollar 2021, peer-reviewed citation)
#   34.5 kg  (2021, CNA)
#   35.82 kg (2025, UNA, own industria page)
#   37.75 kg (2024, USDA FAS GAIN, "estimated")
#
# A ~70% spread across five sources describing the same country and a
# similar span of years is not five measurements of one quantity; it is
# evidence that "per-capita chicken consumption" is not one definition in
# this literature (apparent consumption vs retail purchases vs a
# carcass-weight basis are the likely axes, as with Israel), and no single
# reading is safe to publish as Mexico's number. country.population stays
# NULL for MEX for the same reason it stayed NULL for ISR: it is the
# denominator of a claim this project cannot yet make honestly.
