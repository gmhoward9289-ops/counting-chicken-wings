- url: https://www150.statcan.gc.ca/ (plain curl, no --tlsv1.2)
  title: "StatCan main data host — TLS 1.3 negotiation failure"
  publisher: Statistics Canada
  kind: government
  verified_on: '2026-08-16'
  http_status: 0
  subjects: [infrastructure]
  covers: []
  does_not_cover: [everything]
  notes: >-
    Not a dead source -- recorded because the failure mode is confusing
    enough to cost the next person real time. Plain `curl` to
    www150.statcan.gc.ca resets during the TLS handshake ("schannel: Recv
    failure: Connection was reset") from this sandbox's network path, on
    every attempt, while the same command against www.statcan.gc.ca (a
    different host entirely) succeeds immediately. Adding `--tlsv1.2` to
    force an older handshake against www150 fixes it completely and every
    subsequent request in this file used that flag. Whatever sits in front
    of this egress point appears to mishandle TLS 1.3 to that specific host.
    A WebFetch attempt at the same URL failed with a generic ECONNRESET
    before this was diagnosed -- if WebFetch or a plain curl fails against
    *only* www150 and no other statcan.gc.ca host, try forcing TLS 1.2
    before concluding the source is unreachable.
