- url: https://apps.fas.usda.gov/newgainapi/api/Search/GetAllGainReports
  title: USDA FAS GAIN report search, queried for UK poultry
  publisher: USDA Foreign Agricultural Service
  kind: government
  verified_on: '2026-08-16'
  http_status: 200
  subjects: [uk, poultry, trade]
  covers: []
  does_not_cover:
    - standalone_uk_poultry_gain_report
  confidence_ceiling: institutional
  notes: >-
    No standalone "United Kingdom Poultry and Products" GAIN report exists,
    the same finding ISRAEL-PLAN.md made for Israel ("Israel gets Grain and
    Feed / Exporter Guide reports, where poultry appears only as feed
    demand"). Post-Brexit, USDA's poultry-specific GAIN coverage of the UK
    market is folded into the EU-wide "Poultry and Products Annual/
    Semi-annual" reports filed from the Paris post, which discuss the UK as
    a trade partner (e.g. "UK now the largest chicken meat supplier to the
    EU") rather than publishing UK production statistics of its own. The
    London post's own GAIN output covers food-and-agricultural-import
    regulations and organic-market reports, not poultry production. So FAS
    GAIN is confirmed as a trade-context source for the UK, not a production
    source -- DEFRA and FAOSTAT remain the two production sources.
