- url: https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Poultry+and+Products+Annual_Brasilia_Brazil_BR2025-0038.pdf
  title: 'Brazil: Poultry and Products Annual (GAIN Report BR2025-0038)'
  publisher: USDA Foreign Agricultural Service (FAS GAIN)
  kind: government
  verified_on: '2026-08-16'
  http_status: 200
  content_type: application/pdf
  bytes: 1200000
  subjects: [poultry, brazil, broiler, trade, subnational]
  covers:
    - national_production_forecast_2026
    - state_share_h1_2025               # sourced by GAIN itself to IBGE, percentages only
    - psd_table_2024_2025_2026
