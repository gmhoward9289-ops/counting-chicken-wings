    because it independently CORROBORATES IBGE's regional concentration:
    its own state map, captioned "Data Source: IBGE" for the first half of
    2025, gives South region 58.48% and Parana 35.2% of national
    production -- close to (and independently arrived at from) this
    project's own IBGE-derived full-year 2025 figures of 57.9% (South
    region: Parana+Santa Catarina+Rio Grande do Sul, computed here) and
    34.8% (Parana alone). Two independent readings of IBGE data, one
    secondhand (GAIN, H1) and one direct (this project's own API query,
    full year), landing within a point of each other is a genuine
    cross-check, not a coincidence.

    PSD table (self-annotated "Source: Not Official USDA Data", so never
    graded above industry regardless of the government publisher): 2025
    "New Post" production 15,355 thousand MT, exports 5,000 thousand MT,
    domestic consumption 10,355 thousand MT. 2024 production 15,000/15,000
    thousand MT (USDA Official / New Post agree). 2026 forecast 15,800/
    15,805 -- a forecast, not loaded, matching this project's convention
    (Mexico's 2025 GAIN forecast was likewise excluded) of loading
    reported/estimated actuals only.
