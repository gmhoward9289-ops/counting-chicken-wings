  confidence_ceiling: industry
  notes: >-
    Dated September 29, 2025, by Camila Aquino / approved Frederick Giles.
    Read directly with PyMuPDF after WebFetch's own extraction gave
    implausible figures on a first pass (7.70 / 4.06 million tonnes) that
    turned out to be a misreading of the PSD table's columns, not the
    report's real numbers -- corrected by re-extracting the table text
    directly rather than trusting the tool's own summary. NOT used for any
    loaded figure in this project because IBGE's own SIDRA data (above) is
    both more current (full year 2025 vs this report's H1 2025 map) and a
    step closer to the primary source (IBGE directly, vs GAIN quoting
