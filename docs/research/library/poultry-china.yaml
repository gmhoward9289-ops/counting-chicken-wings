# Source library -- Chinese poultry.
#
# Produced 2026-08-16, mirroring the format and discipline of
# ../poultry-mexico.yaml: every URL below was actually fetched and its
# outcome recorded, live or dead, because a dead source costs the next
# attempt the same hour it cost this one.
#
# THE SHAPE OF THIS RESEARCH PASS, stated up front because it differs from
# every prior country:
#
#   * China's National Bureau of Statistics (NBS) IS reachable -- unlike
#     Mexico's SIAP or Israel's Ministry of Agriculture, there was no DNS
#     failure, no connection refusal, no 403. The national communique loaded
#     cleanly and is genuinely government-grade. And it STILL could not
#     answer this project's question: NBS publishes poultry meat (禽肉) only
#     as an all-species aggregate, with chicken (鸡肉/肉鸡) never broken out
#     separately anywhere this pass found. Reachability and taxonomy fit
#     turned out to be two independent problems, and China is the first
#     country in this project where the primary source cleared the first
#     hurdle and still failed the second.
#   * Chicken-specific figures reached the corpus the same way Mexico's did
#     -- via USDA FAS GAIN attaché reports, one step removed from the
#     primary agency, each report's own PSD table captioned "Not official
#     USDA data".
#   * PDF text extraction needed PyMuPDF (`fitz`) directly, again -- the
#     WebFetch tool's own text extraction refused every GAIN PDF as binary,
#     but the same files it saved to disk as a side effect extracted
#     cleanly. Third country running (after Mexico, and the same underlying
#     tool behavior) where this exact workaround was needed.
#   * A genuinely new failure mode: `tjj.shandong.gov.cn` (Shandong's own
#     provincial statistics bureau, the presumptive top poultry province)
#     served a TLS certificate for a DIFFERENT subdomain entirely
#     (`*.ybj.shandong.gov.cn`), rejected outright by certificate hostname
#     validation. Not the DNS failure, connection refusal, 403, or TLS
#     handshake reset this project has hit before -- a fifth distinct shape
#     of access failure, worth naming precisely so the next pass does not
#     waste time re-diagnosing it as something else.
#   * A real production-estimate conflict was found and is NOT resolved
#     here: USDA's 15.35 million tonne 2024 chicken meat figure against
#     China's National Broiler Industry Technology System's 22.11+ million
#     tonne figure for the same year (via trade press, not read directly at
#     its primary source). See docs/CHINA-PLAN.md, "The production-estimate
#     conflict", for the full accounting.

- url: https://www.stats.gov.cn/sj/zxfb/202502/t20250228_1958817.html
  title: >-
    中华人民共和国2024年国民经济和社会发展统计公报 (Statistical Communiqué of
    the People's Republic of China on the 2024 National Economic and Social
    Development)
  publisher: National Bureau of Statistics of China (NBS)
  kind: government
  verified_on: '2026-08-16'
  http_status: 200
  content_type: text/html
  subjects: [poultry, china, macroeconomic, agriculture]
  covers:
    - poultry_meat_output_tonnes   # 禽肉 -- ALL poultry, chicken + duck + goose etc.
    - yoy_growth_pct
  does_not_cover:
    - chicken_specific_output      # no 鸡肉/肉鸡 breakout anywhere in the document
    - head_slaughtered             # production section is tonnage only, no bird count
    - provincial_breakdown         # this is the national communique, not a regional one
  confidence_ceiling: measured
  notes: >-
    THE PRIMARY GOVERNMENT SOURCE THIS PASS REACHED, and the clearest
    illustration of the taxonomy trap the research brief warned about: "全年
    猪牛羊禽肉产量9663万吨...禽肉产量2660万吨，增长3.8%" (full-year pork,
    beef, mutton and poultry meat production 96.63 million tonnes...poultry
    meat production 26.6 million tonnes, up 3.8%). 禽肉 sits in the same
    sentence as the other three meats, aggregated across all poultry
    species. Reachable does not mean chicken-specific -- this is a
    genuinely different failure mode from every prior country in this
    project, where the primary source was either reachable AND sufficient
    (Canada, UK) or unreachable entirely (Mexico's SIAP, Israel's ministry
    pages).

- url: https://apps.fas.usda.gov/newgainapi/api/Report/DownloadReportByFileName?fileName=Poultry+and+Products+Annual_Beijing_China+-+People's+Republic+of_CH2025-0170.pdf
  title: 'China: Poultry and Products Annual (GAIN Report CH2025-0170)'
  publisher: USDA Foreign Agricultural Service (FAS GAIN)
  kind: government
  verified_on: '2026-08-16'
  http_status: 200
  content_type: application/pdf
  bytes: 541363
  subjects: [poultry, china, broiler, trade]
  covers:
    - chicken_meat_production_tonnes   # "Meat, Chicken" PSD table, chicken-specific
    - imports_exports_tonnes
    - self_sufficiency_derivable       # production / total supply, same table
    - white_yellow_hybrid_broiler_share  # industry-structure detail, not itself a figure
    - net_exporter_since_2024
  does_not_cover:
    - head_slaughtered                 # no bird count anywhere in the report
    - average_live_weight
    - standing_flock_head
    - output_value_cny
    - provincial_breakdown
  confidence_ceiling: industry
  notes: >-
    Dated September 10, 2025, prepared by Jadon Marianetti and FAS China
    staff. WebFetch's own text extraction refused the PDF as binary; the
    same file was saved to disk by the tool as a side effect and `fitz`
    (PyMuPDF) extracted it cleanly -- 23,339 characters, ordinary embedded
    text, no font-encoding trap, the same pattern Mexico's GAIN PDF showed.

    Table 1 ("Meat, Chicken" PSD, 1,000 MT): Production 15,350 (2024, "USDA
    Official" and "New Post" agree -- a settled actual by this report's
    date) and 16,200 (2025, "New Post" only -- still an in-year estimate,
    loaded provisional). Total imports 477 (2024) / 430 (2025); total
    exports 770 (2024) / 950 (2025); total supply 15,827 (2024) / 16,630
    (2025). Self-sufficiency: 15,350/15,827 = 97.0% (2024), 16,200/16,630 =
    97.4% (2025).

    Structural detail: white broilers ~70% of total chicken meat
    production, yellow broilers 17-20%, hybrid broilers 8-10% ("about five
    years ago, white broilers made up only around 50 percent of
    production").

    CAVEAT CARRIED TO CONFIDENCE GRADE: the table itself is annotated "Note:
    Not official USDA data", directing a reader to PSD Online for the
    official figure -- the same remove as Mexico's GAIN report, and graded
    industry for the same reason.

