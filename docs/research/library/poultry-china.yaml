- url: https://apps.fas.usda.gov/psdonline/circulars/livestock_poultry.pdf
  title: >-
    Livestock and Poultry: World Markets and Trade -- China Chicken Meat
    Exports Continue to Soar in 2026, Surpassing Thailand
  publisher: USDA Foreign Agricultural Service (FAS), World Agricultural
    Outlook Board
  kind: government
  verified_on: '2026-08-16'
  http_status: 200
  content_type: application/pdf
  bytes: 1468108
  subjects: [poultry, china, world_trade, rankings]
  covers:
    - world_rank_chicken_meat_production   # "world's second largest producer"
    - per_capita_consumption_kg            # 11 kg/person, 2025, China
    - net_exporter_status
    - export_import_rank_2025              # 5th largest exporter, 13th largest importer
  does_not_cover:
    - chicken_specific_production_table    # narrative circular, not a PSD table itself
    - provincial_breakdown
  confidence_ceiling: industry
  notes: >-
    Dated April 9, 2026 -- a different USDA publication from the
    country-specific GAIN reports, global in scope. THE SOURCE OF THIS
    PROJECT'S ONE UNCONTESTED WORLD-RANK CLAIM: "China is the world's
    second largest producer of chicken meat, significantly behind the
    United States and often on par with Brazil." Unlike Mexico's
    three-way rank conflict (6th/5th/1st, depending on source and product
    definition), no second source contradicting this one surfaced in this
    pass.

    Per-capita: "China chicken consumption remains relatively low (11
    kg/per capita)" for 2025, against pork (43 kg) and beef (8 kg) within
    China, and the United States (55 kg), Japan (24 kg), Taiwan (42 kg)
    elsewhere. SINGLE-SOURCE -- no independent Chinese domestic per-capita
    figure was found to corroborate or conflict with it in this pass,
    unlike Canada's uncontested AAFC figure or Mexico's five-way spread.

    Also states China became a net chicken-meat exporter in 2024 (exports
    $2.59 billion in 2025, nearly double 2020), ranked world's 5th largest
    chicken-meat exporter and 13th largest importer in 2025.

    PDF text extraction: WebFetch's own summarizer again refused the file
    as binary; `fitz` on the saved file extracted 45,823 characters
    cleanly.

- url: https://www.agripost.cn/2025/02/17/chinas-broiler-industry-in-2024-white-feather-broilers-gain-market-share-as-yellow-feather-chickens-decline/
  title: >-
    China's Broiler Industry in 2024: White-Feather Broilers Gain Market
    Share as Yellow-Feather Chickens Decline
  publisher: AgriPost.CN, citing China's National Broiler Industry
    Technology System (中国肉鸡产业技术体系)
  kind: trade_press
  verified_on: '2026-08-16'
  http_status: 200
  subjects: [poultry, china, broiler, headcount]
  covers:
    - broiler_headcount_2024          # the ONLY broiler-specific bird count found
    - broiler_meat_output_by_breed_2024
    - breed_mix_trend                 # white/yellow/small-white share shift
  does_not_cover:
    - stated_weight_basis             # does NOT say live vs. processed weight
    - provincial_breakdown
    - primary_report_itself           # cites the Technology System, is not that system's own page
  confidence_ceiling: industry
  notes: >-
    THE HEAD COUNT AND THE CONFLICT, in one source. Total broiler output
    14.84 billion birds (2024, +1.02% YoY): white-feather 9.03 billion
    (+2.24%), yellow-feather 3.33 billion (-7.25%), small white-feather
    2.48 billion (+9.36%). Meat output: white-feather 17.79 million tonnes
    (72.17% of total), yellow-feather 4.32 million tonnes (17.53%) -- white
    + yellow ALONE already sum to 22.11 million tonnes, 44% above
    usda-fas-gain-ch2025-0170's 15.35 million tonne "Meat, Chicken" PSD
    figure for the SAME year, and small white-feather tonnage is not even
    included in that sum.

    NEITHER this source NOR the USDA GAIN report states its weight basis
    (live vs. processed/carcass-equivalent) explicitly -- checked directly
    in both PDF/page texts, not assumed absent. This pass does NOT assert
    which basis explains the gap; see docs/CHINA-PLAN.md, "The
    production-estimate conflict", for the full discussion. NOT loaded as
    this project's head_slaughtered figure for exactly this reason -- a
    head count that cannot be reconciled with a compatible tonnage figure
    would silently assert an unverified average bird weight if loaded
    beside the tonnage this project DOES carry.

    Two removes from a primary count: trade press (AgriPost.CN) citing a
    national agricultural technology system (not a statistical agency) by
    name, but this pass did not reach that system's own report directly --
    flagged for a future pass, the same shape of gap Mexico's plan left
    for SIAP's own portal.

- url: http://tjj.shandong.gov.cn/art/2025/1/23/art_6109_10316111.html
  title: 解读：2024年全省畜牧业生产总体平稳 (Interpretation: 2024 provincial
    animal husbandry production overall stable)
  publisher: Shandong Provincial Bureau of Statistics (山东省统计局)
  kind: government
  verified_on: '2026-08-16'
  http_status: null
  covers: []
  does_not_cover:
    - everything   # never successfully fetched
  confidence_ceiling: null
  notes: >-
    NOT REACHED -- a genuinely new failure shape for this project. TLS
    certificate hostname mismatch: the certificate served for
    tjj.shandong.gov.cn is issued for `*.ybj.shandong.gov.cn` and
    `ybj.shandong.gov.cn`, a completely different subdomain, rejected
    outright by certificate hostname validation before any content
    transfers. This is NOT the same failure as Canada's
    www150.statcan.gc.ca TLS 1.3 handshake reset (fixed by forcing TLS
    1.2) -- a cert/hostname mismatch is a configuration problem on the
    server side that a TLS-version flag does not fix, and forcing an older
    TLS version was not attempted in this pass. Flagged as the highest-
    value next step for a Chinese subnational pass: Shandong is
    consistently named (by secondary, unverified sources -- see below) as
    China's leading poultry province by a wide margin, so its own bureau
    would be the natural anchor for a provincial table if this failure
    mode can be worked around.

