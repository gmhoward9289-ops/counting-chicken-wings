[project]
name = "counting-chicken-wings"
version = "1.4.0"
description = "How many chickens does it take to make a dozen chicken wings?"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
dev = [
    "pytest>=8.0",
    # FastAPI's TestClient is a thin wrapper over an HTTP client; without
    # this the API tests cannot run at all.
    # Floor matches starlette's own httpx2>=2.0.0. A looser bound lets a
    # resolver pick an early httpx2 that lacks the API testclient calls.
    "httpx2>=2.0",
]

[project.scripts]
wings = "counting_chicken_wings.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
counting_chicken_wings = ["schema.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
