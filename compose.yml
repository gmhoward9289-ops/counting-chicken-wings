# Deployment on swamplink. The server's post-receive hook runs
# `docker compose up -d --build` from here after every `git push deploy`.
#
# PUBLISHES TO LOCALHOST ONLY, and that is a house rule rather than a
# preference: Caddy is the single public entry point on that box and it
# terminates TLS for every app. A container on 0.0.0.0 would bypass Caddy,
# serve plaintext, and need its own hole in the Hetzner firewall.
#
#   127.0.0.1:8101  ->  container :8000
#
# 8101 because 8100 is api-demo. Ports are recorded in
# /Users/george/swamplink/CHECKPOINT.md; check it before claiming one.
#
# The image build runs the corpus build AND the citation audit (see
# Dockerfile), and the audit exits non-zero on any uncited statistic. So a
# data commit that breaks the guarantee fails `up --build` and the previous
# container keeps serving. That ordering is the whole safety property of this
# deploy; do not move the audit out of the image build.
#
# `name:` is explicit and load-bearing: every app under /srv/apps/*/src/
# shares the literal directory name "src", so Compose's default
# directory-basename project naming collided this container into the same
# "src" project as api-demo. Without this, `docker compose down
# --remove-orphans` run from either directory could remove the other's
# containers as "orphans" of a project it was never part of.
name: wings

services:
  wings:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8000"

    # A/B configuration lives OUTSIDE the git checkout, at
    # /srv/apps/wings/ab.env, because the post-receive hook overwrites
    # src/.env with GIT_COMMIT on every deploy -- anything put there is gone
    # by the next push. It holds WINGS_AB_SPLIT and WINGS_AB_SECRET.
    #
    # Keeping the split there rather than in this file also makes starting
    # and stopping the experiment an operational dial rather than a code
    # change: edit one line on the box and restart, no commit, no deploy.
    #
    # required:false so a local `docker compose up` works without it. Absent
    # the file the split defaults to 0 and nothing is served differently.
    env_file:
      - path: ../ab.env
        required: false

    # The corpus is baked into the image and never written to. Metrics are
    # the opposite: written constantly, and worthless if they do not outlive
    # the container. This is the one piece of state this app has.
    volumes:
      - wings-metrics:/data

    environment:
      # /api/version exists to answer "what am I looking at?", and it answers
      # `null` unless somebody tells it. The hook exports GIT_COMMIT from the
      # pushed revision; the default keeps a bare `docker compose up` honest
      # rather than silently reporting nothing.
      GIT_COMMIT: "${GIT_COMMIT:-}"
      SERVICE_NAME: "wings@swamplink"
      GIT_BRANCH: "master"
      # On the volume, not in the image: an image rebuild happens on every
      # push and would otherwise reset the experiment mid-run.
      WINGS_METRICS_DB: "/data/metrics.db"
    healthcheck:
      # /healthz touches no database and builds no payload -- it exists to be
      # pinged cheaply.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # A CPX11 with 2 GB of RAM runs everything on this box. An unbounded
    # container is one runaway away from taking the others down with it.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Named rather than a bind mount: nothing outside the container needs to read
# this file directly, and `docker compose down` will not take it with it.
# Inspect or clean it with
#   docker compose exec wings wings ab
#   docker compose exec wings wings ab-clean
volumes:
  wings-metrics:
    # Pinned to the volume's current literal name. Without this, renaming the
    # project from "src" to "wings" would make Compose derive a new
    # project-prefixed name (wings_wings-metrics) and start the container
    # against an empty volume -- silently dropping the live A/B metrics.
    name: src_wings-metrics
