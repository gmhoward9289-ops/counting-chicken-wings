# Render blueprint. Connect the repo at https://dashboard.render.com/blueprints
# and Render reads this file -- no dashboard configuration needed.
#
# The database is a build artifact and is gitignored, so it MUST be rebuilt
# during the build step. That is a feature, not a workaround: the deployed
# site is regenerated from the YAML corpus on every push, so a data change
# and a code change ship the same way.
#
# The app is read-only at runtime, which is why there is no disk, no
# database service, and nothing to back up here.

services:
  - type: web
    name: counting-chicken-wings
    runtime: python
    plan: free
    region: ohio
    branch: master

    buildCommand: |
      pip install --upgrade pip
      pip install -e ".[gui]"
      python -m counting_chicken_wings.build
      python -m counting_chicken_wings.audit

    # Render supplies $PORT. Binding to 0.0.0.0 is required; 127.0.0.1 would
    # be unreachable from outside the container.
    startCommand: uvicorn counting_chicken_wings.api:app --host 0.0.0.0 --port $PORT

    # /healthz touches no database and builds no payload. /api/meta was the
    # previous choice and works, but it opens SQLite and serialises the whole
    # loss chain, mixing cascade and producer list just to prove the process
    # is alive.
    healthCheckPath: /healthz

    envVars:
      - key: PYTHON_VERSION
        value: '3.12'

      # Signing key for the A/B variant tokens. Render generates it once and
      # keeps it across deploys, which is the point: a per-process key means
      # every token issued before a restart is refused after one, and those
      # visitors' events are dropped silently.
      - key: WINGS_AB_SECRET
        generateValue: true

      # The experiment is OFF here. Serving a second design to real visitors
      # is a decision to take deliberately, not one to inherit from a merge.
      #
      # Turning it on collects almost nothing as things stand: there is no
      # disk on this service, so metrics.db lives on the container
      # filesystem and is lost on every deploy and every wake from the free
      # tier's idle spin-down. /api/metrics/summary reports
      # `collecting_since` so that shows up as a window that keeps resetting
      # rather than as a quiet week. Run the experiment somewhere with
      # storage, or accept that this only ever measures the last few minutes.
      - key: WINGS_AB_SPLIT
        value: '0'
